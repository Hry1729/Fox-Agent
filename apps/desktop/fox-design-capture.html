<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Fox</title>
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="preload" href="/fonts/vixa-loading.otf" as="font" type="font/otf" crossorigin />
    <link rel="stylesheet" href="/src/app/loading-screen.css" />
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: var(--background); font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
    </style>
    <link rel="stylesheet" href="/src/styles/themes.css" />
    <script src="/theme-init.js"></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script>
    // F8 captures the current modal without clicking outside and dismissing it.
    window.addEventListener('keydown', async (event) => {
      if (event.key !== 'F8' || !window.figma?.captureForDesign) return;
      const params = new URLSearchParams(location.hash.slice(1));
      const captureId = params.get('figmacapture');
      const endpoint = params.get('figmaendpoint');
      if (!captureId || !endpoint) return;
      event.preventDefault();
      await window.figma.captureForDesign({ captureId, endpoint, selector: 'body' });
    });
  </script></head>
  <body>
    <div id="root"><!-- fox-startup-layout --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
