[package]
name = "fox-desktop"
default-run = "fox-desktop"
version = "0.1.0"
description = "Fox desktop agent"
authors = ["Fox Contributors"]
edition = "2021"

[features]
default = ["local-embedding", "zvec"]
zvec = ["dep:zvec-rust", "dep:zvec-rust-sys"]
local-embedding = ["dep:ort", "dep:tokenizers"]
kernel-acceptance = []
# Compatibility flag for existing preview build commands; it does not affect routing: every new Run is PiNative (A0).
kernel-default = []

[[bin]]
name = "kernel-desktop-acceptance"
path = "src/bin/kernel-desktop-acceptance.rs"
required-features = ["kernel-acceptance"]

# Package-2-D closeout: builds the injected U1 parked starting point in the
# isolated acceptance database, using only production APIs. Never in a normal
# production build.
[[bin]]
name = "closeout-u1-fixture"
path = "src/bin/closeout-u1-fixture.rs"
required-features = ["kernel-acceptance"]

# Package-2-D closeout: read-only diagnostic dump of the persisted context-budget
# report, so the real trigger of a compaction stop is established from data.
[[bin]]
name = "closeout-db-dump"
path = "src/bin/closeout-db-dump.rs"
required-features = ["kernel-acceptance"]

# Single-Pi mainline acceptance (2026-10-27) D2/D3: seed the two experts with
# their separate local knowledge bases in an isolated FOX_DATA_DIR, and dump what
# exists. Uses production APIs only and refuses a data directory that holds a
# real user database. Development/acceptance facility; not gated behind a
# feature so `cargo build -p fox-desktop --bin single-pi-acceptance-fixture`
# works with the default feature set.
[[bin]]
name = "single-pi-acceptance-fixture"
path = "src/bin/single-pi-acceptance-fixture.rs"
[[bin]]
name = "local-embedding-smoke"
path = "src/local_embedding.rs"
required-features = ["local-embedding"]

[lib]
name = "fox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
fox-engine-protocol = { path = "../../../crates/fox-engine-protocol" }
fox-agent-kernel = { path = "../../../crates/fox-agent-kernel" }
# Four-agent plan v0.3.1 Host wiring, first batch: only the pure routing /
# identity logic (`host_routing`, `port`) is used, so no feature is enabled
# (the `acp` client is wired in the next batch).
fox-agent-backend = { path = "../../../crates/fox-agent-backend", features = ["acp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
hex = "0.4"
flate2 = "1"
imagesize = "0.13"
krilla = { version = "=0.8.2", default-features = false, features = ["simple-text"] }
ttf-parser = "=0.25.1"
jsonschema = { version = "0.42", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
quick-xml = "0.41"
regex = "1.13.0"
rquickjs = "=0.12.1"
serde = { version = "1", features = ["derive"] }
# raw_value: the run-control integrity check hashes the stored bytes of a
# pre-canonical frozen permission (see database/repositories/run_control.rs).
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
sysinfo = "0.36.1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
toml = "0.8.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zvec-rust = { version = "=0.6.0", optional = true }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries"], optional = true }
tokenizers = { version = "0.21.1", default-features = false, features = ["fancy-regex"], optional = true }
calamine = { version = "0.36.1", default-features = false }
office_oxide = { version = "0.1.9", default-features = false }

[dev-dependencies]
fox-agent-kernel = { path = "../../../crates/fox-agent-kernel", features = ["test-support"] }
zip = { version = "8.6.0", default-features = false }

[target.'cfg(windows)'.dependencies]
zvec-rust-sys = { version = "=0.6.0", optional = true, features = ["bundled"] }
windows = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
