[package]
name = "fox-desktop"
version = "0.1.0"
description = "Fox desktop agent"
authors = ["Fox Contributors"]
edition = "2021"

[lib]
name = "fox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
