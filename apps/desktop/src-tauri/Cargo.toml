[package]
name = "fox-desktop"
default-run = "fox-desktop"
version = "0.1.0"
description = "Fox desktop agent"
authors = ["Fox Contributors"]
edition = "2021"

[features]
default = ["local-embedding", "zvec"]
zvec = ["dep:zvec-rust"]
local-embedding = ["dep:ort"]

[[bin]]
name = "local-embedding-smoke"
path = "src/local_embedding.rs"
required-features = ["local-embedding"]

[lib]
name = "fox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
hex = "0.4"
flate2 = "1"
imagesize = "0.13"
jsonschema = { version = "0.42", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
sysinfo = "0.36.1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
toml = "0.8.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zvec-rust = { version = "0.6.0", optional = true }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
