<!doctype html>
<html lang="zh-CN" data-color-theme="graphite">
<head>
<meta charset="utf-8" />
<title>Fox 本地知识 · 页面重设计</title>
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Regular.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Medium.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Semibold.css" />
<!-- Colours, radii and both modes come straight from the app, so the mockup follows any theme change. -->
<link rel="stylesheet" href="../../../apps/desktop/src/styles/themes.css" />
<script src="icons.js"></script>
<script>
  (() => {
    const params = new URLSearchParams(location.search)
    const theme = params.get('theme') || localStorage.getItem('fox-mock-theme') || 'graphite'
    const mode = params.get('mode') || localStorage.getItem('fox-mock-mode') || 'light'
    document.documentElement.dataset.colorTheme = theme
    document.documentElement.classList.toggle('dark', mode === 'dark')
  })()
</script>
<style>
/* Proposed Paper accent: warm ink instead of Fox blue, so the theme stays one hue
   family like Graphite. Mirror this into themes.css if adopted. The selectors
   out-rank themes.css in both modes (light needs :not(.dark) to avoid tying
   with the theme's own dark rule). */
:root[data-color-theme="paper"]:not(.dark) {
  --primary: oklch(0.3 0.02 60);
  --primary-foreground: oklch(0.985 0.005 85);
  --sidebar-primary: oklch(0.3 0.02 60);
  --sidebar-primary-foreground: oklch(0.985 0.005 85);
  --brand: oklch(0.3 0.02 60);
  --brand-foreground: oklch(0.985 0.005 85);
  --brand-soft: oklch(0.93 0.016 80);
  --ring: oklch(0.62 0.03 65);
  --sidebar-ring: oklch(0.62 0.03 65);
}
:root[data-color-theme="paper"].dark {
  --primary: oklch(0.93 0.012 85);
  --primary-foreground: oklch(0.24 0.012 60);
  --sidebar-primary: oklch(0.93 0.012 85);
  --sidebar-primary-foreground: oklch(0.24 0.012 60);
  --brand: oklch(0.9 0.015 85);
  --brand-foreground: oklch(0.24 0.012 60);
  --brand-soft: oklch(0.33 0.012 70);
  --ring: oklch(0.6 0.02 75);
  --sidebar-ring: oklch(0.6 0.02 75);
}
/* Same derived tokens as apps/desktop/src/styles/globals.css */
:root {
  --content: var(--background);
  --faint: color-mix(in oklch, var(--muted-foreground) 72%, transparent);
  --hover: color-mix(in oklch, var(--muted) 78%, var(--card));
  --selection: var(--card);
  --shadow-sm: 0 1px 2px color-mix(in oklch, var(--foreground) 6%, transparent);
  --shadow-md: 0 4px 16px color-mix(in oklch, var(--foreground) 9%, transparent);
  --shadow-lg: 0 16px 45px color-mix(in oklch, var(--foreground) 12%, transparent);
  --scrim: color-mix(in oklch, var(--background) 45%, transparent);
  --mark: color-mix(in oklch, var(--brand) 16%, transparent);
  font-family: "HarmonyOS Sans SC", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  font-synthesis: none;
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}
.dark {
  color-scheme: dark;
  --content: var(--card);
  --hover: color-mix(in oklch, var(--muted) 82%, var(--card));
  --faint: color-mix(in oklch, var(--muted-foreground) 88%, var(--background));
  --shadow-sm: 0 1px 2px color-mix(in oklch, black 30%, transparent);
  --shadow-md: 0 6px 20px color-mix(in oklch, black 32%, transparent);
  --shadow-lg: 0 18px 55px color-mix(in oklch, black 35%, transparent);
  --scrim: color-mix(in oklch, black 40%, transparent);
  --mark: color-mix(in oklch, var(--brand) 28%, transparent);
}
* { box-sizing: border-box; }
body { margin: 0; background: color-mix(in oklch, var(--shell) 70%, var(--muted)); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Doc shell ---------- */
.doc { width: 1360px; margin: 0 auto; padding: 56px 40px 120px; }
.doc-hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
.doc-hero p { margin: 0; max-width: 820px; color: var(--muted-foreground); font-size: 14px; line-height: 1.75; }
.doc-block { margin-top: 24px; padding: 28px 32px; border-radius: var(--fox-radius-large); background: var(--card); border: 1px solid var(--border); }
.doc-block h2 { margin: 0 0 18px; font-size: 16px; font-weight: 600; }
.principles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.principles b { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.principles span { color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
table.map { width: 100%; border-collapse: collapse; font-size: 13px; }
table.map th { padding: 0 16px 10px 0; color: var(--muted-foreground); font-size: 12px; font-weight: 500; text-align: left; }
table.map td { padding: 12px 16px 12px 0; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.65; color: var(--muted-foreground); }
table.map td:first-child { color: var(--foreground); font-weight: 500; white-space: nowrap; }
table.map td b { color: var(--foreground); font-weight: 500; }
.glossary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 32px; font-size: 13px; }
.glossary div { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.glossary s { color: var(--muted-foreground); text-decoration-color: var(--faint); }
.glossary svg { width: 14px; height: 14px; color: var(--faint); }
.doc-note { margin: 16px 0 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.toc a { padding: 6px 12px; border-radius: var(--fox-radius-control); background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 13px; text-decoration: none; }
.toc a:hover { color: var(--foreground); }
.frame { margin-top: 72px; scroll-margin-top: 80px; }
.frame-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.frame-head .no { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.frame-head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.frame-head p { margin: 0; color: var(--muted-foreground); font-size: 14px; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
.notes div { padding: 16px 18px; border-radius: var(--fox-radius-large); background: var(--card); border: 1px solid var(--border); }
.notes h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.notes h4 svg { width: 14px; height: 14px; color: var(--muted-foreground); }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted-foreground); font-size: 13px; line-height: 1.75; }

/* Theme switcher (mockup only) */
.switcher { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: var(--fox-radius-large); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); font-size: 13px; color: var(--muted-foreground); }
.switcher svg { width: 15px; height: 15px; }
.switcher .seg button { font: inherit; }

/* ---------- App window (ui-improvements chrome) ---------- */
.win { position: relative; width: 1280px; height: 800px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--shell); border: 1px solid var(--border); box-shadow: var(--shadow-lg); color: var(--foreground); font-size: 13px; }
.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; }
.product { display: flex; align-items: center; gap: 10px; height: 100%; padding-left: 6px; }
.product img { width: 19px; height: 19px; border-radius: 5px; }
.product strong { font-size: 13px; font-weight: 600; }
.product .pl { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted-foreground); }
.product nav { display: flex; gap: 3px; margin-left: -4px; }
.product nav span { height: 28px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 6px; color: var(--muted-foreground); }
.wctl { display: flex; height: 100%; }
.wctl span { width: 46px; display: grid; place-items: center; color: var(--muted-foreground); }
.wctl svg { width: 15px; height: 15px; }
.app { flex: 1; min-height: 0; display: flex; }

.side { width: 232px; flex: none; display: flex; flex-direction: column; padding: 0 16px 12px; }
.mode-row { display: flex; align-items: center; gap: 4px; margin: 14px 0 12px; }
.tabs-sm { flex: none; white-space: nowrap; display: inline-flex; padding: 3px; border-radius: var(--fox-radius-card); background: var(--muted); }
.tabs-sm span { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: calc(var(--fox-radius-card) - 2px); color: var(--muted-foreground); font-weight: 500; border: 1px solid transparent; }
.tabs-sm span.on { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: var(--shadow-sm); }
.tabs-sm svg { width: 14px; height: 14px; }
.mode-row .grow { flex: 1; }
.sib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--fox-radius-control); color: var(--muted-foreground); position: relative; }
.sib .dot-red { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--destructive); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav div { height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border-radius: var(--fox-radius-card); color: var(--muted-foreground); font-weight: 500; }
.nav div.on { background: var(--selection); color: var(--foreground); box-shadow: var(--shadow-sm); }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 6px; padding: 0 4px 0 12px; color: var(--muted-foreground); font-size: 12px; }
.sec svg { width: 14px; height: 14px; }
.kbs { display: flex; flex-direction: column; gap: 2px; }
.kb { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: var(--fox-radius-card); color: var(--muted-foreground); }
.kb svg { width: 14px; height: 14px; }
.kb span { flex: 1; }
.kb small { color: var(--faint); font-size: 12px; }
.kb.on { background: var(--selection); color: var(--foreground); font-weight: 500; box-shadow: var(--shadow-sm); }
.kb .spin { color: var(--muted-foreground); }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 0 0 4px; }
.foot img { width: 24px; height: 24px; border-radius: 50%; }
.foot b { flex: 1; font-weight: 500; }

.main { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--content); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-top-left-radius: var(--fox-radius-large); }
.page { height: 100%; padding: 32px 24px 48px; overflow: hidden; }
.col { max-width: 820px; margin: 0 auto; }
.wide { max-width: 940px; margin: 0 auto; }

/* ---------- Components (shadcn-equivalent) ---------- */
.ph { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.ph h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; }
.ph .count { padding-top: 4px; color: var(--faint); font-size: 13px; }
.grow { flex: 1; }
.lead { margin: 4px 0 0; color: var(--muted-foreground); font-size: 13px; }
.btn { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: var(--fox-radius-control); border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-sm); }
.btn.primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
.btn.secondary { border-color: transparent; background: var(--secondary); color: var(--secondary-foreground); box-shadow: none; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-foreground); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.danger { border-color: transparent; background: transparent; box-shadow: none; color: var(--destructive); padding: 0 8px; }
.btn svg { width: 15px; height: 15px; }
.btn.sm svg { width: 14px; height: 14px; }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none; border-radius: var(--fox-radius-control); border: 1px solid transparent; color: var(--muted-foreground); }
.ib.sm { width: 28px; height: 28px; }
.ib.sm svg { width: 15px; height: 15px; }
.ib.on { border-color: var(--border); background: var(--card); color: var(--foreground); }
.dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--success); display: inline-block; }
.dot.brand { background: var(--brand); }
.dot.warn { background: var(--warning); }
.dot.hollow { background: transparent; box-shadow: 0 0 0 1.25px var(--muted-foreground) inset; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; }
.status a { color: var(--foreground); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
.bar { height: 3px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
.fi { width: 18px; height: 18px; color: var(--muted-foreground); stroke-width: 1.75; }
.faint { color: var(--faint); }
.muted { color: var(--muted-foreground); }
.kbd { padding: 1px 6px; border-radius: var(--fox-radius-small); border: 1px solid var(--border); background: var(--background); color: var(--muted-foreground); font-size: 12px; }
mark { padding: 0 2px; border-radius: 3px; background: var(--mark); color: inherit; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--fox-radius-card); background: var(--muted); }
.seg span, .seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: calc(var(--fox-radius-card) - 2px); background: transparent; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
.seg .on { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: var(--shadow-sm); }
.seg small { color: var(--muted-foreground); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.menu { position: absolute; z-index: 6; min-width: 208px; padding: 4px; border-radius: var(--fox-radius-card); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--popover-foreground); font-size: 13px; }
.menu div { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--fox-radius-small); }
.menu div svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.menu div.on { background: var(--accent); }
.menu div small { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu .lbl { height: 26px; color: var(--muted-foreground); font-size: 12px; }
.menu hr { margin: 4px -4px; border: 0; border-top: 1px solid var(--border); }
.menu .danger, .menu .danger svg { color: var(--destructive); }
.search { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; border-radius: var(--fox-radius-card); border: 1px solid var(--input); background: var(--background); color: var(--muted-foreground); font-size: 13px; box-shadow: var(--shadow-sm); }
.search .q { flex: 1; color: var(--foreground); }
.search .phx { flex: 1; }
.search.focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 22%, transparent); }
.thead, .row { display: grid; align-items: center; gap: 12px; }
.thead { height: 32px; border-bottom: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; }
.row { position: relative; border-bottom: 1px solid var(--border); }
.row.hover::before { content: ''; position: absolute; inset: -1px -12px 0; z-index: 0; border-radius: var(--fox-radius-card); background: var(--hover); }
.row > * { position: relative; z-index: 1; min-width: 0; }
.row .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
.row .sub { display: block; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--faint); font-size: 12px; font-weight: 400; }
.row .meta { color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; }
.row .right { text-align: right; }
.acts { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }

/* Home */
.home { max-width: 720px; margin: 0 auto; padding-top: 40px; }
.hello { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.hello img { width: 64px; height: 64px; object-fit: contain; }
.hello h1 { margin: 0 0 4px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; }
.hello p { margin: 0; color: var(--muted-foreground); font-size: 13px; }
.omni { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border-radius: var(--fox-radius-large); border: 1px solid var(--input); background: var(--background); color: var(--muted-foreground); font-size: 14px; box-shadow: var(--shadow-md); }
.omni .phx { flex: 1; }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 12px 2px 0; color: var(--muted-foreground); font-size: 12px; }
.try span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted-foreground); }
.try span svg { width: 13px; height: 13px; color: var(--faint); }
.shead { display: flex; align-items: center; justify-content: space-between; margin: 40px 0 4px; }
.shead h3 { margin: 0; font-size: 14px; font-weight: 600; }
.shead a { display: inline-flex; align-items: center; gap: 2px; color: var(--muted-foreground); font-size: 12px; }
.shead a svg { width: 14px; height: 14px; }
.recent .row { grid-template-columns: 18px 1fr 140px 80px; height: 44px; }
.recent .row:last-child { border-bottom: 0; }
.home-foot { display: flex; align-items: center; gap: 6px; margin-top: 28px; color: var(--muted-foreground); font-size: 12px; }
.home-foot svg { width: 14px; height: 14px; }
.home-foot a { color: var(--foreground); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
.task-chip { position: absolute; top: 16px; right: 20px; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: var(--fox-radius-control); color: var(--muted-foreground); font-size: 12px; }
.task-chip .bar { width: 56px; }
.task-chip svg { width: 14px; height: 14px; }

/* Files */
.ftool { display: flex; align-items: center; gap: 8px; margin: 20px 0 8px; }
.picker { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-radius: var(--fox-radius-control); border: 1px solid var(--border); background: var(--background); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-sm); }
.picker small { color: var(--faint); font-size: 12px; font-weight: 400; }
.picker svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.sortbtn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; }
.sortbtn svg { width: 14px; height: 14px; }
.flist .thead, .flist .row { grid-template-columns: 16px 18px 1fr 64px 72px 128px; }
.flist .row { height: 52px; }
.cb { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--input); background: var(--background); opacity: 0; }
.row.hover .cb, .thead .cb, .row.sel .cb { opacity: 1; }
.row.sel .cb { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
.cb svg { width: 11px; height: 11px; stroke-width: 3; }
.row.sel::before { content: ''; position: absolute; inset: -1px -12px 0; z-index: 0; border-radius: var(--fox-radius-card); background: var(--accent); }
.selbar { position: absolute; left: 50%; bottom: 24px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; transform: translateX(-50%); border-radius: var(--fox-radius-large); background: var(--foreground); color: var(--background); font-size: 13px; box-shadow: var(--shadow-lg); }
.selbar small { opacity: .6; font-size: 12px; }
.selbar .btn { border: 0; background: var(--background); color: var(--foreground); box-shadow: none; }
.selbar .x { width: 28px; height: 28px; display: grid; place-items: center; opacity: .7; }
.selbar .x svg { width: 15px; height: 15px; }

/* KB list */
.kbgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
.kcard { position: relative; overflow: hidden; border-radius: var(--fox-radius-large); border: 1px solid var(--border); background: var(--card); }
.kcard.hover { box-shadow: var(--shadow-md); border-color: color-mix(in oklch, var(--border) 60%, var(--foreground) 12%); }
.cover { position: relative; height: 96px; overflow: hidden; background: var(--muted); }
.cover .big { position: absolute; right: -10px; bottom: -22px; width: 112px; height: 112px; color: color-mix(in oklch, var(--foreground) 7%, transparent); stroke-width: 1.25; }
.cover .glyph { position: absolute; left: 16px; bottom: 14px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--fox-radius-card); background: var(--card); color: var(--foreground); box-shadow: var(--shadow-sm); }
.cover .glyph svg { width: 18px; height: 18px; }
.cover .more { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--fox-radius-control); background: var(--card); color: var(--foreground); box-shadow: var(--shadow-sm); }
.cover .more svg { width: 15px; height: 15px; }
.kbody { padding: 14px 16px 16px; }
.kbody b { display: block; font-size: 14px; font-weight: 600; }

/* Reader */

.radio-row.on .radio { border: 5px solid var(--primary); }

.disclose small { color: var(--faint); font-size: 12px; font-weight: 400; }
.disclose svg { width: 15px; height: 15px; color: var(--muted-foreground); }

.drop small { color: var(--muted-foreground); font-size: 12px; font-weight: 400; }
.dfoot { display: flex; align-items: center; gap: 8px; margin-top: 24px; }

.engine { position: absolute; left: 24px; bottom: 20px; }

/* ---------------- Theme switcher ---------------- */
const THEMES = [['graphite', '石墨'], ['paper', '暖纸'], ['mist', '雾蓝']]
function setTheme(theme, mode) {
  const root = document.documentElement
  if (theme) { root.dataset.colorTheme = theme; localStorage.setItem('fox-mock-theme', theme) }
  if (mode) { root.classList.toggle('dark', mode === 'dark'); localStorage.setItem('fox-mock-mode', mode) }
  render()
}
function renderSwitcher() {
  const root = document.documentElement
  const theme = root.dataset.colorTheme
  const mode = root.classList.contains('dark') ? 'dark' : 'light'
  document.getElementById('switcher').innerHTML = `${I('palette')}
    <div class="seg">${THEMES.map(([k, l]) => `<button class="${theme === k ? 'on' : ''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="seg"><button class="${mode === 'light' ? 'on' : ''}" onclick="setTheme(null,'light')">${I('sun')}浅色</button><button class="${mode === 'dark' ? 'on' : ''}" onclick="setTheme(null,'dark')">${I('moon')}深色</button></div>`
}
