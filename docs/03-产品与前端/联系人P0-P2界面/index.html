<!doctype html>
<html lang="zh-CN" data-color-theme="graphite">
<head>
<meta charset="utf-8" />
<title>Fox 联系人 P0 至 P2 · 界面样稿</title>
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Regular.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Medium.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Semibold.css" />
<!-- Colours, radii and both modes come straight from the app. -->
<link rel="stylesheet" href="../../../apps/desktop/src/styles/themes.css" />
<script src="icons.js"></script>
<script>
  (() => {
    const params = new URLSearchParams(location.search)
    const theme = params.get('theme') || localStorage.getItem('fox-mock-theme') || 'graphite'
    const mode = params.get('mode') || localStorage.getItem('fox-mock-mode') || 'light'
    document.documentElement.dataset.colorTheme = theme
    document.documentElement.classList.toggle('dark', mode === 'dark')
  })()
</script>
<style>
/* Same warm-ink Paper accent as the knowledge mockup, so both mockups agree. */
:root[data-color-theme="paper"]:not(.dark) {
  --primary: oklch(0.3 0.02 60); --primary-foreground: oklch(0.985 0.005 85);
  --brand: oklch(0.3 0.02 60); --brand-foreground: oklch(0.985 0.005 85); --brand-soft: oklch(0.93 0.016 80);
  --ring: oklch(0.62 0.03 65);
}
:root[data-color-theme="paper"].dark {
  --primary: oklch(0.93 0.012 85); --primary-foreground: oklch(0.24 0.012 60);
  --brand: oklch(0.9 0.015 85); --brand-foreground: oklch(0.24 0.012 60); --brand-soft: oklch(0.33 0.012 70);
  --ring: oklch(0.6 0.02 75);
}
:root {
  --content: var(--background);
  --faint: color-mix(in oklch, var(--muted-foreground) 72%, transparent);
  --hover: color-mix(in oklch, var(--muted) 78%, var(--card));
  --selection: var(--card);
  --shadow-sm: 0 1px 2px color-mix(in oklch, var(--foreground) 6%, transparent);
  --shadow-md: 0 4px 16px color-mix(in oklch, var(--foreground) 9%, transparent);
  --shadow-lg: 0 16px 45px color-mix(in oklch, var(--foreground) 12%, transparent);
  --scrim: color-mix(in oklch, var(--background) 45%, transparent);
  --mark: color-mix(in oklch, var(--brand) 16%, transparent);
  /* Rakazo: the user's bubble is the strong one, the contact's sits on muted. */
  --ub: var(--primary);
  --ub-fg: var(--primary-foreground);
  --cb: var(--muted);
  font-family: "HarmonyOS Sans SC", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  font-synthesis: none;
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}
.dark {
  color-scheme: dark;
  --content: var(--card);
  --hover: color-mix(in oklch, var(--muted) 82%, var(--card));
  --faint: color-mix(in oklch, var(--muted-foreground) 88%, var(--background));
  --shadow-sm: 0 1px 2px color-mix(in oklch, black 30%, transparent);
  --shadow-md: 0 6px 20px color-mix(in oklch, black 32%, transparent);
  --shadow-lg: 0 18px 55px color-mix(in oklch, black 35%, transparent);
  --scrim: color-mix(in oklch, black 40%, transparent);
  --mark: color-mix(in oklch, var(--brand) 28%, transparent);
  --ub: color-mix(in oklch, var(--foreground) 27%, var(--card));
  --ub-fg: var(--foreground);
  --cb: color-mix(in oklch, var(--foreground) 8%, var(--card));
}
* { box-sizing: border-box; }
body { margin: 0; background: color-mix(in oklch, var(--shell) 70%, var(--muted)); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
code, .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }

/* ---------- Doc shell (same as the knowledge mockup) ---------- */
.doc { width: 1360px; margin: 0 auto; padding: 56px 40px 120px; }
.doc-hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
.doc-hero p { margin: 0; max-width: 860px; color: var(--muted-foreground); font-size: 14px; line-height: 1.75; }
.doc-block { margin-top: 24px; padding: 28px 32px; border-radius: var(--fox-radius-large); background: var(--card); border: 1px solid var(--border); }
.doc-block h2 { margin: 0 0 18px; font-size: 16px; font-weight: 600; }
.principles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.principles b { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.principles span { color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
table.map { width: 100%; border-collapse: collapse; font-size: 13px; }
table.map th { padding: 0 16px 10px 0; color: var(--muted-foreground); font-size: 12px; font-weight: 500; text-align: left; }
table.map td { padding: 12px 16px 12px 0; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.65; color: var(--muted-foreground); }
table.map td:first-child { color: var(--foreground); font-weight: 500; white-space: nowrap; }
table.map td b { color: var(--foreground); font-weight: 500; }
table.map td:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
.glossary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 32px; font-size: 13px; }
.glossary div { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.glossary s { color: var(--muted-foreground); text-decoration-color: var(--faint); }
.glossary svg { width: 14px; height: 14px; color: var(--faint); }
.doc-note { margin: 16px 0 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.toc a { padding: 6px 12px; border-radius: var(--fox-radius-control); background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 13px; text-decoration: none; }
.toc a:hover { color: var(--foreground); }
.frame { margin-top: 72px; scroll-margin-top: 80px; }
.frame-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.frame-head .no { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.frame-head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.frame-head p { margin: 0; color: var(--muted-foreground); font-size: 14px; }
.frame-head .ids { margin-left: auto; display: flex; gap: 6px; }
.frame-head .ids span { padding: 2px 8px; border-radius: var(--fox-radius-small); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; }
.frame-row { display: flex; align-items: flex-start; gap: 32px; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
.frame-row .notes { grid-template-columns: 1fr; margin-top: 0; flex: 1; }
.notes div { padding: 16px 18px; border-radius: var(--fox-radius-large); background: var(--card); border: 1px solid var(--border); }
.notes h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.notes h4 svg { width: 14px; height: 14px; color: var(--muted-foreground); }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted-foreground); font-size: 13px; line-height: 1.75; }
.switcher { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: var(--fox-radius-large); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); font-size: 13px; color: var(--muted-foreground); }
.switcher svg { width: 15px; height: 15px; }
.switcher .seg button { font: inherit; }

/* ---------- App window ---------- */
.win { position: relative; width: 1280px; height: 800px; flex: none; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--shell); border: 1px solid var(--border); box-shadow: var(--shadow-lg); color: var(--foreground); font-size: 13px; }
.win.narrow { width: 390px; }
.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; }
.product { display: flex; align-items: center; gap: 10px; height: 100%; padding-left: 6px; }
.product img { width: 19px; height: 19px; border-radius: 5px; }
.product strong { font-size: 13px; font-weight: 600; }
.product .pl { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted-foreground); }
.product nav { display: flex; gap: 3px; margin-left: -4px; }
.product nav span { height: 28px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 6px; color: var(--muted-foreground); }
.wctl { display: flex; height: 100%; }
.wctl span { width: 46px; display: grid; place-items: center; color: var(--muted-foreground); }
.wctl svg { width: 15px; height: 15px; }
.narrow .wctl span { width: 40px; }
.app { flex: 1; min-height: 0; display: flex; }

.side { width: 232px; flex: none; display: flex; flex-direction: column; padding: 0 12px 12px; }
.mode-row { display: flex; align-items: center; gap: 4px; margin: 14px 4px 12px; }
.tabs-sm { flex: none; white-space: nowrap; display: inline-flex; padding: 3px; border-radius: var(--fox-radius-card); background: var(--muted); }
.tabs-sm span { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: calc(var(--fox-radius-card) - 2px); color: var(--muted-foreground); font-weight: 500; border: 1px solid transparent; }
.tabs-sm span.on { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: var(--shadow-sm); }
.tabs-sm svg { width: 14px; height: 14px; }
.sib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--fox-radius-control); color: var(--muted-foreground); position: relative; flex: none; }
.sib .dot-red { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--destructive); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav div { height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border-radius: var(--fox-radius-card); color: var(--muted-foreground); font-weight: 500; }
.nav div.em { color: var(--foreground); }
.nav kbd { margin-left: auto; color: var(--faint); font: inherit; font-size: 12px; font-weight: 400; }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 4px; padding: 0 4px 0 12px; color: var(--muted-foreground); font-size: 12px; }
.sec svg { width: 14px; height: 14px; }
.crow { position: relative; height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 10px; border-radius: var(--fox-radius-card); color: var(--foreground); }
.crow.on { background: var(--selection); box-shadow: var(--shadow-sm); }
.crow .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.crow.quiet .nm { color: var(--muted-foreground); }
.crow > svg { width: 13px; height: 13px; color: var(--faint); }
.crow .spin { color: var(--muted-foreground); }
.cnt { min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; border-radius: 9px; background: var(--foreground); color: var(--background); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cnt.quiet { background: transparent; color: var(--muted-foreground); box-shadow: 0 0 0 1px var(--border) inset; }
.need { height: 18px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 9px; background: color-mix(in oklch, var(--warning) 16%, transparent); color: var(--warning); font-size: 11px; font-weight: 500; }
.convs div { height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: var(--fox-radius-card); color: var(--muted-foreground); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 0 0 4px; }
.foot img { width: 24px; height: 24px; border-radius: 50%; }
.foot b { flex: 1; font-weight: 500; }

.main { position: relative; flex: 1; min-width: 0; overflow: hidden; display: flex; background: var(--content); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-top-left-radius: var(--fox-radius-large); }
.narrow .main { border-left: 0; border-top-left-radius: 0; }

/* ---------- Generic controls ---------- */
.grow { flex: 1; }
.btn { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: var(--fox-radius-control); border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-sm); }
.btn.primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-foreground); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.danger { border-color: transparent; background: var(--destructive); color: white; }
.btn svg { width: 15px; height: 15px; }
.btn.sm svg { width: 14px; height: 14px; }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none; border-radius: var(--fox-radius-control); border: 1px solid transparent; color: var(--muted-foreground); }
.ib.sm { width: 28px; height: 28px; }
.ib.sm svg { width: 15px; height: 15px; }
.ib.on { border-color: var(--border); background: var(--card); color: var(--foreground); }
.dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--success); display: inline-block; }
.dot.warn { background: var(--warning); }
.dot.bad { background: var(--destructive); }
.dot.hollow { background: transparent; box-shadow: 0 0 0 1.25px var(--muted-foreground) inset; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
.status a, a.lk { color: var(--foreground); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
.faint { color: var(--faint); }
.muted { color: var(--muted-foreground); }
mark { padding: 0 2px; border-radius: 3px; background: var(--mark); color: inherit; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--fox-radius-card); background: var(--muted); }
.seg span, .seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: calc(var(--fox-radius-card) - 2px); background: transparent; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
.seg .on { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: var(--shadow-sm); }
.seg small { color: var(--muted-foreground); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.seg.xs span { height: 24px; padding: 0 8px; font-size: 12px; }
.menu { position: absolute; z-index: 6; min-width: 196px; padding: 4px; border-radius: var(--fox-radius-card); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--popover-foreground); font-size: 13px; }
.menu > div { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: var(--fox-radius-small); }
.menu > div > svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.menu > div.on { background: var(--accent); }
.menu > div small { margin-left: auto; padding-left: 16px; color: var(--faint); font-size: 12px; }
.menu > div.off { color: var(--faint); }
.menu .lbl { min-height: 26px; color: var(--muted-foreground); font-size: 12px; }
.menu .two { align-items: flex-start; padding-top: 7px; padding-bottom: 7px; }
.menu .two > svg { margin-top: 2px; }
.menu .two b { display: block; font-weight: 400; }
.menu .two em { display: block; margin-top: 1px; color: var(--muted-foreground); font-size: 12px; font-style: normal; }
.menu .tick { width: 15px; height: 15px; flex: none; }
.menu hr { margin: 4px -4px; border: 0; border-top: 1px solid var(--border); }
.menu .danger, .menu .danger svg { color: var(--destructive); }
.menu .hint { min-height: 0; padding: 6px 8px 4px; color: var(--faint); font-size: 12px; line-height: 1.6; }
.sw { position: relative; width: 30px; height: 18px; flex: none; border-radius: 9px; background: var(--input); }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--background); box-shadow: var(--shadow-sm); }
.sw.on { background: var(--primary); }
.sw.on::after { left: 14px; background: var(--primary-foreground); }
.cb { width: 16px; height: 16px; display: grid; place-items: center; flex: none; border-radius: 4px; border: 1px solid var(--input); background: var(--background); }
.cb svg { width: 11px; height: 11px; stroke-width: 3; opacity: 0; }
.cb.on { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
.cb.on svg { opacity: 1; }
.tag { height: 18px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: var(--fox-radius-small); background: var(--muted); color: var(--muted-foreground); font-size: 11px; font-weight: 500; white-space: nowrap; }
.scrim { position: absolute; inset: 0; z-index: 4; background: var(--scrim); backdrop-filter: blur(4px); }
.dialog { position: absolute; top: 50%; left: 50%; z-index: 5; width: 440px; padding: 24px; transform: translate(-50%, -50%); border-radius: var(--fox-radius-overlay); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
.dialog h3 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog .desc { margin: 6px 0 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
.dlist { margin-top: 16px; border-top: 1px solid var(--border); }
.dlist div { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.dlist div svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.dlist div span { flex: 1; }
.dlist div small { color: var(--faint); font-size: 12px; }
.dfoot { display: flex; align-items: center; gap: 8px; margin-top: 24px; }
.toast { position: absolute; right: 20px; bottom: 20px; z-index: 8; width: 320px; display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--fox-radius-card); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
.toast img { width: 32px; height: 32px; border-radius: 50%; }
.toast b { display: block; font-size: 13px; font-weight: 600; }
.toast p { margin: 2px 0 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }
.toast small { margin-left: auto; color: var(--faint); font-size: 11px; white-space: nowrap; }

/* ---------- Contact chat ---------- */
.chat { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ctop { position: absolute; top: 0; left: 0; right: 0; z-index: 3; height: 84px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; padding: 12px 12px 0 16px; background: linear-gradient(var(--content) 32%, transparent); }
.ctop .l, .ctop .r { height: 36px; display: flex; align-items: center; gap: 2px; }
.ctop .r { justify-content: flex-end; }
.narrow .ctop { padding: 10px 6px 0; }
.who { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 5px; border-radius: 18px; background: var(--popover); box-shadow: 0 0 0 1px var(--border), var(--shadow-sm); }
.who img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.who b { font-size: 14px; font-weight: 600; white-space: nowrap; }
.stream { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.lane { max-width: 720px; margin: 0 auto; padding: 0 32px; }
.stream .lane { position: absolute; left: 0; right: 0; bottom: 8px; }
.stream.top .lane { top: 60px; bottom: auto; }
.day { margin: 22px 0 6px; color: var(--faint); font-size: 12px; text-align: center; }
.unread-line { display: flex; align-items: center; gap: 12px; margin: 22px 0 4px; color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
.unread-line::before, .unread-line::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
.g { display: flex; gap: 10px; margin-top: 16px; }
.g.me { justify-content: flex-end; }
.gav { width: 28px; height: 28px; flex: none; border-radius: 50%; object-fit: cover; }
.gcol { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; max-width: 80%; }
.g.me .gcol { align-items: flex-end; max-width: 76%; }
.src { display: flex; align-items: center; gap: 6px; margin: 2px 0 2px 2px; color: var(--muted-foreground); font-size: 12px; }
.src svg { width: 13px; height: 13px; }
.m { position: relative; max-width: 100%; }
.m.rx-gap { margin-bottom: 12px; }
.b { padding: 10px 16px; border-radius: 18px; background: var(--cb); color: var(--foreground); font-size: 14px; line-height: 22px; overflow-wrap: anywhere; }
.g.me .b { background: var(--ub); color: var(--ub-fg); }
.b p { margin: 0; }
.b p + p, .b p + ul, .b ul + p { margin-top: 8px; }
.b ul { margin: 0; padding-left: 18px; }
.b.hit { box-shadow: 0 0 0 2px color-mix(in oklch, var(--ring) 55%, transparent); }
.b.sel { background: color-mix(in oklch, var(--foreground) 7%, var(--cb)); }
.mx .menu { top: calc(100% + 6px); left: 6px; }
.mx .emo { top: auto; bottom: calc(100% + 6px); left: 6px; display: flex; gap: 2px; min-width: 0; padding: 6px; border-radius: 16px; }
.mx .emo > div { width: 40px; height: 40px; justify-content: center; padding: 0; font-size: 20px; border-radius: 10px; }
.b.hit mark { background: color-mix(in oklch, var(--brand) 26%, transparent); }
.mx { position: absolute; bottom: 4px; left: 100%; display: none; align-items: center; gap: 0; padding-left: 6px; white-space: nowrap; color: var(--muted-foreground); }
.g.me .mx { left: auto; right: 100%; padding: 0 6px 0 0; flex-direction: row-reverse; }
.m.hov .mx { display: flex; }
.mx .ib { width: 28px; height: 28px; }
.mx .ib svg { width: 15px; height: 15px; stroke-width: 1.7; }
.mx .ib.on { border-color: transparent; background: var(--accent); color: var(--foreground); }
.mx time { padding: 0 6px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.rx { position: absolute; right: 12px; bottom: -14px; height: 24px; display: inline-flex; align-items: center; gap: 2px; padding: 0 7px; border-radius: 12px; background: var(--content); box-shadow: 0 0 0 1px var(--border), var(--shadow-sm); font-size: 13px; }
.qref { max-width: 100%; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; box-shadow: 0 0 0 1px var(--border) inset; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; overflow: hidden; }
.qref svg { width: 12px; height: 12px; flex: none; }
.qref b { color: var(--foreground); font-weight: 500; flex: none; }
.qref span { overflow: hidden; text-overflow: ellipsis; }
.art { width: 300px; display: flex; align-items: center; gap: 10px; margin-top: 2px; padding: 9px 8px 9px 12px; border-radius: var(--fox-radius-card); background: var(--content); box-shadow: 0 0 0 1px var(--border) inset; }
.art > svg { width: 20px; height: 20px; color: var(--muted-foreground); }
.art div { flex: 1; min-width: 0; }
.art b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
.art small { color: var(--faint); font-size: 12px; }
.notice { display: flex; justify-content: center; gap: 6px; margin: 18px 0 2px; color: var(--muted-foreground); font-size: 12px; }
.notice svg { width: 13px; height: 13px; margin-top: 2px; color: var(--faint); }

/* Decision card: the existing vertical-choice card, placed on the contact side. */
.dc { width: 440px; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: var(--fox-radius-large); background: var(--cb); }
.dc header b { display: block; font-size: 14px; font-weight: 600; }
.dc header small { display: block; margin-top: 2px; color: var(--muted-foreground); font-size: 12px; }
.dc .op { padding: 10px 12px; border-radius: var(--fox-radius-control); background: var(--content); font-size: 13px; line-height: 1.7; }
.dc .op small { display: block; margin-bottom: 2px; color: var(--faint); font-size: 12px; }
.chs { display: flex; flex-direction: column; gap: 4px; }
.chs div { min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: var(--fox-radius-control); border: 1px solid transparent; background: color-mix(in oklch, var(--content) 55%, transparent); font-size: 13px; }
.chs div.hov { background: var(--accent); }
.chs i { width: 22px; height: 22px; display: grid; place-items: center; border-radius: var(--fox-radius-control); background: var(--content); color: var(--muted-foreground); font-size: 12px; font-style: normal; }
.dc .more { display: flex; align-items: center; gap: 4px; color: var(--muted-foreground); font-size: 12px; }
.dc .more svg { width: 13px; height: 13px; }
.dc .rc { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dc .rc svg { width: 15px; height: 15px; color: var(--success); }
.dc.off { opacity: .72; }

/* Task card */
.tc { width: 380px; padding: 14px 14px 12px 16px; border-radius: var(--fox-radius-large); background: var(--content); box-shadow: 0 0 0 1px var(--border) inset, var(--shadow-sm); }
.tc-h { display: flex; align-items: center; gap: 10px; }
.tc-h .ic { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: var(--fox-radius-card); background: var(--muted); }
.tc-h b { display: block; font-size: 14px; font-weight: 600; }
.tc-h small { color: var(--muted-foreground); font-size: 12px; }
.tc dl { display: grid; grid-template-columns: 64px 1fr; gap: 6px 12px; margin: 14px 0 12px; font-size: 13px; }
.tc dt { color: var(--muted-foreground); }
.tc dd { margin: 0; }
.tc-f { display: flex; align-items: center; gap: 4px; padding-top: 10px; border-top: 1px solid var(--border); }

/* Composer */
.dock { flex: none; padding: 0 0 12px; }
.wstat { display: flex; align-items: center; gap: 8px; height: 32px; margin-bottom: 6px; padding: 0 6px; color: var(--muted-foreground); font-size: 12px; }
.wstat img { width: 20px; height: 20px; border-radius: 50%; }
.wstat img.pulse { opacity: .6; }
.wstat .warn { color: var(--warning); font-weight: 500; }
.comp { display: flex; align-items: center; gap: 4px; min-height: 50px; padding: 6px; border-radius: 25px; border: 1px solid var(--input); background: var(--background); box-shadow: var(--shadow-md); }
.dark .comp { background: color-mix(in oklch, var(--foreground) 4%, var(--card)); }
.comp .plus { width: 36px; height: 36px; display: grid; place-items: center; flex: none; border-radius: 50%; color: var(--muted-foreground); }
.comp .plus svg { width: 20px; height: 20px; stroke-width: 1.6; }
.comp .tx { flex: 1; min-width: 0; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; line-height: 22px; color: var(--muted-foreground); }
.comp .tx.typed { color: var(--foreground); }
.comp .tx.typed::after { content: ''; display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--foreground); }
.qd { display: flex; align-items: center; gap: 8px; margin: 0 14px 6px; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--muted); font-size: 12px; }
.qd > svg { width: 14px; height: 14px; color: var(--muted-foreground); }
.qd b { flex: none; font-weight: 500; }
.qd span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted-foreground); }
.send { width: 36px; height: 36px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); }
.cfoot { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 0; color: var(--muted-foreground); font-size: 12px; }
.cfoot span { display: inline-flex; align-items: center; gap: 6px; }
.cfoot svg { width: 13px; height: 13px; }
.cfoot img { width: 16px; height: 16px; border-radius: 50%; }
.jump { position: absolute; left: 50%; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; transform: translateX(-50%); border-radius: 15px; background: var(--popover); box-shadow: 0 0 0 1px var(--border), var(--shadow-md); color: var(--foreground); font-size: 12px; font-weight: 500; }
.jump svg { width: 14px; height: 14px; }

/* Search */
.sbar { width: 520px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 14px; border-radius: 18px; border: 1px solid var(--ring); background: var(--background); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 20%, transparent); font-size: 13px; color: var(--muted-foreground); }
.sbar .q { flex: 1; color: var(--foreground); }
.sbar .q::after { content: ''; display: inline-block; width: 1.5px; height: 15px; margin-left: 1px; vertical-align: -2px; background: var(--foreground); }
.schip { display: flex; align-items: center; gap: 2px; height: 36px; padding: 0 4px 0 14px; border-radius: 18px; background: var(--popover); box-shadow: 0 0 0 1px var(--border), var(--shadow-sm); font-size: 12px; }
.schip b { font-weight: 500; }
.schip span { padding: 0 6px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.sres { position: absolute; top: 56px; left: 50%; z-index: 6; width: 620px; transform: translateX(-50%); padding: 6px; border-radius: var(--fox-radius-large); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
.sres-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px 10px; color: var(--muted-foreground); font-size: 12px; }
.sr { position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 10px 10px 8px; border-radius: var(--fox-radius-card); }
.sr.on { background: var(--accent); }
.sr img, .sr .me-av { width: 22px; height: 22px; border-radius: 50%; }
.me-av { display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); font-size: 11px; font-weight: 600; }
.sr b { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.sr p { margin: 2px 0 0; font-size: 13px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sr time { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sres-f { display: flex; gap: 14px; padding: 10px 8px 4px; border-top: 1px solid var(--border); margin-top: 4px; color: var(--faint); font-size: 12px; }
.kbd { padding: 0 5px; border-radius: var(--fox-radius-small); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 11px; }

/* ---------- Profile pane ---------- */
.pane { position: relative; width: 360px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--pane); }
:root { --pane: color-mix(in oklch, var(--muted) 45%, var(--background)); }
.dark { --pane: color-mix(in oklch, var(--background) 55%, var(--card)); }
.pane-x { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 2px; }
.pane-h { display: flex; flex-direction: column; align-items: center; padding: 30px 24px 0; text-align: center; }
.pane-h img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.pane-h b { margin-top: 10px; font-size: 17px; font-weight: 600; }
.pane-h small { margin-top: 3px; color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }
.pane-sub { display: flex; align-items: center; gap: 6px; height: 52px; flex: none; padding: 0 10px 0 8px; }
.pane-sub b { font-size: 14px; font-weight: 600; }
.ptabs { display: flex; justify-content: center; gap: 2px; margin: 14px 0 2px; }
.ptabs span { height: 28px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 14px; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
.ptabs span.on { background: color-mix(in oklch, var(--foreground) 8%, transparent); color: var(--foreground); }
.pbody { flex: 1; min-height: 0; overflow: hidden; padding: 0 16px 16px; }
.glabel { margin: 16px 4px 6px; color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
.grp { border-radius: 12px; background: var(--content); border: 1px solid var(--border); }
.grp > * + * { border-top: 1px solid var(--border); }
.grp > :first-child { border-top-left-radius: 11px; border-top-right-radius: 11px; }
.grp > :last-child { border-bottom-left-radius: 11px; border-bottom-right-radius: 11px; }
.gr { position: relative; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 12px; }
.gr.hov { background: var(--hover); }
.gr > svg:first-child { width: 16px; height: 16px; color: var(--muted-foreground); }
.gr > .dot:first-child { margin: 0 5px; }
.gr .k { flex: 1; min-width: 0; }
.gr .k b { display: block; font-size: 13px; font-weight: 400; }
.gr .k small { display: block; margin-top: 1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted-foreground); font-size: 12px; }
.gr .v { display: inline-flex; align-items: center; gap: 4px; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gr .v svg { width: 15px; height: 15px; color: var(--faint); }
.gr .menu { top: calc(100% - 4px); right: 6px; }
.gr.sub { min-height: 34px; padding-left: 50px; }
.gr .lg { width: 28px; height: 28px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--muted); color: var(--foreground); }
.gr .boundary { margin: 0; }
.grp .lrow { padding: 8px 12px; border-bottom: 0; }
.grp .lrow.hov { background: var(--hover); }
.grp .lrow.hov::before { display: none; }
.ptool { display: flex; align-items: center; gap: 8px; margin: 8px 4px 10px; }
.srow { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.srow:last-child { border-bottom: 0; }
.srow > div:first-child { flex: 1; min-width: 0; }
.srow b { display: block; font-size: 13px; font-weight: 500; }
.srow small { display: block; margin-top: 2px; color: var(--muted-foreground); font-size: 12px; line-height: 1.55; }
.srow > svg { width: 15px; height: 15px; color: var(--faint); }
.pick { height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 10px; border-radius: var(--fox-radius-control); color: var(--foreground); font-size: 13px; white-space: nowrap; }
.pick.on { background: var(--accent); }
.pick svg { width: 14px; height: 14px; color: var(--muted-foreground); }
.pick em { color: var(--faint); font-style: normal; }
.path { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
.path code { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted-foreground); }
.boundary { display: flex; gap: 8px; margin: 6px 0 4px 26px; padding: 8px 10px; border-radius: var(--fox-radius-control); background: var(--muted); color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }
.boundary svg { width: 14px; height: 14px; margin-top: 2px; flex: none; }
.conn { padding: 10px 0; border-bottom: 1px solid var(--border); }
.conn-h { display: flex; align-items: center; gap: 10px; }
.conn-h .lg { width: 28px; height: 28px; display: grid; place-items: center; flex: none; border-radius: 8px; background: var(--muted); color: var(--foreground); font-size: 12px; font-weight: 600; }
.conn-h div { flex: 1; min-width: 0; }
.conn-h b { display: block; font-size: 13px; font-weight: 500; }
.conn-h > svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.tools { margin: 8px 0 0 38px; }
.tools div { height: 32px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.tools div span:nth-child(2) { flex: 1; }
.tools div.off span:nth-child(2) { color: var(--muted-foreground); }
.pfoot { padding: 4px 20px 16px; color: var(--faint); font-size: 12px; line-height: 1.6; }
.lrow { position: relative; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.lrow.hov::before { content: ''; position: absolute; inset: -1px -10px 0; z-index: 0; border-radius: var(--fox-radius-card); background: var(--hover); }
.lrow > * { position: relative; z-index: 1; }
.lrow > svg { width: 18px; height: 18px; color: var(--muted-foreground); }
.lrow .tx { flex: 1; min-width: 0; }
.lrow .tx b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
.lrow .tx small { display: block; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted-foreground); font-size: 12px; }
.lrow .tx p { margin: 3px 0 0; font-size: 13px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lrow .meta { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lrow .acts { display: flex; gap: 0; }
.lrow.gone .tx b { color: var(--muted-foreground); }
.lrow.fav { align-items: flex-start; }
.lrow.fav img, .lrow.fav .me-av { width: 22px; height: 22px; border-radius: 50%; margin-top: 2px; }
.hgroup { margin: 18px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
.hrow { display: grid; grid-template-columns: 6px 1fr auto; align-items: center; gap: 10px; min-height: 40px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.hrow small { display: block; color: var(--muted-foreground); font-size: 12px; }
.hrow .t { color: var(--faint); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }


/* Narrow (phone-width window) */
.narrow .lane { padding: 0 14px; }
.narrow .gcol { max-width: 86%; }
.narrow .g.me .gcol { max-width: 84%; }
.mxb { display: flex; align-items: center; gap: 0; margin-top: 2px; color: var(--muted-foreground); }
.mxb .ib { width: 40px; height: 36px; }
.mxb time { padding: 0 6px; color: var(--faint); font-size: 12px; }

body.single { background: var(--shell); }
body.single .doc { width: auto; padding: 0; margin: 0; }
body.single .win { border: 0; border-radius: 0; box-shadow: none; }
body.single .switcher { display: none; }
</style>

<body>
<div class="switcher" id="switcher"></div>
<div class="doc" id="doc"></div>
<script>
const ASSET = '../../../apps/desktop/public'
const I = (name, cls = '', style = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"${style ? ` style="${style}"` : ''}>${window.FOX_ICONS[name] || ''}</svg>`
const AV = (file) => `${ASSET}/avatars/${file}`
const C = {
  zl: { name: '资料伙伴', img: AV('experts/Fox_ResearchAnalyst.png'), duty: '整理资料、核对数据' },
  fox: { name: '小狐', img: AV('fox-assistant.png'), duty: 'Fox 默认联系人' },
  zb: { name: '周报助手', img: AV('experts/Fox_ProjectManager.png'), duty: '汇总进度' },
  fw: { name: '法务顾问', img: AV('experts/Fox_PolicyAdvisor.png'), duty: '审合同' },
  cg: { name: '采购助理', img: AV('experts/Fox_BusinessManager.png'), duty: '比价下单' },
}

/* ---------------- Chrome ---------------- */
// states: { key: 'unread:3' | 'work' | 'need' | 'muted:2' }
function sidebar(active = 'zl', states = {}) {
  const row = (k) => {
    const c = C[k], s = states[k] || ''
    let tail = ''
    if (s.startsWith('unread')) tail = `<span class="cnt">${s.split(':')[1]}</span>`
    if (s === 'work') tail = I('loader-circle', 'spin')
    if (s === 'need') tail = `<span class="need">待确认</span>`
    if (s.startsWith('muted')) tail = `${I('bell-off')}<span class="cnt quiet">${s.split(':')[1]}</span>`
    return `<div class="crow ${active === k ? 'on' : ''} ${s.startsWith('muted') ? 'quiet' : ''}"><img class="gav" style="width:22px;height:22px;border-radius:50%" src="${c.img}" alt=""><span class="nm">${c.name}</span>${tail}</div>`
  }
  return `<aside class="side">
    <div class="mode-row">
      <div class="tabs-sm"><span class="on">${I('sparkles')}助手</span><span>${I('book-copy')}资料</span></div>
      <div class="grow"></div><span class="sib">${I('search')}</span><span class="sib">${I('bell')}${states.bell ? '<i class="dot-red"></i>' : ''}</span>
    </div>
    <div class="nav"><div class="em">${I('message-circle-plus')}<span>新建对话</span><kbd>Ctrl N</kbd></div><div>${I('users')}<span>专家</span></div><div>${I('blocks')}<span>插件</span></div></div>
    <div class="sec"><span>联系人</span><span class="sib" style="width:28px;height:28px">${I('plus')}</span></div>
    ${['zl', 'fox', 'zb', 'fw', 'cg'].map(row).join('')}
    <div class="sec"><span>对话</span></div>
    <div class="convs"><div>季度预算口径确认</div><div>投标文件格式检查</div><div>会议纪要整理</div></div>
    <div class="foot"><img src="${AV('defaults/fox_big_smile.png')}" alt=""><b>Hury</b><span class="sib">${I(document.documentElement.classList.contains('dark') ? 'moon' : 'sun')}</span><span class="sib">${I('settings')}</span></div>
  </aside>`
}
const titlebar = (narrow) => `<header class="titlebar">
  <div class="product"><img src="${AV('fox-assistant.png')}" alt=""><strong>Fox</strong>${narrow ? '' : `<span class="pl">${I('panel-left')}</span><nav><span>文件</span><span>编辑</span><span>视图</span><span>帮助</span></nav>`}</div>
  <div class="wctl"><span>${I('minus')}</span><span>${I('square')}</span><span>${I('x')}</span></div>
</header>`
const win = ({ side = sidebar(), main, narrow = false }) => `<div class="win ${narrow ? 'narrow' : ''}">${titlebar(narrow)}<div class="app">${narrow ? '' : side}<main class="main">${main}</main></div></div>`

/* ---------------- Chat pieces ---------------- */
const acts = (k = {}) => `<div class="mx">${k.react === false ? '' : `<span class="ib ${k.on === 'react' ? 'on' : ''}">${I('smile')}</span>`}<span class="ib">${I('reply')}</span><span class="ib ${k.on === 'more' ? 'on' : ''}">${I('ellipsis')}</span><time>${k.time || '14:32'}</time>${k.pop || ''}</div>`
// bubble: string or { t, hov, time, on, rx, hit }
const bub = (x) => {
  const o = typeof x === 'string' ? { t: x } : x
  return `<div class="m ${o.hov ? 'hov' : ''} ${o.rx ? 'rx-gap' : ''}"><div class="b ${o.hit ? 'hit' : ''}">${o.t}</div>${acts(o)}${o.rx ? `<span class="rx">${o.rx}</span>` : ''}</div>`
}
const them = (list, { who = C.zl, src = '', extra = '' } = {}) => `<div class="g them"><img class="gav" src="${who.img}" alt=""><div class="gcol">${src ? `<div class="src">${src}</div>` : ''}${list.map(bub).join('')}${extra}</div></div>`
const me = (list, { quote = '', extra = '' } = {}) => `<div class="g me"><div class="gcol">${quote}${extra}${list.map(bub).join('')}</div></div>`
const art = (icon, name, sub) => `<div class="art">${I(icon)}<div><b>${name}</b><small>${sub}</small></div><span class="ib sm">${I('external-link')}</span></div>`
const qref = (who, text) => `<div class="qref">${I('quote')}<b>${who}</b><span>${text}</span></div>`
const topbar = (who = C.zl, mid = '', right = '', left = '') => `<div class="ctop">

/* ---------------- Theme switcher ---------------- */
const THEMES = [['graphite', '石墨'], ['paper', '暖纸'], ['mist', '雾蓝']]
function setTheme(theme, mode) {
  const root = document.documentElement
  if (theme) { root.dataset.colorTheme = theme; localStorage.setItem('fox-mock-theme', theme) }
  if (mode) { root.classList.toggle('dark', mode === 'dark'); localStorage.setItem('fox-mock-mode', mode) }
  render()
}
function renderSwitcher() {
  const root = document.documentElement
  const theme = root.dataset.colorTheme
  const mode = root.classList.contains('dark') ? 'dark' : 'light'
  document.getElementById('switcher').innerHTML = `${I('palette')}
    <div class="seg">${THEMES.map(([k, l]) => `<button class="${theme === k ? 'on' : ''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="seg"><button class="${mode === 'light' ? 'on' : ''}" onclick="setTheme(null,'light')">${I('sun')}浅色</button><button class="${mode === 'dark' ? 'on' : ''}" onclick="setTheme(null,'dark')">${I('moon')}深色</button></div>`
}

      <tr><td>私聊顶栏</td><td>名字 + 「重置上下文」文字按钮 + 资料图标</td><td>居中胶囊（圆形头像 + 名字），顶部渐隐；右边搜索、⋯、资料；「重置上下文」进 ⋯</td><td>C00 C01</td></tr>
      <tr><td>聊天搜索</td><td>没有，全局搜索还会排除私聊</td><td>顶部搜索框 + 结果弹层 + 跳到原气泡</td><td>C01</td></tr>
      <tr><td>引用、收藏、表情</td><td>没有</td><td>悬停操作接通；引用进输入框，收藏进资料页</td><td>C07</td></tr>
      <tr><td>联系人资料</td><td>资料 / 笔记两个按钮 + 一长串表单和按钮</td><td>居中头像 + <b>三个分页</b>：资料、笔记、文件；资料页是分组卡片，任务、收藏、可用能力是二级页</td><td>C02 至 C07</td></tr>
      <tr><td>定时任务</td><td>只有数字同事页面，和联系人无关</td><td>聊天里一句话建任务，回一张任务卡；资料页「任务」看全部和最近运行</td><td>C03</td></tr>
      <tr><td>侧栏联系人</td><td>小字「运行中」和数字</td><td>数字、转圈、「待确认」三种状态；静音变灰</td><td>C06</td></tr>
      <tr><td>归档</td><td>运行中时按钮直接灰掉</td><td>弹窗说明会停下哪些事，确认后停止并归档</td><td>K2</td></tr>
    </tbody></table>
  </section>
  <section class="doc-block"><h2>用词替换</h2><div class="glossary">${gloss.map(([a, b]) => `<div><s>${a}</s>${arrow}<span>${b}</span></div>`).join('')}</div>
    <p class="doc-note">这几处是样稿里新提的改动，方案里没有写死，需要你确认：「重置上下文」收进 ⋯；右侧栏改成居中头像、三个分页加二级页，单项即时生效；归档从「灰掉按钮」改为「说明后停止并归档」。</p>
  </section>
  <nav class="toc">${screens.map((s, i) => `<a href="#${s.id}">${String(i + 1).padStart(2, '0')} ${s.title}</a>`).join('')}</nav>
  ${screens.map((s, i) => `<section class="frame" id="${s.id}">
    <div class="frame-head"><span class="no">${String(i + 1).padStart(2, '0')}</span><h2>${s.title}</h2><p>${s.desc}</p><div class="ids">${s.ids.map((x) => `<span>${x}</span>`).join('')}</div></div>
    ${s.id === 'narrow' ? `<div class="frame-row">${s.render()}${notes(s)}</div>` : s.render() + notes(s)}
  </section>`).join('')}`
  window.scrollTo(0, scroll)
}
const notes = (s) => `<div class="notes">
  <div><h4>${I('star')}突出</h4><ul>${s.focus.map((x) => `<li>${x}</li>`).join('')}</ul></div>
  <div><h4>${I('ellipsis')}收进图标 / 菜单</h4><ul>${s.tucked.map((x) => `<li>${x}</li>`).join('')}</ul></div>
  <div><h4>${I('x')}去掉 / 不做</h4><ul>${s.removed.map((x) => `<li>${x}</li>`).join('')}</ul></div>
</div>`
render()
</script>
</body>
</html>
