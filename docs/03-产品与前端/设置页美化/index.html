<!doctype html>
<html lang="zh-CN" data-color-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fox 设置 · 全局规则 · 原型</title>
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Regular.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Medium.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Semibold.css" />
<!-- Colours and radii come straight from the app; this mockup only covers Paper light. -->
<link rel="stylesheet" href="../../../apps/desktop/src/styles/themes.css" />
<script src="icons.js"></script>
<style>
/* Derived tokens, same recipes as apps/desktop/src/styles/globals.css. */
:root {
  --fox-canvas: var(--chat-background, var(--background));
  --fox-card: var(--card);
  --fox-panel: var(--muted);
  --fox-border: var(--border);
  --fox-border-strong: color-mix(in oklch, var(--border) 72%, var(--foreground) 28%);
  --fox-text: var(--foreground);
  --fox-muted: var(--muted-foreground);
  --fox-faint: color-mix(in oklch, var(--muted-foreground) 78%, var(--fox-canvas));
  --fox-hover: color-mix(in oklch, var(--fox-panel) 78%, var(--fox-card));
  --fox-accent: var(--brand);
  --fox-accent-soft: var(--brand-soft);
  --fox-control-xs: 24px;
  --fox-control-md: 32px;
  --fox-control-lg: 36px;
  --fox-action-height: var(--fox-control-md);
  --fox-space-xs: 4px;
  --fox-space-s: 6px;
  --fox-space-m: 8px;
  --fox-space-l: 12px;
  --fox-space-xl: 16px;
  --fox-space-2xl: 20px;
  --fox-space-3xl: 24px;

  --fox-sidebar-width: 260px;
  --fox-sidebar-gutter: 12px;
  --fox-sidebar-inset: 8px;
  --fox-sidebar-row-height: 32px;
  --fox-sidebar-action-size: 28px;
  --fox-sidebar-action-inset: 2px;

  /* Settings page geometry (settings-layout.css). */
  --sp-width: 760px;
  --sp-group-gap: 28px;
  --sp-group-pad: 16px;
  --sp-row-min: 60px;
  --sp-mark: 32px;
  --sp-sheet: 480px;
  --sp-gutter: 24px;
  --sheet-gutter: var(--fox-space-3xl);
  --hairline: color-mix(in oklch, var(--border) 70%, transparent);

  --side-hover: color-mix(in oklch, var(--sidebar-accent) 62%, var(--sidebar));
  --side-selected: var(--background);
  --shadow-sm: 0 1px 2px color-mix(in oklch, oklch(0.2 0 0) 6%, transparent);
  --shadow-md: 0 4px 16px color-mix(in oklch, oklch(0.2 0 0) 9%, transparent);
  --shadow-lg: 0 16px 45px color-mix(in oklch, oklch(0.2 0 0) 12%, transparent);
  font-family: "HarmonyOS Sans SC", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  font-synthesis: none;
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body { margin: 0; background: color-mix(in oklch, var(--shell) 70%, var(--muted)); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.grow { flex: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1.1s linear infinite; }
code, .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }

/* ---------- Doc shell ---------- */
.doc { width: 100%; max-width: 1360px; margin: 0 auto; padding: 32px 40px 120px; }
.doc-hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
.doc-hero p { margin: 0; max-width: 940px; color: var(--muted-foreground); font-size: 14px; line-height: 1.75; }
.toc { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toc .sel { max-width: 100%; }
.frame { margin-top: 64px; scroll-margin-top: 40px; }
.frame:first-of-type { margin-top: 26px; }
.frame-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.frame-head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.frame-head p { margin: 0; color: var(--muted-foreground); font-size: 14px; }
body.single .doc { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; padding: 24px; }

/* ---------- Window ---------- */
.win { position: relative; width: 100%; height: var(--frame-height); display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--shell); border: 1px solid var(--border); box-shadow: var(--shadow-lg); color: var(--foreground); font-size: 13px; }
body.single .win { height: 100%; }
.titlebar { height: 36px; flex: none; display: flex; align-items: center; justify-content: space-between; }
.tb-left { display: flex; align-items: center; gap: 2px; padding-left: 10px; color: var(--muted-foreground); }
.tb-left img { width: 20px; height: 20px; margin-right: 6px; border-radius: 5px; }
.tb-left span { width: 28px; height: 28px; display: grid; place-items: center; }
.tb-left span.off { opacity: .45; }
.wctl { display: flex; height: 100%; }
.wctl span { width: 46px; display: grid; place-items: center; color: var(--muted-foreground); }
.wctl svg { width: 15px; height: 15px; }
.app { position: relative; flex: 1; min-height: 0; display: flex; }
.card { position: relative; flex: 1; min-width: 0; display: flex; margin: 0 6px 6px 0; border-radius: var(--fox-radius-large); background: var(--fox-canvas); box-shadow: var(--shadow-sm); overflow: hidden; }

/* ---------- Settings sidebar ---------- */
.side { position: relative; width: var(--fox-sidebar-width); flex: none; display: flex; flex-direction: column; padding: 2px var(--fox-sidebar-gutter) 10px; background: var(--sidebar); }
.compact-nav { display: none; }
.mode-row { display: flex; align-items: center; height: 32px; margin-bottom: 8px; }
.back { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; border-radius: var(--fox-radius-control); color: var(--muted-foreground); font-size: 13px; }
.back svg { width: 15px; height: 15px; }
.row { position: relative; height: var(--fox-sidebar-row-height); display: flex; align-items: center; gap: 8px; padding: 0 var(--fox-sidebar-inset); border-radius: var(--fox-radius-control); color: color-mix(in oklch, var(--foreground) 90%, var(--muted-foreground)); font-size: 13.5px; white-space: nowrap; }
.row svg { width: 16px; height: 16px; color: var(--muted-foreground); }
.row.on { background: var(--side-selected); color: var(--foreground); font-weight: 500; box-shadow: var(--shadow-sm); }
.row.on svg { color: var(--foreground); }
.row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sgroup { display: grid; gap: 2px; }
.sgroup + .sgroup { margin-top: 14px; }
.sglabel { padding: 0 var(--fox-sidebar-inset) 4px; color: var(--fox-faint); font-size: 12px; font-weight: 500; }
.scroll { flex: 1; min-height: 0; overflow: auto; }
.foot { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 var(--fox-sidebar-action-inset) 0 var(--fox-sidebar-inset); }
.foot img { width: 26px; height: 26px; border-radius: 50%; }
.foot b { font-weight: 500; font-size: 13.5px; }
.foot .chev { width: 14px; height: 14px; color: var(--muted-foreground); }
.ab { position: relative; width: var(--fox-sidebar-action-size); height: var(--fox-sidebar-action-size); flex: none; display: grid; place-items: center; border-radius: var(--fox-radius-control); color: var(--muted-foreground); }

/* ---------- Settings page ---------- */
.spage { flex: 1; min-width: 0; overflow: auto; container: settings / inline-size; }
.sp { width: min(var(--sp-width), calc(100% - 2 * var(--sp-gutter))); margin: 0 auto; padding: 48px 0 56px; }
.sp-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
.sp-head h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; line-height: 1.33; }
.sp-head p { margin: 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.5; }
.sp-head .acts { display: flex; gap: 8px; flex: none; }
.grp + .grp, .grp + .grp-foot + .grp { margin-top: var(--sp-group-gap); }
.grp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; min-height: 28px; padding-bottom: 8px; }
.grp-head h2 { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.5; }
.grp-aside { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; }
.grp-body { padding: 0 var(--sp-group-pad); border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--card); }
.grp-foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 12px; }
.saved { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; }
.saved svg { width: 14px; height: 14px; color: var(--success); }

/* Plain row: name + one sentence left, control right. */
.srow { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: var(--sp-row-min); padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.srow:last-child { border-bottom: 0; }
.st { min-width: 0; display: grid; gap: 2px; }
.st b { font-size: 13.5px; font-weight: 500; line-height: 1.43; }
.st small { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.st small code { color: var(--foreground); }
.sc { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 100%; }

/* Item row: mark + name + status + controls; hover bleeds 8px past the text edge. */
.irow { position: relative; margin: 0 -8px; padding: 0 8px; border-radius: var(--fox-radius-card); }
.irow + .irow::before, .irow + [data-agent] > .irow::before, [data-agent] + [data-agent] > .irow::before { content: ''; position: absolute; top: 0; left: 8px; right: 8px; height: 1px; background: var(--hairline); }
.irow.hover, .irow.open { background: var(--fox-hover); }
.irow.hover::before, .irow.hover + .irow::before, .irow.open::before, .irow.open + .irow::before { opacity: 0; }
.ir { min-height: var(--sp-row-min); display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.ir > .it { min-width: 0; flex: 1; display: grid; gap: 2px; }
.in { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.in b { font-size: 13.5px; font-weight: 500; line-height: 1.43; overflow-wrap: anywhere; }
.it small { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.it small.warn { color: var(--warning); }
.it small.err { color: var(--destructive); }
.it small.mono { color: var(--muted-foreground); }
.ir-meta, .ir .tail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.ir-meta { flex: none; gap: 8px 12px; }
.ir .chev { width: 14px; height: 14px; color: var(--muted-foreground); }
.irow.dis .in b, .irow.dis .mk { opacity: .55; }
.below { padding: 0 0 14px calc(var(--sp-mark) + 12px); }

.mk { width: var(--sp-mark); height: var(--sp-mark); flex: none; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--fox-radius-control); background: var(--card); color: var(--muted-foreground); }
.mk svg { width: 16px; height: 16px; }
.mk img { width: 16px; height: 16px; object-fit: contain; }
.mk.av { overflow: hidden; padding: 0; border-radius: 50%; }
.mk.av img { width: 100%; height: 100%; object-fit: cover; }
.mk.lt { color: var(--foreground); font-size: 14px; font-weight: 600; }
.mk.lg { width: 40px; height: 40px; }
.mk.lg img { width: 20px; height: 20px; }
.mk.lg.av img { width: 100%; height: 100%; }
.mk.lg svg { width: 18px; height: 18px; }
.mk.xs { width: 18px; height: 18px; border-radius: 5px; }
.mk.xs img { width: 11px; height: 11px; }
.mk.xs.av img { width: 100%; height: 100%; }
.mk.xs.lt { font-size: 10px; }

.pill { height: 20px; flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.pill.ok { background: color-mix(in oklch, var(--success) 12%, transparent); color: color-mix(in oklch, var(--success) 85%, var(--foreground)); }
.pill.warn { background: color-mix(in oklch, var(--warning) 16%, transparent); color: color-mix(in oklch, var(--warning) 75%, var(--foreground)); }
.pill.err { background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }
.pill.info { background: var(--brand-soft); color: color-mix(in oklch, var(--brand) 80%, var(--foreground)); }
.pill.line { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.dot { width: 6px; height: 6px; flex: none; display: inline-block; border-radius: 50%; background: var(--fox-muted); }
.dot.ok { background: var(--success); }
.dot.warn { background: var(--warning); }
.dot.err { background: var(--destructive); }
.dot.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--fox-muted); }
.stat { flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b { color: var(--foreground); font-weight: 500; }
.stat .sep { color: var(--fox-faint); }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 10px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-control); background: var(--fox-card); color: var(--fox-text); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn svg { width: 14px; height: 14px; }
.btn.primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fox-muted); }
.btn.ghost.strong { color: var(--fox-text); }
.btn.danger { border-color: transparent; background: transparent; color: var(--destructive); }
.btn.lg { height: 32px; padding: 0 14px; font-size: 13px; }
.btn.dis { opacity: .45; }
.btn.hover { background: var(--fox-hover); }
.btn.icon { width: 28px; padding: 0; }
.sw { position: relative; width: 32px; height: 18px; flex: none; display: inline-block; border-radius: 999px; background: color-mix(in oklch, var(--foreground) 16%, transparent); }
.sw i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 2px oklch(0.2 0 0 / 20%); }
.sw.on { background: var(--primary); }
.sw.on i { left: 16px; }
.sw.dis { opacity: .45; }
.sel { height: 32px; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border: 1px solid var(--input); border-radius: var(--fox-radius-control); background: var(--background); font-size: 13px; white-space: nowrap; }
.sel .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sel .cv { width: 14px; height: 14px; color: var(--muted-foreground); }
.sel > svg:first-child { width: 14px; height: 14px; color: var(--muted-foreground); }
.sel img { width: 16px; height: 16px; }
.sel.sm { height: 28px; font-size: 12.5px; }
.sel.open { border-color: var(--fox-border-strong); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 22%, transparent); }
.seg { height: 32px; flex: none; display: inline-flex; padding: 2px; border-radius: var(--fox-radius-control); background: var(--muted); }
.seg span { height: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 12px; border-radius: calc(var(--fox-radius-control) - 2px); color: var(--muted-foreground); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.seg span.on { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
.seg.full { display: flex; }
.seg.full span { flex: 1; }
.seg.sm { height: 28px; }
.seg.sm span { padding: 0 10px; font-size: 12px; }
.inp { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--input); border-radius: var(--fox-radius-control); background: var(--background); font-size: 13px; }
.inp .v { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.inp .ph { flex: 1; color: var(--fox-faint); }
.inp svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.inp.focus { border-color: var(--fox-border-strong); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 22%, transparent); }
.inp.focus .v::after { content: ''; display: inline-block; width: 1.5px; height: 15px; margin-left: 1px; vertical-align: -3px; background: var(--foreground); }
.inp.mono .v, .ta.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.ta { min-height: 76px; padding: 8px 10px; border: 1px solid var(--input); border-radius: var(--fox-radius-control); background: var(--background); font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.ta .ph { color: var(--fox-faint); }
.fld { display: grid; gap: 6px; }
.fld + .fld, .fld-row + .fld, .fld + .fld-row { margin-top: 14px; }
.fld > label { font-size: 12px; font-weight: 500; }
.fld > small { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
.fld-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fld-row > .fld + .fld { margin-top: 0; }
.chk { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--fox-border-strong); }
.chk.on { background: var(--primary); box-shadow: none; color: var(--primary-foreground); }
.chk svg { width: 11px; height: 11px; stroke-width: 3; }

/* Agent coverage under a service row. */
.cov { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cov-l { margin-right: 2px; color: var(--fox-faint); font-size: 12px; }
.chip { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px 0 3px; border-radius: 999px; background: var(--muted); color: var(--foreground); font-size: 12px; }
.chip .ck { width: 12px; height: 12px; color: var(--success); stroke-width: 2.4; }
.chip em { color: var(--fox-faint); font-style: normal; }
.cov .miss { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; color: var(--warning); font-size: 12px; }
.cov .miss svg { width: 13px; height: 13px; }

/* Verification ladder: four layers left to right. */
.verify { padding: 14px 16px 16px; border-radius: var(--fox-radius-card); background: var(--fox-canvas); box-shadow: inset 0 0 0 1px var(--hairline); }
.vh { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.vh b { font-size: 13px; font-weight: 600; }
.vh small { color: var(--muted-foreground); font-size: 12px; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0; padding: 0; list-style: none; }
.ladder li { position: relative; display: grid; gap: 3px; padding-right: 12px; }
.ladder li::after { content: ''; position: absolute; top: 9px; left: 26px; right: 8px; height: 1.5px; background: var(--border); }
.ladder li:last-child::after { display: none; }
.ladder li.done::after { background: color-mix(in oklch, var(--success) 50%, var(--border)); }
.ladder .lc { width: 20px; height: 20px; display: grid; place-items: center; margin-bottom: 4px; border-radius: 50%; background: var(--muted); color: var(--muted-foreground); }
.ladder .lc svg { width: 12px; height: 12px; stroke-width: 2.4; }
.ladder li.done .lc { background: var(--success); color: white; }
.ladder li.run .lc { background: var(--brand-soft); color: var(--brand); }
.ladder li.fail .lc { background: var(--destructive); color: white; }
.ladder b { font-size: 12.5px; font-weight: 600; }
.ladder small { color: var(--muted-foreground); font-size: 12px; line-height: 1.45; }
.ladder li.run small { color: var(--foreground); }
.vfoot { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); color: var(--muted-foreground); font-size: 12px; }

/* Search provider options. */
/* ---------- Sheet (480px, right) ---------- */
.scrim { position: absolute; inset: 0; z-index: 10; background: color-mix(in oklch, var(--foreground) 8%, transparent); }
.sheet { position: absolute; z-index: 11; top: 0; right: 0; bottom: 0; width: min(var(--sp-sheet), 100%); display: flex; flex-direction: column; border-left: 1px solid var(--border); border-top-left-radius: var(--fox-radius-card); background: var(--popover); box-shadow: var(--shadow-lg); font-size: 13px; container: drawer / inline-size; }
.sh-head { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--fox-space-l); padding: var(--fox-space-3xl) var(--sheet-gutter) var(--fox-space-2xl); border-bottom: 1px solid var(--hairline); }
.sh-head .tt { min-width: 0; display: grid; gap: 2px; }
.sh-head .tn { display: flex; flex-wrap: wrap; align-items: center; gap: var(--fox-space-xs) var(--fox-space-m); font-size: 16px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.sh-head small { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.sh-head .x { width: var(--fox-action-height); height: var(--fox-action-height); display: grid; place-items: center; border-radius: var(--fox-radius-control); color: var(--muted-foreground); }
.sh-head .x:hover { background: var(--fox-hover); }
.sh-body { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--sheet-gutter); }
.sh-sec { padding: 18px 0; }
.sh-sec + .sh-sec { border-top: 1px solid var(--hairline); }
.sh-sec-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; min-height: 28px; margin-bottom: 10px; }
.sh-sec-h h3 { margin: 0; font-size: 13px; font-weight: 600; }
.sh-sec-h small { color: var(--muted-foreground); font-size: 12px; }
.hint { display: flex; align-items: flex-start; gap: 6px; margin: 10px 0 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.55; }
.hint svg { width: 13px; height: 13px; flex: none; margin-top: 2px; }
.hint.warn { color: var(--warning); }
.sh-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--fox-space-m); padding: var(--fox-space-l) var(--sheet-gutter); border-top: 1px solid var(--border); }
.sh-foot .btn { height: var(--fox-action-height); padding-inline: var(--fox-space-l); font-size: 13px; }
.steps { display: flex; align-items: center; gap: 10px; padding: 16px 0 2px; font-size: 12.5px; color: var(--muted-foreground); }
.steps span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.steps i { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--muted); font-style: normal; font-size: 11px; font-weight: 600; }
.steps i svg { width: 11px; height: 11px; stroke-width: 2.6; }
.steps .on { color: var(--foreground); font-weight: 500; }
.steps .on i { background: var(--primary); color: var(--primary-foreground); }
.steps .done i { background: var(--success); color: white; }
.steps .ln { flex: 1; height: 1px; background: var(--border); }
.tgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tgt { position: relative; display: grid; justify-items: start; gap: 8px; padding: 10px; border-radius: var(--fox-radius-card); box-shadow: inset 0 0 0 1px var(--border); background: var(--card); }
.tgt b { font-size: 12.5px; font-weight: 500; }
.tgt small { margin-top: -6px; color: var(--muted-foreground); font-size: 11.5px; }
.tgt .chk { position: absolute; top: 10px; right: 10px; }
.tgt.on { box-shadow: inset 0 0 0 1.5px var(--primary); background: color-mix(in oklch, var(--primary) 3%, var(--card)); }
.summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--fox-radius-card); background: var(--muted); }
.summary .tx { flex: 1; min-width: 0; display: grid; gap: 1px; }
.summary b { font-size: 12.5px; font-weight: 500; }
.summary small { color: var(--muted-foreground); font-size: 12px; }
.ladder.three { grid-template-columns: repeat(3, 1fr); }
.ladder li.fail small { color: var(--destructive); }
.disc { display: flex; align-items: center; gap: 10px; margin: 0 -8px; padding: 10px 8px; border-radius: var(--fox-radius-card); }
.disc > svg { width: 16px; height: 16px; color: var(--muted-foreground); }
.disc .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.disc b { font-size: 13px; font-weight: 600; }
.disc small { color: var(--muted-foreground); font-size: 12px; }
.facts { margin: 0; }
.facts > div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.facts > div:last-child { border-bottom: 0; }
.facts dt { color: var(--muted-foreground); font-size: 12px; }
.facts dd { min-width: 0; margin: 0; font-size: 13px; overflow-wrap: anywhere; }
.rules { margin: 10px 0 0; padding: 0; list-style: none; }
.rules li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.rules li:last-child { border-bottom: 0; }
.rules li > div { flex: 1; min-width: 0; display: grid; gap: 2px; }
.rules code { color: var(--foreground); }
.rules small { color: var(--muted-foreground); font-size: 12px; }
.tools { display: grid; }
.tools > div { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.tools > div:last-child { border-bottom: 0; }
.tools b { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; font-weight: 500; }
.tools small { color: var(--muted-foreground); font-size: 12px; }
.hook-form { margin-bottom: 4px; padding: 14px; border-radius: var(--fox-radius-card); background: var(--fox-canvas); box-shadow: inset 0 0 0 1px var(--border); }
.hook-form .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

/* ---------- Floating surfaces ---------- */
.menu { position: absolute; z-index: 20; width: 180px; padding: 4px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--popover); box-shadow: var(--shadow-md); font-size: 13px; }
.menu .mi { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--fox-radius-control); white-space: nowrap; }
.menu .mi svg { width: 15px; height: 15px; color: var(--fox-muted); }
.menu .mi.on { background: var(--fox-hover); }
.menu .mi.off { opacity: .45; }
.menu .mi.danger, .menu .mi.danger svg { color: var(--destructive); }
.menu .ms { height: 1px; margin: 4px 0; background: var(--fox-border); }
.menu .mi img { width: 16px; height: 16px; }
.menu .mi .ck { margin-left: auto; width: 14px; height: 14px; color: var(--foreground); }
.menu .mi small { margin-left: auto; color: var(--fox-faint); font-size: 12px; }
.banner { display: flex; align-items: center; gap: 12px; margin: 0 0 24px; padding: 12px 14px; border: 1px solid color-mix(in oklch, var(--destructive) 35%, var(--border)); border-radius: var(--fox-radius-card); background: color-mix(in oklch, var(--destructive) 5%, var(--card)); }
.banner > svg { width: 16px; height: 16px; color: var(--destructive); }
.banner .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.banner b { font-size: 13.5px; font-weight: 500; }
.banner small { color: var(--muted-foreground); font-size: 12px; }
.banner.info { border-color: color-mix(in oklch, var(--brand) 30%, var(--border)); background: color-mix(in oklch, var(--brand-soft) 45%, var(--card)); }
.banner.info > svg { color: var(--brand); }
.blank { padding: 20px 0; color: var(--muted-foreground); font-size: 13px; }
.loading { display: flex; align-items: center; gap: 8px; padding: 20px 0; color: var(--muted-foreground); font-size: 13px; }
.loading svg { width: 14px; height: 14px; }

/* Component sheet. */
.kit { padding: 32px 36px; border-radius: 14px; background: var(--background); box-shadow: var(--shadow-md); display: grid; grid-template-columns: 1fr 1fr; gap: 32px 48px; }
.kit h5 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted-foreground); }
.kit .line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.kit .line + .line { margin-top: 12px; }
.kit .cap { color: var(--fox-faint); font-size: 12px; }
.spec { width: 100%; border-collapse: collapse; font-size: 13px; }
.spec td { padding: 7px 0; border-bottom: 1px solid var(--hairline); }
.spec td:first-child { color: var(--muted-foreground); width: 46%; }
.spec td code { color: var(--foreground); }
.kit .wide { grid-column: 1 / -1; }
.row { text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button, .btn, .sw, .seg > span, .x, .mi, .disc { cursor: pointer; }
.btn.dis, .sw.dis { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--fox-accent); outline-offset: 3px; }
select.sel { max-width: min(100%, 290px); min-width: 0; background: var(--fox-card); }
.fld select.sel { width: 100% !important; max-width: none; }
input.inp { background: var(--fox-card); min-width: 0; width: 100%; }
.sheet textarea.ta { display: block; width: 100%; resize: vertical; color: inherit; }
.sheet .fld > span { font-size: 12px; font-weight: 500; }
.sheet .fld input, .sheet .fld select { min-height: var(--fox-action-height); }
.catalog-toolbar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--fox-space-m); padding-block: var(--fox-space-l); background: var(--popover); }
.catalog-toolbar .inp { flex: 1; min-width: 0; }
.catalog-toolbar :is(.inp, .sel, .btn) { height: var(--fox-action-height); }
.provider-directory h3 { margin: 10px 0 8px; font-size: 13px; font-weight: 600; }
.provider-directory section { padding: 0 0 16px; }
.provider-directory section + section { border-top: 1px solid var(--hairline); padding-top: 6px; }
.provider-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.provider-option { display: grid; grid-template-columns: var(--fox-control-xs) minmax(0, 1fr) 12px; align-items: center; gap: var(--fox-space-m); min-width: 0; height: var(--fox-control-lg); padding-inline: var(--fox-space-m); border: 1px solid var(--fox-border); border-radius: var(--fox-radius-control); background: var(--fox-card); text-align: start; }
.provider-option:hover { background: var(--fox-hover); border-color: var(--fox-border-strong); }
.provider-option .mk { width: var(--fox-control-xs); height: var(--fox-control-xs); }
.provider-option .i:last-child { width: 12px; margin-left: auto; color: var(--fox-muted); }
.provider-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.model-service-open { display: block; max-width: 100%; border: 0; padding: 0; font-weight: 500; text-align: start; background: transparent; overflow-wrap: anywhere; }
.model-service-open::after { content: ''; position: absolute; inset: 0; border-radius: var(--fox-radius-card); }
.model-service-open:focus-visible::after { outline: 2px solid var(--fox-accent); outline-offset: 1px; }
.irow:has(.model-service-open:hover) { background: var(--fox-hover); }
.provider-note { margin: 0 0 var(--fox-space-xl); }
.provider-empty { padding-block: 22px; color: var(--fox-muted); }
.model-options summary { cursor: pointer; width: fit-content; color: var(--foreground); font-weight: 500; }
.model-options[open] summary { margin-bottom: 12px; }
.agent-external .grp-body > .srow { border-top: 1px solid var(--hairline); }
.agent-external .grp-body > .srow .st { flex-basis: auto; }
.agent-external .grp-body > .hint { margin: 0; padding-block: var(--fox-space-l); border-top: 1px solid var(--hairline); }
.agent-catalog-filters { display: flex; flex-wrap: wrap; gap: var(--fox-space-m); align-items: center; }
.agent-directory { border-top: 1px solid var(--hairline); }
.agent-directory > .hint { margin-block: var(--fox-space-xl) 0; }
.agent-directory:not(:has(.agent-doc-link)) + .hint { display: none; }
.agent-catalog-scenario { margin-block: var(--fox-space-xl); padding-top: var(--fox-space-l); border-top: 1px solid var(--hairline); }
.agent-catalog-scenario summary { color: var(--muted-foreground); }
.agent-catalog-scenario[open] summary { margin-bottom: var(--fox-space-m); }
.agent-doc-link { display: inline-flex; align-items: center; gap: var(--fox-space-xs); min-height: var(--fox-action-height); color: var(--primary); text-underline-offset: 3px; }
.agent-doc-link .i { width: var(--fox-space-l); height: var(--fox-space-l); }
.agent-connection-facts > div { grid-template-columns: 5em minmax(0, 1fr); }
.agent-connection-facts + .agent-doc-link { margin-top: var(--fox-space-m); }
[data-agent-settings] .sh-sec:has(> .srow:only-child) { padding-block: 0; }
[data-agent-settings] .sh-sec > select.sel { width: 100%; max-width: none; }
[data-agent-settings] .source-service, [data-custom-acp] .fld + .srow { margin-top: var(--fox-space-l); }
[data-custom-acp] .fld + .srow { min-height: var(--fox-action-height); padding-block: 0; }
.agent-env-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: var(--fox-space-m); align-items: center; margin-bottom: var(--fox-space-m); }
[data-custom-acp] :is(.agent-env-row .btn, [data-action="add-acp-env"]) { height: var(--fox-action-height); }
.model-baseline { display: grid; gap: 3px; margin-top: 14px; }
.model-baseline small { font-size: 12px; color: var(--muted-foreground); }
.model-baseline code { overflow-wrap: anywhere; }
.model-key-row { display: flex; gap: 8px; align-items: center; }
.model-key-row input { flex: 1; }
.model-key-row .btn { height: var(--fox-action-height); }
[data-sheet="model"] label.fld:focus-within { outline: none; }
.sh-foot .drawer-return { margin-inline-end: auto; padding-inline: var(--fox-space-s); }
.drawer-feedback { flex: 0 0 100%; min-width: 0; margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted-foreground); overflow-wrap: anywhere; }
.drawer-feedback:empty { display: none; }
.drawer-feedback.error { color: var(--destructive); }
.drawer-feedback.success { color: color-mix(in oklch, var(--success) 75%, var(--foreground)); }
[data-sheet="agent"] .drawer-feedback.error { padding: var(--fox-space-m) var(--fox-space-l); border: 1px solid color-mix(in oklch, var(--destructive) 35%, var(--border)); border-radius: var(--fox-radius-control); background: color-mix(in oklch, var(--destructive) 5%, var(--card)); }
.sheet .tools b { overflow-wrap: anywhere; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.source-service { margin-top: 18px; }
[hidden] { display: none !important; }
.developer-details { padding: 4px 18px 18px; line-height: 2; }
.directory-preview { display: grid; gap: var(--fox-space-l); padding-block: var(--fox-space-xl); }
.directory-preview .directory-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--fox-space-m) var(--fox-space-l); }
.directory-head .st { flex: 1 1 180px; }
.directory-preview .btn { height: var(--fox-action-height); }
.directory-path { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--fox-space-m); padding: var(--fox-space-m) var(--fox-space-l); border: 1px solid var(--hairline); border-radius: var(--fox-radius-control); background: var(--muted); line-height: 1.6; }
.directory-path > .i { color: var(--muted-foreground); margin-top: var(--fox-space-micro, 2px); }
.directory-contents { display: flex; flex-wrap: wrap; gap: var(--fox-space-xs) var(--fox-space-xl); margin: 0; padding: 0; list-style: none; color: var(--muted-foreground); font-size: 12px; }
.directory-contents li { display: inline-flex; flex-wrap: wrap; gap: var(--fox-space-m); align-items: baseline; }
.directory-contents code { color: var(--foreground); }
.root-path { overflow-wrap: anywhere; }
.grp details { padding: 14px 0; }
.grp summary { cursor: pointer; font-weight: 500; }
.search-services { min-width: 0; margin: 0; padding: 0; border: 0; }
.search-services legend { margin: 0 0 8px; padding: 0; font-weight: 600; }
.search-options { display: grid; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--fox-card); }
.search-option { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 54px; padding: 8px 12px; cursor: pointer; }
.search-option + .search-option { border-top: 1px solid var(--hairline); }
.search-option:first-child { border-radius: var(--fox-radius-card) var(--fox-radius-card) 0 0; }
.search-option:last-child { border-radius: 0 0 var(--fox-radius-card) var(--fox-radius-card); }
.search-option:hover { background: var(--fox-hover); }
.search-option:has(input:checked) { background: color-mix(in oklch, var(--fox-accent-soft) 52%, var(--fox-card)); }
.search-option .mk { width: 28px; height: 28px; }
.search-option b { font-size: 13px; line-height: 1.4; }
.search-option small { display: block; margin-top: 2px; color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
.search-option input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: inherit; }
.search-fields { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); }
.search-fields .fld > span { font-weight: 500; }
.search-fields input { min-height: 34px; }
.backup-file { width: 1px; height: 1px; opacity: 0; position: absolute; }
label:focus-within { outline: 2px solid var(--fox-accent); }
.prototype-bar { display: flex; justify-content: space-between; gap: 4px 12px; font-size: 12px; color: var(--muted-foreground); }
.prototype-bar a, .frame-head a { color: var(--foreground); }
.prototype-notice { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); pointer-events: none; background: var(--foreground); color: var(--background); border-radius: 8px; padding: 12px 16px; z-index: 100; width: max-content; max-width: calc(100vw - 32px); box-shadow: var(--shadow-md); font-size: 13px; }
.frame-head { flex-wrap: wrap; }
.frame-head h2 { white-space: normal; }
.frame-head a { margin-left: auto; font-size: 12px; }

@container settings (max-width: 560px) {
  .sp { --sp-gutter: 16px; padding-block: 26px 40px; }
  .sp-head { flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .srow { flex-wrap: wrap; gap: 8px 16px; }
  .srow .st { flex: 1 1 180px; }
  .ir:has(.stat + .tail, .tail select) { display: grid; grid-template-columns: var(--sp-mark) minmax(0, 1fr); gap: 6px 12px; }
  .ir:has(.stat + .tail, .tail select) > .mk { align-self: start; }
  .ir-meta { grid-column: 2; }
  .banner { flex-wrap: wrap; }
  .banner .tx { flex: 1 1 160px; }
}
@container drawer (max-width: 380px) {
  .sh-head, .sh-body, .sh-foot { --sheet-gutter: 14px; }
  .sh-head { gap: var(--fox-space-m); padding-block: var(--fox-space-xl); }
  .sh-head > .mk { width: 32px; height: 32px; }
  .sh-body .ir { display: grid; grid-template-columns: var(--sp-mark) minmax(0, 1fr); gap: 6px 12px; }
  .sh-body .ir-meta { grid-column: 2; }
  .agent-catalog-tools { flex-wrap: wrap; }
  .agent-catalog-tools .inp { flex-basis: 100%; }
  .agent-directory .ir > .mk { align-self: start; }
  .search-option { gap: 8px; min-height: 50px; padding: 6px 8px; }
}
@media (max-width: 1050px) {
  :root { --fox-sidebar-width: 180px; }
  .doc, body.single .doc { padding: 16px; }
}
@media (max-width: 620px) {
  .doc, body.single .doc { padding: 10px; }
  .app { flex-direction: column; }
  .side { width: 100%; padding: 8px 12px; }
  .side > :not(.compact-nav), .titlebar .tb-left span { display: none; }
  .compact-nav { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; font-weight: 500; }
  .compact-nav .sel { width: 100%; max-width: none; min-height: 40px; }
  .card { position: static; margin: 0 4px 4px; }
  .sp-head h1 { font-size: 22px; }
  .sheet { border-radius: var(--fox-radius-large); }
}
@container drawer (max-width: 310px) {
  .sh-body .fld-row { grid-template-columns: minmax(0, 1fr); }
  .catalog-toolbar { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; }
  .provider-option { grid-template-columns: var(--fox-control-xs) minmax(0, 1fr); padding-inline: var(--fox-space-s); gap: var(--fox-space-s); }
  .provider-option .i:last-child { display: none; }
  .sh-foot .drawer-return { flex-basis: 100%; justify-content: flex-start; }
  .agent-env-row { grid-template-columns: minmax(0, 1fr) auto; }
  .agent-env-row input:first-child { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="doc" id="doc"></div>
<script>
const ROOT = '../../../apps/desktop/public'
const ASSET = `${ROOT}/avatars`
const P = (n) => `${ROOT}/providers/${n}.svg`
const ME = `${ASSET}/defaults/fox_big_smile.png`
const FOX = `${ASSET}/fox-assistant.png`
const glyph = (name) => window.FOX_ICONS[name] || ''
const I = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${glyph(name)}</svg>`
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])

/* ---------- Primitives ---------- */
const pill = (t, tone = '') => `<span class="pill ${tone}">${t}</span>`
const dot = (tone) => `<i class="dot ${tone}"></i>`
const stat = (tone, label, meta = '') => `<span class="stat">${dot(tone)}<b>${label}</b>${meta ? `<span class="sep">·</span><span>${meta}</span>` : ''}</span>`
const sw = (on, dis = false) => `<span class="sw ${on ? 'on' : ''} ${dis ? 'dis' : ''}"><i></i></span>`
const sel = (v, w = 160, o = {}) => `<span class="sel ${o.sm ? 'sm' : ''} ${o.open ? 'open' : ''}" style="width:${typeof w === 'number' ? w + 'px' : w}">${o.img ? `<img src="${o.img}" alt="">` : o.icon ? I(o.icon) : ''}<span class="v">${v}</span>${I('chevron-down', 'cv')}</span>`
const seg = (items, on, cls = '') => `<span class="seg ${cls}">${items.map((t, i) => `<span class="${i === on ? 'on' : ''}">${t}</span>`).join('')}</span>`
const btn = (t, { kind = 'outline', icon = '', trail = '', cls = '', action = '', disabled = false } = {}) => {
  const content = `${icon ? I(icon, icon === 'loader-circle' ? 'spin' : '') : ''}${t}${trail ? I(trail) : ''}`
  return action
    ? `<button type="button" class="btn ${kind} ${cls}" data-action="${action}" ${disabled ? 'disabled' : ''}>${content}</button>`
    : `<span class="btn ${kind} ${cls}">${content}</span>`
}
const ibtn = (icon, cls = '') => `<span class="btn ghost icon ${cls}">${I(icon)}</span>`
const inp = (v, { ph = '', cls = '', pre = '', suf = '', w = '' } = {}) => `<span class="inp ${cls}" ${w ? `style="width:${w}px"` : ''}>${pre ? I(pre) : ''}${v ? `<span class="v">${v}</span>` : `<span class="ph">${ph}</span>`}${suf}</span>`
const ta = (v, { ph = '', cls = '', h = 76 } = {}) => `<div class="ta ${cls}" style="min-height:${h}px">${v || `<span class="ph">${ph}</span>`}</div>`
const fld = (label, control, help = '') => `<div class="fld"><label>${label}</label>${control}${help ? `<small>${help}</small>` : ''}</div>`
const mark = (m = {}) => {
  const size = m.size ? ` ${m.size}` : ''
  if (m.img) return `<span class="mk${m.av ? ' av' : ''}${size}"><img src="${m.img}" alt=""></span>`

const agentKeys = ['pi', 'codex', 'deepseek']

const foxAgentSource = '使用我的模型服务'
const agentPermissions = ['只读', '操作前询问', '目录内自动']
const agentProfile = key => AG[key] || demo.agents[key]?.custom
const agentConfig = key => demo.agents[key] || {
  enabled: key !== 'deepseek', checked: key !== 'deepseek', values: {
    'agent-source': key === 'pi' ? foxAgentSource : localAgentSource,
    'agent-model': modelOptions()[0],
    'agent-permission': agentPermissions[1],
  },
}
const agentDetected = key => agentKeys.includes(key)
  ? demo.agentComputer !== 'none' && (key !== 'deepseek' || demo.agentComputer === 'all')
  : agentConfig(key).checked
const agentPerm = key => agentConfig(key).values?.['agent-permission'] || agentPermissions[1]
const agentNeedsLogin = (key, source) => agentKeys.includes(key) && source === localAgentSource && !AG[key].signedIn
const agentReady = key => agentDetected(key) && agentConfig(key).enabled && agentConfig(key).checked
  && !agentNeedsLogin(key, agentConfig(key).values?.['agent-source'])
const configuredAgentKeys = () => [
  ...agentKeys.filter(key => agentDetected(key) || Object.hasOwn(demo.agents, key)),
  ...Object.keys(demo.agents).filter(key => demo.agents[key].custom),
]
function agentStatus(key) {
  const config = agentConfig(key)
  if (!agentDetected(key)) return stat('empty', config.custom ? '待验证' : '未检测到')
  if (!config.enabled) return stat('empty', demo.agents[key] ? '已停用' : '待配置')
  if (agentNeedsLogin(key, config.values?.['agent-source'])) return stat('warn', '需要登录')
  return agentReady(key) ? stat('ok', '可用') : stat('warn', '待验证')
}
function agentSummary(key) {
  const profile = agentProfile(key)
  const config = agentConfig(key)
  if (!agentDetected(key)) return `${profile.route} · 检测命令 ${escapeHtml(profile.command)}`
  const model = config.custom ? '沿用 Agent 的模型' : config.values?.['agent-source'] === foxAgentSource
    ? escapeHtml(config.values['agent-model'] || '尚未选择模型') : '本机账号'
  return [profile.route, profile.version, model].filter(Boolean).join(' · ')
}
function agentDefaultsGroup() {
  const options = ['fox', ...configuredAgentKeys().filter(agentReady)]
  const preferred = demo.defaultAgent || 'fox'
  const active = options.includes(preferred) ? preferred : 'fox'
  const description = active !== preferred
    ? `${escapeHtml(agentProfile(preferred)?.name || '原默认 Agent')} 暂不可用，新对话使用 Fox。`
    : '已启用且验证通过的 Agent 可以用于新对话。'
  const select = `<select class="sel" name="new-agent" aria-label="新对话默认 Agent">${options.map(key =>
    `<option value="${key}" ${key === active ? 'selected' : ''}>${escapeHtml(agentProfile(key).name)}</option>`).join('')}</select>`
  return group('新对话', srow('默认 Agent', description, select), { cls: 'agent-defaults' })
}
function externalAgentsGroup() {
  const count = agentKeys.filter(agentDetected).length
  const hasMissing = agentKeys.some(key => !agentDetected(key))
  const keys = configuredAgentKeys()
  return group('外部 Agent',
    irow({ m: { icon: 'square-terminal' }, name: '这台电脑', desc: count ? `已检测到 ${count} 个预设 Agent` : '未检测到预设 Agent',
      tail: btn('重新检测', { icon: 'refresh-cw', action: 'detect-agents' }) }) +

      tail: btn('配置', { action: 'configure-agent' }),
    })}</div>`).join('') : '<p class="hint">新对话可继续使用 Fox 通用助手。</p>') +

    { aside: btn('添加 Agent', { icon: 'plus', action: 'add-agent' }), cls: 'agent-external' },
  )
}

let lastTrigger
function replaceSheet(card, content, focus = '.sheet .x') {
  card.querySelectorAll(':scope > .sheet, :scope > .scrim').forEach(el => el.remove())
  card.insertAdjacentHTML('beforeend', content)
  enhance(card)
  card.querySelector(focus).focus({ preventScroll: true })
}
function openSheet(card, content, focus) {
  document.querySelector('.prototype-notice')?.remove()
  lastTrigger = document.activeElement
  replaceSheet(card, content, focus)
}
function closeSheet(card) {
  const isSearch = card.querySelector('.search-services')
  const isProvider = card.querySelector('[data-sheet="provider-catalog"], [data-sheet="model"]')
  const editingId = card.querySelector('[data-model-editing]')?.dataset.modelProvider
  card.querySelectorAll(':scope > .sheet, :scope > .scrim').forEach(el => el.remove())
  setSheetBackground(card, false)
  const trigger = lastTrigger?.closest('.card') === card ? lastTrigger
    : card.querySelector(editingId ? `[data-service="${editingId}"]` : isSearch ? '.configure-search' : isProvider ? '[data-action="add-provider"]' : '.spage')
  trigger.focus({ preventScroll: true })
  lastTrigger = undefined
}
function setSheetBackground(card, inert) {
  card.querySelector('.spage').inert = inert
  card.parentElement.querySelector('.side').inert = inert
}
function notice(message) {
  let el = document.querySelector('.prototype-notice')
  if (!el) { el = document.createElement('div'); el.className = 'prototype-notice'; el.setAttribute('role', 'status'); document.body.append(el) }
  el.textContent = message
  clearTimeout(notice.timer)
  notice.timer = setTimeout(() => el.remove(), 4200)
}
function enhance(root = document) {
  root.querySelectorAll('.btn, .x, .sw, .seg > span, .mi, .disc').forEach(el => {
    if (el.matches('label, button')) return
    el.tabIndex = el.classList.contains('dis') ? -1 : 0
    el.setAttribute('role', el.classList.contains('sw') ? 'switch' : 'button')
    if (el.classList.contains('dis')) el.setAttribute('aria-disabled', 'true')
    if (el.classList.contains('sw')) { el.setAttribute('aria-checked', String(el.classList.contains('on'))); el.setAttribute('aria-label', el.closest('.srow, .irow')?.querySelector('b')?.textContent || '启用') }
    if (el.classList.contains('x')) el.setAttribute('aria-label', '关闭抽屉')
    if (el.classList.contains('icon')) el.setAttribute('aria-label', '更多操作')
  })
  root.querySelectorAll('span.inp, div.ta').forEach(el => { el.contentEditable = 'true'; el.setAttribute('role', 'textbox'); el.setAttribute('aria-label', el.closest('.fld')?.querySelector('label')?.textContent || '输入内容') })
  root.querySelectorAll('span.sel').forEach(el => {
    const value = el.querySelector('.v').textContent
    const options = ['只读', '询问', '自动'].includes(value) ? ['只读', '询问', '自动'] : [value]
    const select = document.createElement('select'); select.className = el.className; select.style.cssText = el.style.cssText; select.setAttribute('aria-label', value)
    options.forEach(v => select.add(new Option(v, v, false, v === value))); el.replaceWith(select)
  })
  root.querySelectorAll('.sheet').forEach(el => {
    el.setAttribute('role', 'dialog')
    el.setAttribute('aria-label', el.querySelector('.tn')?.textContent || '配置')
    el.setAttribute('aria-modal', 'true')
    setSheetBackground(el.parentElement, true)
  })
}

function showFeedback(dialog, message, tone = '') {
  const node = dialog.querySelector('.drawer-feedback')
  node.className = `drawer-feedback ${tone}`
  node.textContent = message
}
function httpUrl(value) {
  try {
    const url = new URL(value)
    if (['http:', 'https:'].includes(url.protocol) && !url.username && !url.password) return url
  } catch {}
  return null
}
function refreshGroup(selector, markup) {
  document.querySelectorAll(selector).forEach(group => {
    group.insertAdjacentHTML('afterend', markup)
    enhance(group.nextElementSibling)
    group.remove()
  })
}
function setProjectMode(id, mode) {
  demo.projects[id] = mode
  document.querySelectorAll(`[data-project-mode="${id}"]`).forEach(select => { select.value = mode })
  saveDemo()
}
function resetModelCheck(dialog) {
  dialog.querySelector('[data-model-results]').hidden = true
  const editing = Boolean(dialog.querySelector('[data-model-editing]'))
  dialog.querySelector('[data-action="save-model"]').disabled = !editing
  showFeedback(dialog, editing ? '' : '检查通过后可添加。')
}
function modelDetails(dialog) {
  const form = dialog.querySelector('[data-model-provider]')
  const id = form.dataset.modelProvider
  const preset = PRESETS.find(entry => entry[0] === id)
  const existing = form.hasAttribute('data-model-editing') ? modelServices().find(service => service.id === id) : null
  const fullForm = Boolean(existing) || id === 'custom'
  const value = name => dialog.querySelector(`[name="${name}"]`).value.trim()
  const name = fullForm ? value('model-name') : preset[1]
  const protocol = fullForm ? value('model-protocol') : id === 'anthropic' ? 'anthropic-messages' : 'openai-completions'
  const endpoint = fullForm ? value('model-endpoint') : value('model-endpoint') || preset[2]
  const url = httpUrl(endpoint)
  const models = fullForm ? [...new Set(value('model-id').split(/[,，]/).map(id => id.trim()).filter(Boolean))] : preset[3]
  const extra = fullForm ? [...dialog.querySelectorAll('[data-alt-protocol]:not([hidden]) input, [name="model-list-url"]')].filter(input => input.value.trim()) : []
  const invalidExtra = extra.find(input => !httpUrl(input.value.trim()))
  if (!name || !url || !models.length || invalidExtra) {
    const message = !name ? '请输入供应商名称。' : !url ? '请输入有效的 HTTP 或 HTTPS 地址。'
      : !models.length ? '请输入至少一个模型 ID。' : '请检查更多端点中的地址。'
    showFeedback(dialog, message, 'error')
    return null
  }
  const endpoints = Object.fromEntries(extra.map(input => [input.name.replace(/^extra-/, ''), input.value.trim()]))
  const checked = !dialog.querySelector('[data-model-results]').hidden
  const status = checked ? stat('ok', '已检查') : existing?.endpoint === endpoint ? existing.status : stat('empty', '未检测')
  return { id, name, host: url.host, endpoint, protocol, endpoints, models, def: existing?.def, hasKey: Boolean(existing?.hasKey || value('model-key')), status }
}
function setAgentCheck(dialog, checked, message, tone = '') {
  dialog.querySelector('[data-agent-settings]').dataset.checked = String(checked)
  dialog.querySelector('[data-action="save-agent"]').disabled = dialog.querySelector('.sw.on') !== null && !checked
  showFeedback(dialog, message, tone)
}
function refreshAgentGroups() {
  refreshGroup('.agent-external', externalAgentsGroup())
  refreshGroup('.agent-defaults', agentDefaultsGroup())
}
function refreshAgentDirectory(dialog) {
  const query = dialog.querySelector('[name="agent-filter"]').value
  const filter = dialog.querySelector('[name="agent-detected-filter"]').value
  dialog.querySelector('.agent-directory').innerHTML = agentDirectory(query, filter)
}
function customAgentProfile(form) {
  const field = name => form.querySelector(`[name="${name}"]`).value.trim()
  const name = field('acp-name')
  const command = field('acp-command')
  if (!name || !command) throw new Error('请输入名称和可执行文件。')
  if (['fox', ...agentKeys, ...configuredAgentKeys().filter(key => demo.agents[key]?.custom)].some(key => key !== form.dataset.agentSettings
    && agentProfile(key).name.toLowerCase() === name.toLowerCase())) throw new Error('这个 Agent 名称已使用。')
  const envNames = [...form.querySelectorAll('[name="acp-env-name"]')].map(input => input.value.trim())
  if (envNames.some(name => !/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) || new Set(envNames).size !== envNames.length) {
    throw new Error('请填写有效且不重复的环境变量名，或移除空行。')
  }
  return { name, command, args: field('acp-args').split(/\r?\n/).filter(arg => arg.trim()), envNames, route: '本机 ACP', m: { icon: 'square-terminal' } }
}
function drawerAction(card, target) {
  const action = target.dataset.action
  if (action === 'add-agent' || action === 'unsupported-agents') {
    openSheet(card, agentCatalogSheet(action === 'unsupported-agents' ? 'missing' : 'all'), '[name="agent-filter"]')
    return
  }
  if (action === 'detect-agents') {
    const catalog = target.closest('[data-sheet="agent-catalog"]')
    refreshAgentGroups()
    if (catalog) refreshAgentDirectory(catalog)
    else card.querySelector('[data-action="detect-agents"]')?.focus({ preventScroll: true })
    notice(`示例检测完成，发现 ${agentKeys.filter(agentDetected).length} 个预设 Agent。`)
    return
  }
  if (action === 'configure-agent') {
    const key = target.closest('[data-agent]').dataset.agent
    const content = demo.agents[key]?.custom ? customAcpSheet(key) : connectSheet(key)
    if (target.closest('.sheet')) replaceSheet(card, content)
    else openSheet(card, content)
    return
  }
  if (action === 'custom-acp') {
    replaceSheet(card, customAcpSheet(), '[name="acp-name"]')
    return
  }
  if (action === 'back-agent-catalog') {
    replaceSheet(card, agentCatalogSheet(), '[name="agent-filter"]')
    return
  }
  if (action === 'add-connector') { openSheet(card, connectorSheet()); return }
  if (action === 'add-provider') { openSheet(card, addSheet(), '[name="provider-filter"]'); return }
  if (action === 'edit-model') {
    const service = modelServices().find(entry => entry.id === target.dataset.service)
    openSheet(card, providerForm(service.id, '', service))
    return
  }
  const dialog = target.closest('.sheet')
  if (action === 'add-acp-env' || action === 'remove-acp-env') {
    if (action === 'add-acp-env') {
      const rows = dialog.querySelector('[data-acp-env]')
      rows.insertAdjacentHTML('beforeend', acpEnvRow())
      rows.lastElementChild.querySelector('input').focus()
    } else {
      target.closest('.agent-env-row').remove()
      dialog.querySelector('[data-action="add-acp-env"]').focus()
    }
    setAgentCheck(dialog, false, '环境变量已更改，请重新检查。')
    return
  }
  if (action === 'pick-provider' || action === 'custom-provider') {
    const id = target.dataset.provider || 'custom'
    replaceSheet(card, providerForm(id, dialog.querySelector('[name="provider-filter"]').value), id === 'custom' ? '[name="model-name"]' : '[name="model-key"]')
    return
  }
  if (action === 'back-to-providers') {
    const { catalogFilter, modelProvider } = dialog.querySelector('[data-model-provider]').dataset
    const selection = modelProvider === 'custom' ? '[data-action="custom-provider"]' : `[data-provider="${modelProvider}"]`
    replaceSheet(card, addSheet(catalogFilter), selection)
    return
  }
  if (action === 'toggle-model-key') {
    const key = dialog.querySelector('[name="model-key"]')
    key.type = key.type === 'password' ? 'text' : 'password'
    target.textContent = key.type === 'password' ? '显示' : '隐藏'
    return
  }
  if (action === 'check-model') {
    const details = modelDetails(dialog)
    if (!details) return
    const key = dialog.querySelector('[name="model-key"]')
    const local = details.protocol === 'openai-completions'
      && ['localhost', '127.0.0.1', '[::1]'].includes(new URL(details.endpoint).hostname)
    if (!local && !details.hasKey) { showFeedback(dialog, '请输入示例 API Key。', 'error'); key.focus(); return }
    const results = dialog.querySelector('[data-model-results]')
    results.querySelector('.tools').innerHTML = details.models.map(model => `<div><b>${escapeHtml(model)}</b></div>`).join('')
    results.hidden = false
    dialog.querySelector('[data-action="save-model"]').disabled = false
    showFeedback(dialog, `${details.name} 示例检查通过 · ${details.models.length} 个模型`, 'success')
    return
  }
  if (action === 'save-model') {
    const service = modelDetails(dialog)
    if (!service) return
    if (service.id === 'custom') service.id = `custom-${crypto.randomUUID()}`
    demo.services = [...demo.services.filter(entry => entry.id !== service.id), service]
    saveDemo()
    closeSheet(card)
    refreshGroup('.model-services', modelServiceList())
    card.querySelector(`[data-service="${service.id}"]`)?.focus({ preventScroll: true })
    document.querySelectorAll('[name="default-model"]').forEach(select => {
      const selected = select.value
      select.replaceChildren(...modelOptions().map(model => new Option(model, model, false, model === selected)))
    })
    notice(`已保存 ${service.name} 示例服务。`)
    return
  }
  if (action === 'save-connector') {
    const form = dialog.querySelector('[data-connector-settings]')
    const name = form.querySelector('[name="connector-name"]').value.trim()
    const type = form.querySelector('[name="connector-type"]').value
    const command = form.querySelector('[name="connector-command"]').value.trim()
    const endpoint = form.querySelector('[name="connector-endpoint"]').value.trim()
    if (!name || (type === 'stdio' ? !command : !httpUrl(endpoint))) {
      showFeedback(dialog, !name ? '请输入连接器名称。' : type === 'stdio' ? '请输入启动命令。' : '请输入有效的 HTTP 或 HTTPS 地址。', 'error')
      return
    }
    const editingId = form.dataset.connectorSettings
    const id = editingId || `demo-${Object.keys(demo.connectors).length + 1}`
    const settings = type === 'stdio' ? { command, args: form.querySelector('[name="connector-args"]').value.trim() } : { endpoint }
    demo.connectors[id] = { id, name, type, ...settings, on: form.querySelector('.sw.on') !== null }
    saveDemo()
    closeSheet(card)
    refreshGroup('.connector-services', connectorsGroup())
    if (editingId) card.querySelector(`[data-connector="${id}"]`)?.focus({ preventScroll: true })
    notice(`${name} 已保存到连接器列表。`)
    return
  }
  if (action === 'save-search') {
    const provider = dialog.querySelector('[name="search-provider"]:checked').value
    const visibleFields = dialog.querySelector(`[data-search-fields="${provider}"]`)
    const input = visibleFields?.querySelector('input')
    if (provider === 'searxng') {
      const endpoint = input.value.trim()
      if (!httpUrl(endpoint)) { showFeedback(dialog, '请输入有效的 SearXNG 实例地址。', 'error'); input.focus(); return }
      demo.search.endpoint = endpoint
    } else if (provider !== 'auto' && !demo.search.keys.includes(provider)) {
      if (!input.value.trim()) { showFeedback(dialog, '请输入该供应商的示例 API Key。', 'error'); input.focus(); return }
      demo.search.keys.push(provider)
    }
    demo.search.provider = provider
    saveDemo()
    document.querySelectorAll('.configure-search').forEach(button => {
      button.closest('.irow').querySelector('.stat b').textContent = SEARCH.find(entry => entry.k === provider).name
    })
    closeSheet(card)
    notice('已保存网页搜索的示例配置。')
    return
  }
  if (action === 'check-agent' || action === 'save-agent') {
    const form = dialog.querySelector('[data-agent-settings]')
    let key = form.dataset.agentSettings
    let custom
    if (form.hasAttribute('data-custom-acp')) {
      try {
        custom = customAgentProfile(form)
      } catch (error) {
        setAgentCheck(dialog, false, error.message, 'error')
        return
      }
    }
    const values = Object.fromEntries([...form.querySelectorAll('select[name]')].map(select => [select.name, select.value]))
    const enabled = form.querySelector('.sw.on') !== null
    if (action === 'check-agent') {
      const issue = custom ? '' : !agentDetected(key) ? '本机未检测到该命令，请自行安装后重新检测。'
        : agentNeedsLogin(key, values['agent-source']) ? '本机尚未登录。请先在该 Agent 完成登录，或使用 Fox 中的模型服务。'
        : form.dataset.failed === 'true' && values['agent-source'] === foxAgentSource && values['agent-model'] === modelOptions()[0]
          ? '示例 401：请选择其他模型或使用本机登录。' : ''
      setAgentCheck(dialog, !issue, issue || (custom ? '表单检查通过，已演示 ACP 握手成功。' : '示例检查通过 · 连接和试跑正常。'), issue ? 'error' : 'success')
      return
    }
    if (custom && !key) key = `acp-${crypto.randomUUID()}`
    demo.agents[key] = { enabled, values, checked: form.dataset.checked === 'true', ...(custom ? { custom } : {}) }
    saveDemo()
    closeSheet(card)
    refreshAgentGroups()
    card.querySelector(`[data-agent="${key}"] [data-action="configure-agent"]`)?.focus({ preventScroll: true })
    notice(`已保存 ${agentProfile(key).name} 示例配置。`)
    return
  }
  const project = PROJECTS.find(entry => entry.id === dialog.querySelector('[data-project-settings]').dataset.projectSettings)
  if (action === 'open-project') { notice(`示例目录 ${project.path}`); return }
  setProjectMode(project.id, dialog.querySelector('[name="project-mode"]').value)
  closeSheet(card)
  notice(`已保存 ${project.name} 的示例权限。`)
}

document.addEventListener('input', event => {
  const input = event.target
  if (input.name === 'agent-filter') { refreshAgentDirectory(input.closest('.sheet')); return }
  if (input.closest('[data-custom-acp]')) {
    setAgentCheck(input.closest('.sheet'), false, '运行配置已更改，请重新检查。')
    return
  }
  if (input.name === 'provider-filter') {
    input.closest('.sheet').querySelector('.provider-directory').innerHTML = providerDirectory(input.value)
    return
  }
  const dialog = input.closest('[data-sheet="model"]')
  if (dialog) {
    if (input.name === 'model-protocol') dialog.querySelectorAll('[data-alt-protocol]').forEach(field => {
      field.hidden = field.dataset.altProtocol === input.value
    })
    resetModelCheck(dialog)
  }
})
document.addEventListener('submit', event => {
  if (!event.target.matches('.search-form')) return
  event.preventDefault()
  event.target.closest('.sheet').querySelector('[data-action="save-search"]').click()
})
document.addEventListener('keydown', event => {
  const sheet = event.target.closest('.sheet')
  if (event.key === 'Escape' && sheet) { closeSheet(sheet.parentElement); return }
  if (event.key === 'Tab' && sheet) {
    const nodes = [...sheet.querySelectorAll('button, input, select, textarea, summary, [tabindex="0"], [contenteditable="true"]')].filter(el => !el.disabled && el.getClientRects().length)
    const first = nodes[0], last = nodes.at(-1)
    if (event.shiftKey && event.target === first) { event.preventDefault(); last.focus() }
    else if (!event.shiftKey && event.target === last) { event.preventDefault(); first.focus() }
  }
  if (['Enter', ' '].includes(event.key) && ['button', 'switch'].includes(event.target.getAttribute('role'))) { event.preventDefault(); event.target.click() }
})
document.addEventListener('change', event => {
  const el = event.target
  if (el.name === 'agent-detected-filter') refreshAgentDirectory(el.closest('.sheet'))
  if (el.name === 'agent-computer') {
    demo.agentComputer = el.value
    saveDemo()
    refreshAgentDirectory(el.closest('.sheet'))
    refreshAgentGroups()
  }
  if (el.name === 'new-agent') {
    const card = el.closest('.card')
    demo.defaultAgent = el.value
    saveDemo()
    refreshGroup('.agent-defaults', agentDefaultsGroup())
    card.querySelector('[name="new-agent"]')?.focus()
  }
  if (el.name === 'settings-page') location.search = `?frame=${el.value}`
  if (el.name === 'jump-frame' && el.value) location.hash = el.value
  if (el.dataset.projectMode) setProjectMode(el.dataset.projectMode, el.value)
  if (el.name === 'search-provider') {
    el.form.querySelectorAll('[data-search-fields]').forEach(fields => {
      fields.hidden = fields.dataset.searchFields !== el.value
    })
    showFeedback(el.closest('.sheet'), '')
  }
  if (el.name === 'connector-type') {
    const form = el.closest('[data-connector-settings]')
    form.querySelector('[data-connector-fields="stdio"]').hidden = el.value !== 'stdio'
    form.querySelector('[data-connector-fields="remote"]').hidden = el.value === 'stdio'
    form.querySelector('[data-connector-address]').textContent = el.value === 'openapi' ? 'OpenAPI 规范地址' : 'MCP 服务地址'
    showFeedback(el.closest('.sheet'), '')
  }
  if (el.name === 'agent-source') {
    const local = el.selectedIndex === 1
    el.closest('.sh-sec').querySelector('.source-service').hidden = local
    el.closest('.sh-sec').querySelector('.source-local').hidden = !local
  }
  if (['agent-source', 'agent-model'].includes(el.name)) setAgentCheck(el.closest('.sheet'), false, '模型来源已更改，请重新检查。')
  if (el.classList.contains('developer-mode')) el.closest('.grp').querySelector('.developer-details').hidden = !el.checked
  if (el.classList.contains('backup-file') && el.files.length) notice(`已选择 ${el.files[0].name}。原型仅演示选择文件，不执行恢复。`)
})
document.addEventListener('click', event => {
  const target = event.target.closest('.btn, .provider-option, .model-service-open, .x, .scrim, .sw, .seg > span, .mi, .disc')
  if (!target || target.disabled || target.classList.contains('dis') || target.tagName === 'LABEL') return
  const card = target.closest('.card')
  const text = target.textContent.trim()
  if (target.matches('.x, .scrim') || ['取消', '关闭'].includes(text)) { closeSheet(card); return }
  if (target.dataset.action) { drawerAction(card, target); return }
  if (target.dataset.project) {
    openSheet(card, projectSheet(PROJECTS.find(project => project.id === target.dataset.project)))
    return
  }
  if (target.dataset.connector) {
    openSheet(card, connectorSheet(connectorList().find(connector => connector.id === target.dataset.connector)))
    return
  }
  if (target.matches('.sw')) {
    const on = target.classList.toggle('on')
    target.setAttribute('aria-checked', String(on))
    const dialog = target.closest('[data-sheet="agent"]')
    if (dialog) {
      const checked = dialog.querySelector('[data-agent-settings]').dataset.checked === 'true'
      setAgentCheck(dialog, checked, !on ? '停用状态可以直接保存。' : checked ? '示例检查通过 · 连接和试跑正常。' : '尚未检查。检查通过后可保存。', on && checked ? 'success' : '')
    }
    const connectorToggle = target.closest('[data-connector-toggle]')
    if (connectorToggle) {
      const id = connectorToggle.dataset.connectorToggle
      const connector = connectorList().find(entry => entry.id === id)
      demo.connectors[id] = { ...connector, on }
      saveDemo()
      refreshGroup('.connector-services', connectorsGroup())
      card.querySelector(`[data-connector-toggle="${id}"] .sw`)?.focus({ preventScroll: true })
    }
    return
  }
  if (target.matches('.seg > span')) { [...target.parentElement.children].forEach(el => el.classList.remove('on')); target.classList.add('on'); return }
  if (target.matches('.configure-search')) { openSheet(card, searchSheet()); return }
  if (text === '管理 Hook') { openSheet(card, hookSheet()); return }
  if (text === '编辑助手') {
    openSheet(card, sheet({ m: AG.fox.m, title: 'Fox 通用助手', body: fld('名称', edit('assistant-name', 'Fox')) + fld('介绍', edit('assistant-description', '日常工作助手')) + fld('工作要求', ta('清楚说明结果，需要时先询问。')) + fld('开场建议', ta('今天有什么需要一起完成？')), foot: btn('取消') + btn('保存助手', { kind: 'primary' }) })); return
  }
  if (text === '选择总目录') {
    openSheet(card, sheet({ m: { icon: 'folder-open' }, title: '伙伴工作目录', desc: '原型用路径输入模拟系统文件夹选择器。', body: fld('总目录', edit('companion-root', card.querySelector('.root-path').textContent), '只影响新建伙伴，不会搬迁已有文件。'), foot: btn('取消') + btn('使用此目录', { kind: 'primary' }) })); return
  }
  if (text === '使用此目录') {
    const input = card.querySelector('[name="companion-root"]')
    if (!/^(?:[a-z]:[\\/]|\\\\)/i.test(input.value.trim())) { input.focus(); notice('请输入完整的 Windows 文件夹路径。'); return }
    demo.companionRoot = input.value.trim()
    saveDemo()
    document.querySelectorAll('.root-path').forEach(path => { path.textContent = demo.companionRoot })
    closeSheet(card)
    notice('已更新新伙伴的示例总目录。')
    return
  }
  if (target.classList.contains('icon') && target.closest('.irow')) {
    const row = target.closest('.irow')
    openSheet(card, sheet({ m: { icon: 'settings' }, title: escapeHtml(row.querySelector('b').textContent), desc: '原型操作预览，真实数据不受影响。', body: sec('操作', btn('编辑') + btn('设为默认') + btn('检查连接') + btn('删除', { kind: 'danger' })), foot: btn('关闭') })); return
  }
  if (text.startsWith('保存')) { notice('已保存本页演示选择；刷新后恢复示例，不写入真实配置。'); if (target.closest('.sheet')) closeSheet(card); return }
  notice(`「${text || '更多操作'}」是原型展示入口，未接入应用服务。`)
})
render()
</script>
</body>
</html>
