<!doctype html>
<html lang="zh-CN" data-color-theme="graphite">
<head>
<meta charset="utf-8" />
<title>Fox 右侧栏重设计</title>
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Regular.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Medium.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Semibold.css" />
<!-- Colours and radii come straight from the app, so the mockup follows any theme change. -->
<link rel="stylesheet" href="../../../apps/desktop/src/styles/themes.css" />
<script src="icons.js"></script>
<script>
  (() => {
    const params = new URLSearchParams(location.search)
    const theme = params.get('theme') || localStorage.getItem('fox-mock-theme') || 'graphite'
    const mode = params.get('mode') || localStorage.getItem('fox-mock-mode') || 'light'
    document.documentElement.dataset.colorTheme = theme
    document.documentElement.classList.toggle('dark', mode === 'dark')
  })()
</script>
<style>
/* Derived tokens, recomputed inside every scope so a forced-dark panel next to a
   light one resolves its own colours. Mirrors apps/desktop/src/styles/globals.css. */
:root, .scope {
  --content: var(--chat-background, var(--background));
  --faint: color-mix(in oklch, var(--muted-foreground) 72%, transparent);
  --hover: color-mix(in oklch, var(--foreground) 4.5%, transparent);
  --shadow-sm: 0 1px 2px color-mix(in oklch, var(--foreground) 6%, transparent);
  --shadow-md: 0 4px 16px color-mix(in oklch, var(--foreground) 9%, transparent);
  --shadow-lg: 0 16px 45px color-mix(in oklch, var(--foreground) 12%, transparent);
  /* The side panel sits a step below the chat card, its cards a step above. */
  --rp-bg: color-mix(in oklch, var(--shell) 55%, var(--background));
  --rp-card: var(--card);
  --rp-line: color-mix(in oklch, var(--border) 80%, transparent);
  --rp-radius: 12px;
  --rp-tile: color-mix(in oklch, var(--muted) 70%, var(--card));
  --rp-sunk: var(--background);
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
.dark, .scope.dark {
  color-scheme: dark;
  --content: var(--card);
  --faint: color-mix(in oklch, var(--muted-foreground) 82%, var(--background));
  --hover: color-mix(in oklch, var(--foreground) 6%, transparent);
  --shadow-sm: 0 1px 2px color-mix(in oklch, black 30%, transparent);
  --shadow-md: 0 6px 20px color-mix(in oklch, black 32%, transparent);
  --shadow-lg: 0 18px 55px color-mix(in oklch, black 35%, transparent);
  --rp-bg: color-mix(in oklch, var(--shell) 40%, var(--background));
  --rp-card: color-mix(in oklch, var(--card) 92%, var(--foreground));
  --rp-line: var(--border);
  --rp-tile: color-mix(in oklch, var(--card) 84%, var(--foreground));
  --rp-sunk: var(--card);
}
:root { font-family: "HarmonyOS Sans SC", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; font-synthesis: none; color: var(--foreground); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
body { margin: 0; background: color-mix(in oklch, var(--shell) 70%, var(--muted)); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.grow { flex: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1.1s linear infinite; }

/* ---------- Doc shell ---------- */
.doc { width: 1360px; margin: 0 auto; padding: 56px 40px 120px; }
.doc-hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
.doc-hero p { margin: 0; max-width: 860px; color: var(--muted-foreground); font-size: 14px; line-height: 1.75; }
.doc-block { margin-top: 24px; padding: 28px 32px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
.doc-block h2 { margin: 0 0 18px; font-size: 16px; font-weight: 600; }
.principles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.principles b { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.principles span { color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
table.map { width: 100%; border-collapse: collapse; font-size: 13px; }
table.map th { padding: 0 16px 10px 0; color: var(--muted-foreground); font-size: 12px; font-weight: 500; text-align: left; }
table.map td { padding: 12px 16px 12px 0; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.65; color: var(--muted-foreground); }
table.map td:first-child { color: var(--foreground); font-weight: 500; white-space: nowrap; }
table.map td b { color: var(--foreground); font-weight: 500; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.toc a { padding: 6px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 13px; text-decoration: none; }
.toc a:hover { color: var(--foreground); }
.frame { margin-top: 72px; scroll-margin-top: 80px; }
.frame-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.frame-head .no { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.frame-head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.frame-head p { margin: 0; color: var(--muted-foreground); font-size: 14px; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
.notes div { padding: 16px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
.notes h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.notes h4 svg { width: 14px; height: 14px; color: var(--muted-foreground); }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted-foreground); font-size: 13px; line-height: 1.75; }
.switcher { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); font-size: 13px; color: var(--muted-foreground); }
.switcher svg { width: 15px; height: 15px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--muted); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.seg .on { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: var(--shadow-sm); }

/* ---------- Fox window (current chrome) ---------- */
.win { position: relative; width: 1280px; height: 800px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--shell); border: 1px solid var(--border); box-shadow: var(--shadow-lg); color: var(--foreground); font-size: 13px; }
.titlebar { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; }
.tb-left { display: flex; align-items: center; gap: 2px; padding-left: 10px; color: var(--muted-foreground); }
.tb-left img { width: 20px; height: 20px; margin-right: 6px; }
.tb-left span { width: 28px; height: 28px; display: grid; place-items: center; }
.tb-left span.off { color: var(--faint); opacity: .6; }
.wctl { display: flex; height: 100%; }
.wctl span { width: 46px; display: grid; place-items: center; color: var(--muted-foreground); }
.wctl svg { width: 15px; height: 15px; }
.app { flex: 1; min-height: 0; display: flex; }

.side { width: 236px; flex: none; display: flex; flex-direction: column; padding: 6px 12px 12px 14px; }
.side-top { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; }
.mode { display: inline-flex; padding: 3px; border-radius: 999px; background: color-mix(in oklch, var(--foreground) 5%, transparent); }
.mode span { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: 999px; color: var(--muted-foreground); font-weight: 500; }
.mode span.on { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
.mode svg { width: 15px; height: 15px; }
.sib { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted-foreground); }
.sib .dot-red { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--destructive); }
.nav div { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 10px; font-size: 14px; }
.nav div small { margin-left: auto; color: var(--faint); font-size: 12px; }
.nav svg { width: 17px; height: 17px; }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 4px; padding: 0 4px 0 8px; color: var(--muted-foreground); font-size: 12.5px; }
.sec svg { width: 15px; height: 15px; }
.contact { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; height: 54px; padding: 0 8px; border-radius: 12px; }
.contact img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--muted); }
.contact b { display: block; font-weight: 500; font-size: 14px; }
.contact span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted-foreground); font-size: 12px; }
.contact small { color: var(--faint); font-size: 12px; align-self: start; margin-top: 10px; }
.convs div { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 10px; color: color-mix(in oklch, var(--foreground) 88%, var(--muted-foreground)); font-size: 13.5px; }
.convs div span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.convs div.on { background: color-mix(in oklch, var(--foreground) 6%, transparent); color: var(--foreground); font-weight: 500; }
.convs .run { width: 12px; height: 12px; color: var(--muted-foreground); }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 2px 0 6px; }
.foot img { width: 28px; height: 28px; border-radius: 50%; }
.foot b { flex: 1; font-weight: 500; font-size: 14px; }

/* Chat card (unchanged geometry: same margins, radii and shadow as .fox-content-card). */
.chat { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; margin: 2px 5px 5px 0; border-radius: 12px 12px 8px 12px; background: var(--content); box-shadow: var(--shadow-sm); overflow: hidden; }
.chat.with-panel { border-radius: 12px; }
.ctop { flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }
.ctop .proj { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--muted-foreground); }
.ctop .proj svg { width: 15px; height: 15px; }
.ctop strong { font-size: 14px; font-weight: 600; }
.ctop .more { color: var(--muted-foreground); width: 28px; height: 28px; display: grid; place-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: color-mix(in oklch, var(--foreground) 5%, transparent); color: var(--muted-foreground); font-size: 12px; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px color-mix(in oklch, var(--success) 20%, transparent); }
.tgl { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: var(--muted-foreground); }
.tgl.on { background: color-mix(in oklch, var(--foreground) 7%, transparent); color: var(--foreground); }
.thread { flex: 1; min-height: 0; overflow: hidden; padding: 12px 0 0; }
.col { max-width: 680px; margin: 0 auto; padding: 0 32px; }
.umsg { display: flex; justify-content: flex-end; margin: 8px 0 22px; }
.umsg div { max-width: 78%; padding: 10px 16px; border-radius: 20px; background: var(--foreground); color: var(--background); font-size: 14px; line-height: 1.7; }
.amsg { font-size: 14px; line-height: 1.85; color: color-mix(in oklch, var(--foreground) 92%, var(--muted-foreground)); }
.amsg p { margin: 0 0 10px; }
.proc { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--muted-foreground); font-size: 13px; }
.proc svg { width: 14px; height: 14px; }
.filechip { display: inline-flex; align-items: center; gap: 10px; margin: 4px 0 12px; padding: 8px 14px 8px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-sm); }
.filechip .ft { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--muted); color: var(--muted-foreground); }
.filechip b { display: block; font-size: 13px; font-weight: 500; }
.filechip small { color: var(--faint); font-size: 12px; }
.shimmer { display: inline-flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13.5px; }
.shimmer svg { width: 14px; height: 14px; }
.composer { flex: none; margin: 0 auto 16px; width: calc(100% - 64px); max-width: 680px; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px 0 10px; border-radius: 26px; background: var(--background); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--muted-foreground); font-size: 14px; }
.dark .composer { background: var(--rp-card); }
.composer .plus { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); }
.composer .ask { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.composer .ask svg { width: 15px; height: 15px; }
.composer .send { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--foreground); color: var(--background); }
.composer .send.stop svg { width: 12px; height: 12px; fill: currentColor; }
.hello { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 170px; }
.hello img { width: 72px; height: 72px; }
.hello h1 { margin: 0; font-size: 22px; font-weight: 600; }
.hello p { margin: 0; color: var(--muted-foreground); font-size: 13px; }

/* ================= Right panel shell ================= */
.rp { position: relative; flex: none; width: 320px; display: flex; flex-direction: column; min-height: 0; margin: 2px 5px 5px 0; border-radius: 12px 12px 8px 12px; background: var(--rp-bg); border: 1px solid var(--rp-line); box-shadow: var(--shadow-sm); overflow: hidden; color: var(--foreground); font-size: 13px; }
.rp-tabs { flex: none; display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 8px 0 10px; }
.rp-tab { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 30px; padding: 0 12px 0 10px; border-radius: 9px; color: var(--muted-foreground); font-weight: 500; }
.rp-tab svg { width: 14px; height: 14px; }
.rp-tab .lbl { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rp-tab .x { width: 12px; height: 12px; margin-left: 2px; color: var(--faint); }
.rp-tab.on { flex: 0 1 auto; background: var(--rp-card); color: var(--foreground); border: 1px solid var(--rp-line); box-shadow: var(--shadow-sm); }
.rp-tab.on:has(.x) { padding-right: 8px; }
/* Tabs that are not in front collapse to their icon so a file tab still fits. */
.rp-tab.icon { flex: none; width: 30px; padding: 0; justify-content: center; }
.rp-ic { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted-foreground); }
.rp-ic svg { width: 15px; height: 15px; }
.rp-ic.on { background: color-mix(in oklch, var(--foreground) 6%, transparent); color: var(--foreground); }
.rp-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 2px 12px 16px; }
.rp-body::-webkit-scrollbar { display: none; }

/* ---------- Shared card language (same as the Xiao Fox side card) ---------- */
.rs + .rs, .rs + .rc, .rc + .rs, .rc + .rc, .rp-seg + .rs, .addr + .rc { margin-top: 12px; }
.rs-h { display: flex; align-items: center; gap: 6px; height: 20px; margin: 0 4px 7px; color: var(--muted-foreground); font-size: 12.5px; font-weight: 500; }
.rs-h small { color: var(--faint); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.rs-h a { display: inline-flex; align-items: center; gap: 1px; margin-left: auto; color: var(--faint); font-size: 12px; font-weight: 400; }
.rs-h a svg { width: 13px; height: 13px; }
.rs-h .pill { height: 20px; margin-left: 2px; }
.rc { position: relative; overflow: hidden; border-radius: var(--rp-radius); background: var(--rp-card); border: 1px solid var(--rp-line); box-shadow: var(--shadow-sm); }

.row { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 42px; padding: 6px 10px; }
.row + .row::before { content: ''; position: absolute; top: 0; left: 48px; right: 10px; height: 1px; background: var(--rp-line); }
.row.hover, .row.sel { background: var(--hover); }
.row.sel { background: color-mix(in oklch, var(--foreground) 6.5%, transparent); }
.row.hover::before, .row.hover + .row::before, .row.sel::before, .row.sel + .row::before { opacity: 0; }
.row.tall { align-items: start; padding-top: 9px; padding-bottom: 9px; }
.row.tall .tile { margin-top: 1px; }
.tile { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--rp-tile); border: 1px solid var(--rp-line); color: var(--muted-foreground); font-size: 12px; font-weight: 600; }
.tile svg { width: 15px; height: 15px; }
.tile.img { padding: 0; overflow: hidden; border-radius: 50%; background: var(--muted); }
.tile.img img { width: 100%; height: 100%; object-fit: cover; }
.tile.err { color: var(--destructive); }
.tx { min-width: 0; }
.tx b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 500; line-height: 19px; }
.tx b.mono, .mono { font-family: var(--mono); font-size: 12.5px; font-weight: 400; }
.tx small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--faint); font-size: 12px; line-height: 17px; }
.tx small.warn { color: var(--warning); }
.tx small.err { color: var(--destructive); }
.tx p { margin: 3px 0 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trail { display: flex; align-items: center; gap: 4px; color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trail svg { width: 14px; height: 14px; }
.trail .mini { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--muted-foreground); }
.trail .mini.box { border: 1px solid var(--rp-line); background: var(--rp-card); box-shadow: var(--shadow-sm); color: var(--foreground); }
.trail.faint { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: color-mix(in oklch, var(--foreground) 5%, transparent); color: var(--muted-foreground); font-size: 11.5px; font-weight: 400; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.pill svg { width: 12px; height: 12px; }
/* Colour only where the user has to act or something went wrong. */
.pill.err { background: color-mix(in oklch, var(--destructive) 11%, transparent); color: var(--destructive); }
.pill.warn { background: color-mix(in oklch, var(--warning) 14%, transparent); color: var(--warning); }
.rbtn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--rp-line); background: var(--rp-card); box-shadow: var(--shadow-sm); color: var(--foreground); font-size: 12px; font-weight: 500; white-space: nowrap; }
.rbtn svg { width: 13px; height: 13px; }
.rbtn.danger { color: var(--destructive); }
.rbtn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-foreground); }
.more-row { display: flex; align-items: center; gap: 2px; padding: 8px 12px 9px 48px; border-top: 1px solid var(--rp-line); color: var(--faint); font-size: 12px; }
.more-row.flat { padding-left: 12px; color: var(--muted-foreground); }
.more-row.flat svg:last-child { margin-left: auto; }
.more-row svg { width: 13px; height: 13px; }
.note { display: flex; align-items: center; gap: 6px; padding: 8px 12px 9px; border-top: 1px solid var(--rp-line); color: var(--faint); font-size: 11.5px; }
.note svg { width: 13px; height: 13px; }
.note .info { margin-left: auto; }
.hint { display: flex; align-items: flex-start; gap: 6px; margin: 12px 6px 0; color: var(--faint); font-size: 11.5px; line-height: 1.6; }
.hint svg { width: 13px; height: 13px; margin-top: 2.5px; }
.grp { padding: 9px 12px 2px; color: var(--faint); font-size: 11.5px; }
.row + .grp, .vers + .grp { margin-top: 2px; border-top: 1px solid var(--rp-line); }

/* ---------- Summary cards ---------- */
.live { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--rp-line); color: var(--muted-foreground); font-size: 12px; }
.live svg { width: 13px; height: 13px; }
.live b { color: var(--foreground); font-weight: 500; }
.live span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--faint); }
.steps { padding: 4px 0 2px; }
.earlier { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 13px; color: var(--faint); font-size: 12px; }
.earlier svg { width: 14px; height: 14px; }
.step { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 5px 12px; font-size: 13px; line-height: 19px; }
.step > svg { width: 16px; height: 16px; margin-top: 1.5px; position: relative; z-index: 1; background: var(--rp-card); border-radius: 50%; }
.step + .step::before { content: ''; position: absolute; left: 19.5px; top: -6px; height: 14px; width: 1px; background: var(--rp-line); }
.step.done { color: var(--muted-foreground); }
.step.done > svg { color: var(--faint); }
.step.now { color: var(--foreground); font-weight: 500; }
.step.now small { display: block; margin-top: 1px; color: var(--faint); font-size: 12px; font-weight: 400; }
.step.todo { color: var(--faint); }
.progress { height: 3px; margin: 0 12px 10px; border-radius: 99px; background: color-mix(in oklch, var(--foreground) 7%, transparent); overflow: hidden; }
.progress span { display: block; height: 100%; border-radius: inherit; background: var(--foreground); opacity: .7; }
.preview { position: relative; height: 78px; margin: 8px 8px 2px; padding: 10px 12px; overflow: hidden; border-radius: 9px; background: var(--rp-sunk); border: 1px solid var(--rp-line); }
.preview h5 { margin: 0 0 6px; font-family: "Songti SC", "SimSun", serif; font-size: 14px; font-weight: 600; }
.preview p { margin: 0 0 8px; color: var(--muted-foreground); font-size: 11px; line-height: 1.6; }
.preview i, .docpage i, .site i { display: block; height: 5px; margin: 0 0 6px; border-radius: 3px; background: color-mix(in oklch, var(--foreground) 7%, transparent); }
.preview::after { content: ''; position: absolute; inset: auto 0 0; height: 34px; background: linear-gradient(transparent, var(--rp-sunk)); }
.empty { padding: 14px 14px 15px; color: var(--muted-foreground); font-size: 12.5px; line-height: 1.7; }
.empty b { display: block; margin-bottom: 2px; color: var(--foreground); font-size: 13px; font-weight: 500; }
.ghost-rows { display: grid; gap: 8px; padding: 0 14px 14px; }
.ghost-rows i { display: flex; align-items: center; gap: 10px; height: 28px; }
.ghost-rows i::before { content: ''; width: 28px; height: 28px; border-radius: 8px; border: 1px dashed var(--rp-line); }
.ghost-rows i::after { content: attr(data-t); color: var(--faint); font-style: normal; font-size: 12px; }

/* Popovers ("+" page menu, file "打开" menu). */
.menu { position: absolute; z-index: 6; width: 232px; padding: 6px; border-radius: 14px; background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--popover-foreground); font-size: 13px; }
.menu .lbl { padding: 4px 8px 6px; color: var(--muted-foreground); font-size: 12px; }
.menu div.it { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; border-radius: 9px; }
.menu div.it svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.menu div.it small { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu div.it.on { background: var(--hover); }
.menu .sep { height: 1px; margin: 4px 6px; background: var(--border); }

/* ---------- Page: 文件 ---------- */
.rp-search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; margin-bottom: 14px; border-radius: 10px; background: var(--rp-card); border: 1px solid var(--rp-line); box-shadow: var(--shadow-sm); color: var(--faint); }
.rp-search svg { width: 15px; height: 15px; }
.vers { position: relative; display: grid; gap: 1px; margin: 0 8px 8px 48px; padding: 3px; border-radius: 9px; background: var(--hover); }
.ver { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 3px 0 9px; border-radius: 7px; color: var(--muted-foreground); font-size: 12px; }
.ver b { color: var(--foreground); font-weight: 500; font-variant-numeric: tabular-nums; }
.ver em { color: var(--faint); font-style: normal; }
.ver > :last-child { margin-left: auto; }
.ver.hover { background: var(--rp-card); box-shadow: var(--shadow-sm); }
.tree { padding: 4px; }
.tn { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 calc(6px + var(--d, 0) * 16px); border-radius: 8px; font-size: 13px; }
.tn svg { width: 15px; height: 15px; color: var(--muted-foreground); }
.tn svg.chev { width: 13px; height: 13px; color: var(--faint); }
.tn .sp { width: 13px; flex: none; }
.tn span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tn small { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.tn.sel { background: color-mix(in oklch, var(--foreground) 6.5%, transparent); font-weight: 500; }

/* ---------- Page: 文件预览 ---------- */
.obtn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px 0 9px; border-radius: 8px; border: 1px solid var(--rp-line); background: var(--rp-card); box-shadow: var(--shadow-sm); color: var(--foreground); font-size: 12px; font-weight: 500; }
.obtn svg { width: 13px; height: 13px; }
.obtn svg:last-child { color: var(--faint); }
.obtn.on { background: var(--hover); }
.docwrap { padding: 8px; }
.fbar { display: flex; align-items: center; gap: 4px; padding: 0 10px 10px 48px; }
.docpage { height: 580px; overflow: hidden; padding: 26px 22px; border-radius: 6px; background: var(--rp-sunk); border: 1px solid var(--rp-line); font-family: "Songti SC", "SimSun", serif; }
.docpage h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; text-align: center; }
.docpage .sub { margin: 0 0 18px; color: var(--muted-foreground); font-size: 11px; text-align: center; }
.docpage h4 { margin: 14px 0 6px; font-size: 12.5px; font-weight: 600; }
.docpage p { margin: 0 0 8px; color: color-mix(in oklch, var(--foreground) 80%, var(--muted-foreground)); font-size: 11px; line-height: 1.75; text-indent: 2em; }
.docpage table { width: 100%; margin: 6px 0 10px; border-collapse: collapse; font-size: 10.5px; }
.docpage td { padding: 4px 6px; border: 1px solid var(--rp-line); color: var(--muted-foreground); }
.docpage td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Page: 更改 ---------- */
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; padding: 4px 12px 10px 48px; font-size: 12px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.out { margin: 0 8px 8px; padding: 10px 12px; overflow: hidden; border-radius: 9px; background: var(--rp-sunk); border: 1px solid var(--rp-line); color: var(--muted-foreground); font: 11.5px/1.7 var(--mono); white-space: pre; }
.out .cmd { color: var(--foreground); }
.out .e { color: var(--destructive); }
.diff { margin: 0 8px 8px; overflow: hidden; border-radius: 9px; background: var(--rp-sunk); border: 1px solid var(--rp-line); font: 11.5px/21px var(--mono); }
.diff div { display: grid; grid-template-columns: 30px 14px minmax(0, 1fr); color: var(--muted-foreground); }
.diff div > * { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.diff i { padding-right: 6px; color: var(--faint); font-style: normal; text-align: right; }
.diff .add { background: color-mix(in oklch, var(--success) 11%, transparent); color: var(--foreground); }
.diff .add u, .diff .del u { text-decoration: none; }
.diff .add u { color: var(--success); }
.diff .del { background: color-mix(in oklch, var(--destructive) 9%, transparent); color: var(--foreground); }
.diff .del u { color: var(--destructive); }
.diff .hunk { background: var(--hover); color: var(--faint); }

/* ---------- Page: 运行详情 ---------- */
.goal { padding: 11px 12px 4px; }
.goal b { display: block; font-size: 13.5px; font-weight: 600; line-height: 20px; }
.goal small { display: block; margin-bottom: 9px; color: var(--faint); font-size: 12px; }
.goal .progress { margin: 0 0 10px; }
.goal .acts { display: flex; gap: 6px; padding-bottom: 8px; }
.stack { display: flex; }
.stack img { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--rp-card); object-fit: cover; background: var(--muted); }
.stack img + img { margin-left: -8px; }
.row.team { grid-template-columns: 40px minmax(0, 1fr) auto; }

/* ---------- Page: 网页与网络 ---------- */
.rp-seg { display: flex; padding: 3px; border-radius: 10px; background: color-mix(in oklch, var(--foreground) 5%, transparent); }
.rp-seg span { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; border: 1px solid transparent; border-radius: 8px; color: var(--muted-foreground); font-weight: 500; }
.rp-seg span.on { background: var(--rp-card); border-color: var(--rp-line); box-shadow: var(--shadow-sm); color: var(--foreground); }
.rp-seg svg { width: 14px; height: 14px; }
.rp-seg small { color: var(--faint); font-size: 11.5px; font-weight: 400; }
.addr { display: flex; align-items: center; gap: 2px; height: 38px; margin-top: 12px; padding: 0 4px; border-radius: 10px; background: var(--rp-card); border: 1px solid var(--rp-line); box-shadow: var(--shadow-sm); }
.addr .mini { width: 28px; height: 28px; display: grid; place-items: center; flex: none; border-radius: 7px; color: var(--muted-foreground); }
.addr .mini svg { width: 14px; height: 14px; }
.addr .url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; overflow: hidden; border-radius: 7px; background: var(--hover); color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
.addr .url svg { width: 12px; height: 12px; flex: none; color: var(--faint); }
.site { height: 500px; overflow: hidden; border-radius: inherit; background: #fff; color: #1d2433; font-family: "Microsoft YaHei", sans-serif; }
.site i { background: #e6e9ef; }
.site-bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: oklch(0.42 0.11 255); color: #fff; font-size: 12px; font-weight: 600; }
.site-bar b { width: 18px; height: 18px; border-radius: 50%; background: oklch(0.8 0.12 85); }
.site-nav { display: flex; gap: 14px; padding: 8px 14px; border-bottom: 1px solid #e6e9ef; color: #5b6475; font-size: 11px; }
.site-body { padding: 16px 14px; }
.site-body h6 { margin: 0 0 6px; font-size: 13px; line-height: 1.55; }
.site-body small { display: block; margin-bottom: 14px; color: #8b93a3; font-size: 10.5px; }
.site-body p { margin: 0 0 10px; color: #3b4354; font-size: 11px; line-height: 1.75; text-indent: 2em; }
.res { margin: -2px 10px 10px 48px; padding: 8px 10px; border-radius: 8px; background: var(--hover); color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }
.res b { display: block; margin-bottom: 2px; color: var(--faint); font-size: 11.5px; font-weight: 400; }

/* ---------- Page: 协作助手对话 ---------- */
.msg { padding: 10px 12px 11px; color: color-mix(in oklch, var(--foreground) 92%, var(--muted-foreground)); font-size: 13px; line-height: 1.75; }
.msg p { margin: 0 0 6px; }
.msg p:last-child { margin: 0; }
.msg small { display: block; margin-top: 6px; color: var(--faint); font-size: 12px; line-height: 1.6; }
.msg ul { margin: 0; padding-left: 18px; }
.livel { display: flex; align-items: center; gap: 8px; margin: 12px 6px 0; color: var(--muted-foreground); font-size: 12px; }
.livel svg { width: 13px; height: 13px; }

/* ---------- Close-up gallery ---------- */
.gallery { display: grid; grid-template-columns: repeat(3, 340px); justify-content: space-between; gap: 28px 24px; padding: 28px 36px; border-radius: 16px; background: var(--shell); border: 1px solid var(--border); }
.gallery.dark { border-color: var(--border); }
.solo { height: 760px; display: flex; flex-direction: column; padding: 10px; border-radius: 14px; background: var(--shell); }
.solo .rp { margin: 0; flex: 1; border-radius: 12px; }
.solo-cap { margin: 0 0 8px 4px; color: var(--muted-foreground); font-size: 12px; }

body.single { background: var(--shell); }
body.single .doc { width: auto; padding: 0; margin: 0; }
body.single .win { border: 0; border-radius: 0; box-shadow: none; }
body.single .gallery { border: 0; border-radius: 0; }
body.single .switcher { display: none; }
</style>

<body>

<script>
const ASSET = '../../../apps/desktop/public'
const I = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${window.FOX_ICONS[name] || ''}</svg>`
const AV = (file) => `${ASSET}/avatars/experts/${file}.png`

/* ---------------- Current Fox chrome ---------------- */
function sidebar(active) {
  const contact = (img, name, text, n) => `<div class="contact"><img src="${ASSET}/avatars/${img}" alt=""><div><b>${name}</b><span>${text}</span></div><small>${n || ''}</small></div>`
  const convs = [['整理 2026 项目申报材料', 'run'], ['周报：设备运维进展'], ['码头调度算法对比'], ['用户访谈纪要']]
  return `<aside class="side">
    <div class="side-top"><div class="mode"><span class="on">${I('sparkles')}助手</span><span>${I('book-copy')}</span></div><div class="grow"></div><span class="sib">${I('search')}</span><span class="sib">${I('bell')}<i class="dot-red"></i></span></div>
    <div class="nav"><div>${I('message-circle-plus')}新建对话<small>Ctrl+N</small></div><div>${I('users')}专家</div><div>${I('blocks')}插件</div></div>
    <div class="sec"><span>小 Fox</span>${I('plus')}</div>
    ${contact('defaults/fox_calm.png', '小 Fox', '已把周报草稿放进资料库')}${contact('experts/Fox_DataAnalyst.png', '数据小 Fox', '本周指标已更新', 1)}
    <div class="sec"><span>对话</span><span style="display:flex;gap:10px">${I('plus')}${I('ellipsis')}</span></div>
    <div class="convs">${convs.map(([t, r]) => `<div class="${t === active ? 'on' : ''}"><span>${t}</span>${r ? I('loader-circle', 'run spin') : ''}</div>`).join('')}</div>
    <div class="foot"><img src="${ASSET}/avatars/defaults/fox_big_smile.png" alt=""><b>Hury</b><span class="sib">${I('sun')}</span><span class="sib">${I('settings')}</span></div>
  </aside>`
}
const win = ({ chat, panel = '', active = '整理 2026 项目申报材料' }) => `<div class="win scope">
  <header class="titlebar">
    <div class="tb-left"><img src="${ASSET}/avatars/fox-assistant.png" alt=""><span>${I('menu')}</span><span>${I('panel-left')}</span><span>${I('arrow-left')}</span><span class="off">${I('arrow-right')}</span></div>
    <div class="wctl"><span>${I('minus')}</span><span>${I('square')}</span><span>${I('x')}</span></div>

</div>`

/* ---------------- Chat ---------------- */
const topbar = (title, running, panelOpen) => `<header class="ctop">
  <span class="proj">${I('folder-open')}</span><strong>${title}</strong><span class="more">${I('ellipsis')}</span><div class="grow"></div>
  ${running ? '<span class="badge"><i></i>运行中</span>' : ''}
  <span class="tgl ${panelOpen ? 'on' : ''}">${I('panel-right')}</span>
</header>`
const chatRunning = (open) => `<main class="chat ${open ? 'with-panel' : ''}">
  ${topbar('整理 2026 项目申报材料', true, open)}
  <div class="thread"><div class="col">
    <div class="umsg"><div>帮我把「申报材料」知识库里的资料整理成一份申报书初稿，预算部分按附件里的明细表核对一遍。</div></div>
    <div class="amsg">
      <div class="proc">${I('chevron-right')}已处理 2 分 14 秒</div>
      <p>我先读了申报指南和你去年的申报书，确定了章节结构；预算部分会以《项目预算明细表》为准，和正文里出现的金额逐项核对。</p>
      <div class="filechip"><span class="ft">${I('file-text')}</span><div><b>2026 项目申报书（初稿）.docx</b><small>Word · 46 KB</small></div></div>
      <p>初稿已经写好前四章。现在让「资料核对助手」核对 12 份附件里的金额，核对完我会把差异列给你。</p>
      <div class="shimmer">${I('loader-circle', 'spin')}正在核对附件金额…</div>
    </div>
  </div></div>
  <div class="composer"><span class="plus">${I('plus')}</span><span class="grow">继续补充要求…</span><span class="ask">${I('circle-help')}询问</span><span class="send stop">${I('square')}</span></div>
</main>`
const chatEmpty = (open) => `<main class="chat ${open ? 'with-panel' : ''}">
  ${topbar('新对话', false, open)}
  <div class="thread"><div class="hello"><img src="${ASSET}/avatars/fox-assistant.png" alt=""><h1>今天想做点什么？</h1><p>描述你的任务，Fox 会一步步完成并把结果放在右边</p></div></div>
  <div class="composer"><span class="plus">${I('plus')}</span><span class="grow">给 Fox 发消息…</span><span class="ask">${I('circle-help')}询问</span><span class="send">${I('arrow-up')}</span></div>
</main>`

/* ---------------- Panel shell ---------------- */
const PAGES = {
  summary: ['layout-dashboard', '摘要'], files: ['folders', '文件'], knowledge: ['book-open', '资料库'], changes: ['file-pen', '更改'],
  activity: ['activity', '运行详情'], browser: ['globe-2', '网页与网络'], agents: ['bot', '协作助手'],
}
const FILE_TAB = ['file-text', '2026 项目申报书（初稿）.docx']
const tabbar = (tabs, active, menuOpen) => `<div class="rp-tabs">${tabs.map((t) => {
  const [icon, label] = typeof t === 'string' ? PAGES[t] : t
  const key = typeof t === 'string' ? t : label
  if (key !== active) return `<span class="rp-tab icon" title="${label}">${I(icon)}</span>`
  return `<span class="rp-tab on">${I(icon)}<span class="lbl">${label}</span>${key === 'summary' ? '' : I('x', 'x')}</span>`
}).join('')}<span class="rp-ic ${menuOpen ? 'on' : ''}">${I('plus')}</span><div class="grow"></div><span class="rp-ic">${I('maximize-2')}</span><span class="rp-ic">${I('panel-right')}</span></div>`
const rp = ({ tabs = ['summary'], active = 'summary', body, menu = false, overlay = '' }) =>
  `<aside class="rp">${tabbar(tabs, active, menu)}<div class="rp-body">${body}</div>${overlay}</aside>`
const head = (label, count, link = '全部', extra = '') => `<header class="rs-h"><span>${label}</span>${count != null ? `<small>${count}</small>` : ''}${extra}${link ? `<a>${link}</a>` : ''}</header>`
const section = (label, count, inner, link = `全部${I('chevron-right')}`, extra = '') => `<section class="rs">${head(label, count, link, extra)}<div class="rc">${inner}</div></section>`
const row = ({ tile, title, sub, trail = '', cls = '', mono = false, subCls = '', extra = '' }) =>
  `<div class="row ${cls}">${tile}<div class="tx"><b class="${mono ? 'mono' : ''}">${title}</b>${sub ? `<small class="${subCls}">${sub}</small>` : ''}${extra}</div><div class="trail">${trail}</div></div>`
const tile = (icon, cls = '') => `<span class="tile ${cls}">${I(icon)}</span>`
const avatar = (file) => `<span class="tile img"><img src="${AV(file)}" alt=""></span>`
const done = (label = '完成') => `<span class="pill">${I('check')}${label}</span>`
// In long lists a finished item needs no badge; plain grey text keeps titles readable.
const quietDone = '<span class="trail faint">已完成</span>'
const running = (label = '运行中') => `<span class="pill">${I('loader-circle', 'spin')}${label}</span>`
const failed = (label = '失败') => `<span class="pill err">${I('circle-x')}${label}</span>`

/* ---------------- 摘要 ---------------- */
const modelCard = (live) => section('模型', null, `
  ${row({ tile: tile('brain'), title: 'DeepSeek V4 Pro', sub: '深度思考 · 每轮询问', trail: I('chevrons-up-down') })}
  ${live ? `<div class="live">${I('loader-circle', 'spin')}<span><b>正在思考</b> · 第 7 步</span><span>2:14</span></div>` : ''}`, '')
const planCard = (state) => {
  const steps = state === 'done'
    ? [['done', '读取申报指南和去年申报书'], ['done', '写出申报书前四章'], ['done', '核对 12 份附件金额'], ['done', '列出金额差异并修正正文']]
    : [['done', '写出申报书前四章'], ['now', '核对 12 份附件金额', '资料核对助手正在处理'], ['todo', '列出金额差异并修正正文'], ['todo', '生成最终版并导出 PDF']]
  const mark = { done: 'circle-check', now: 'loader-circle', todo: 'circle-dashed' }
  const n = state === 'done' ? 7 : 4
  const total = state === 'done' ? 7 : 8
  return section('任务计划', `${n}/${total}`, `<div class="steps">
    <div class="earlier">${I('chevron-down')}3 个较早步骤</div>
    ${steps.map(([s, t, sub]) => `<div class="step ${s}">${I(mark[s], s === 'now' ? 'spin' : '')}<span>${t}${sub ? `<small>${sub}</small>` : ''}</span></div>`).join('')}
  </div><div class="progress"><span style="width:${Math.round(n / total * 100)}%"></span></div>`)
}
const filesCard = (state, hover) => {
  const rows = [['file-text', '2026 项目申报书（初稿）.docx', 'Word · 46 KB', '刚刚'], ['file-spreadsheet', '预算核对表.xlsx', 'Excel · 18 KB', '1 分钟前'], ['file-code', '申报材料目录.md', 'Markdown · 3 KB', '3 分钟前']]
  if (state === 'done') rows.unshift(['file-type', '2026 项目申报书（定稿）.pdf', 'PDF · 1.2 MB', '刚刚'])
  const shown = rows.slice(0, 3)

/* ---------------- Switcher ---------------- */
const params = new URLSearchParams(location.search)
const THEMES = [['graphite', '石墨'], ['paper', '暖纸'], ['mist', '雾蓝']]
function setTheme(t, mode) {
  const root = document.documentElement
  if (t) { root.dataset.colorTheme = t; localStorage.setItem('fox-mock-theme', t) }
  if (mode) { root.classList.toggle('dark', mode === 'dark'); localStorage.setItem('fox-mock-mode', mode) }
  render()
}
function renderSwitcher() {
  const mode = document.documentElement.classList.contains('dark') ? 'dark' : 'light'
  document.getElementById('switcher').innerHTML = `${I('palette')}
    <div class="seg">${THEMES.map(([k, l]) => `<button class="${theme() === k ? 'on' : ''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="seg"><button class="${mode === 'light' ? 'on' : ''}" onclick="setTheme(null,'light')">${I('sun')}浅色</button><button class="${mode === 'dark' ? 'on' : ''}" onclick="setTheme(null,'dark')">${I('moon')}深色</button></div>`
}

function render() {
  renderSwitcher()
  const only = params.get('frame')
  const doc = document.getElementById('doc')
  if (only) { document.body.classList.add('single'); doc.innerHTML = screens.find((s) => s.id === only).render(); return }
  const scroll = window.scrollY
  doc.innerHTML = `
  <header class="doc-hero"><h1>右侧栏重设计</h1><p>右侧栏统一成一种样式：灰色小标题在外，内容放进圆角小卡片，和小 Fox 详情侧栏一致。普通对话打开时默认显示「摘要」；文件、资料库、更改、运行详情、网页与网络、协作助手从「＋」打开，作为标签排在「摘要」右边。原来顶栏的「对话摘要」悬浮卡片取消。颜色直接引用 <code>apps/desktop/src/styles/themes.css</code>，右上角可以切换主题和深浅色。</p></header>
  <section class="doc-block"><h2>设计原则</h2><div class="principles">
    <div><b>一组一张卡片</b><span>每组内容是一张圆角小卡片，小标题在卡片外，右侧放数量和「全部 ›」或一个图标按钮。</span></div>
    <div><b>没有就不显示</b><span>某组内容为 0 时整张卡片隐藏；页面全空时显示一句说明。</span></div>
    <div><b>颜色只给问题</b><span>完成、进行中都用中性灰；失败用红色，需要你批准用橙色。</span></div>
    <div><b>只放用户认得的东西</b><span>不显示 token、上下文占比、内部事件名等；开发者模式另说。</span></div>
  </div></section>
  <section class="doc-block"><h2>各页面和现在的区别</h2>
    <table class="map"><thead><tr><th>页面</th><th>现在</th><th>重设计后</th></tr></thead><tbody>
      <tr><td>顶部</td><td>右侧栏首页是 6 个功能按钮；顶栏另有「对话摘要」悬浮卡片</td><td><b>摘要</b>就是首页，常驻第一个标签；其他页面从「＋」打开，不在前面的标签只显示图标</td></tr>
      <tr><td>文件</td><td>搜索框、版本列表、文件树上下堆叠，没有分组</td><td>搜索框一张卡片；文件版本按日期分组，可展开；项目文件树一张卡片</td></tr>
      <tr><td>文件预览</td><td>路径工具栏 + 预览</td><td>文件信息卡片（名称、状态、大小、打开 ▾）+ 纸张样式的预览卡片</td></tr>
      <tr><td>资料库</td><td>一个混合列表，每行带类型标签</td><td>分成「已绑定」「本次引用」两组，引用显示两行摘录</td></tr>
      <tr><td>更改</td><td>列表 + 详情头部徽章 + 命令输出</td><td>「更改」列表卡片 +「详情」卡片：退出码、耗时、目录、输出；文件显示对比</td></tr>
      <tr><td>运行详情</td><td>页面大标题 + 多个分区</td><td>去掉大标题；最近一次运行、目标、工具记录、自动放行记录、运行记录各一张卡片</td></tr>
      <tr><td>网页与网络</td><td>标签条 + 地址栏 + 预览</td><td>分段控件 + 地址栏卡片 + 圆角预览；网络记录按行显示状态</td></tr>
      <tr><td>协作助手</td><td>列表 +「显示更多」；点开是消息气泡</td><td>按进行中 / 已结束分组；消息记录分成任务、过程、回复三张卡片</td></tr>
    </tbody></table>
  </section>
  <nav class="toc">${screens.map((s, i) => `<a href="#${s.id}">${String(i + 1).padStart(2, '0')} ${s.title}</a>`).join('')}</nav>
  ${screens.map((s, i) => `<section class="frame" id="${s.id}">
    <div class="frame-head"><span class="no">${String(i + 1).padStart(2, '0')}</span><h2>${s.title}</h2><p>${s.desc}</p></div>
    ${s.render()}
    ${s.notes ? `<div class="notes">
      <div><h4>${I('check')}突出</h4><ul>${s.notes.focus.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <div><h4>${I('ellipsis')}收进链接 / 悬停</h4><ul>${s.notes.tucked.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <div><h4>${I('x')}去掉</h4><ul>${s.notes.removed.map((x) => `<li>${x}</li>`).join('')}</ul></div>
    </div>` : ''}
  </section>`).join('')}`
  window.scrollTo(0, scroll)
}
render()</script>
