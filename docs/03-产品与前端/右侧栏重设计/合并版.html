<!doctype html>
<html lang="zh-CN" data-color-theme="graphite">
<head>
<meta charset="utf-8" />
<title>Fox 右侧栏 · 合并版</title>
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Regular.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Medium.css" />
<link rel="stylesheet" href="../../../apps/desktop/node_modules/harmonyos-sans-sc-webfont-splitted/dist/Semibold.css" />
<!-- Colours and radii come straight from the app, so the mockup follows any theme change. -->
<link rel="stylesheet" href="../../../apps/desktop/src/styles/themes.css" />
<script src="icons.js"></script>
<script>
  (() => {
    const params = new URLSearchParams(location.search)
    document.documentElement.dataset.colorTheme = params.get('theme') || localStorage.getItem('fox-mock-theme') || 'graphite'
    document.documentElement.classList.toggle('dark', (params.get('mode') || localStorage.getItem('fox-mock-mode')) === 'dark')
  })()
</script>
<style>
/* The same derived tokens the app defines in globals.css; the panel uses only these. */
:root, .scope {
  --fox-canvas: var(--chat-background, var(--background));
  --fox-card: var(--card);
  --fox-panel: var(--muted);
  --fox-border: var(--border);
  --fox-border-strong: color-mix(in oklch, var(--border) 72%, var(--foreground) 28%);
  --fox-text: var(--foreground);
  --fox-muted: var(--muted-foreground);
  --fox-faint: color-mix(in oklch, var(--muted-foreground) 78%, var(--fox-canvas));
  --fox-hover: color-mix(in oklch, var(--fox-panel) 78%, var(--fox-card));
  --fox-selected: color-mix(in oklch, var(--foreground) 6%, transparent);
  --fox-sunk: color-mix(in oklch, var(--fox-panel) 45%, var(--fox-canvas));
  --fox-accent: var(--brand);
  --fox-accent-soft: var(--brand-soft);
  --fox-control-xs: 24px;
  --fox-control-sm: 28px;
  --fox-type-ui: 13px;
  --fox-type-meta: 12px;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  /* Context breakdown only: categories need distinct hues in every theme, which --chart-* (grey / one hue) cannot give. */
  --ctx-history: oklch(0.6 0.15 255);
  --ctx-tools: oklch(0.68 0.16 50);
  --ctx-system: oklch(0.64 0.11 175);
  --ctx-reserve: oklch(0.78 0.14 85);
  --ctx-margin: color-mix(in oklch, var(--muted-foreground) 45%, var(--fox-canvas));
  --shadow-sm: 0 1px 2px color-mix(in oklch, oklch(0.2 0 0) 6%, transparent);
  --shadow-md: 0 4px 16px color-mix(in oklch, oklch(0.2 0 0) 9%, transparent);
  --shadow-lg: 0 16px 45px color-mix(in oklch, oklch(0.2 0 0) 12%, transparent);
}
.dark, .scope.dark {
  color-scheme: dark;
  --fox-canvas: var(--card);
  --fox-card: color-mix(in oklch, var(--card) 92%, var(--foreground));
  --fox-hover: color-mix(in oklch, var(--fox-panel) 82%, var(--card));
  --fox-faint: color-mix(in oklch, var(--muted-foreground) 82%, var(--background));
  --fox-sunk: var(--background);
  --ctx-history: oklch(0.68 0.14 255);
  --ctx-tools: oklch(0.72 0.15 50);
  --ctx-system: oklch(0.7 0.1 175);
  --ctx-reserve: oklch(0.8 0.13 85);
  --ctx-margin: color-mix(in oklch, var(--muted-foreground) 70%, var(--fox-canvas));
  --shadow-sm: 0 1px 2px color-mix(in oklch, black 30%, transparent);
  --shadow-md: 0 6px 20px color-mix(in oklch, black 32%, transparent);
  --shadow-lg: 0 18px 55px color-mix(in oklch, black 35%, transparent);
}
:root { font-family: "HarmonyOS Sans SC", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; font-synthesis: none; color: var(--foreground); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
body { margin: 0; background: color-mix(in oklch, var(--shell) 70%, var(--muted)); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.grow { flex: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1.1s linear infinite; }

/* ---------- Doc shell ---------- */
.doc { width: 1360px; margin: 0 auto; padding: 56px 40px 120px; }
.doc-hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
.doc-hero p { margin: 0; max-width: 900px; color: var(--muted-foreground); font-size: 14px; line-height: 1.75; }
.doc-block { margin-top: 24px; padding: 28px 32px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
.doc-block h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.doc-block > p { margin: 0 0 20px; color: var(--muted-foreground); font-size: 13px; line-height: 1.7; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.toc a { padding: 6px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 13px; text-decoration: none; }
.toc a:hover { color: var(--foreground); }
.frame { margin-top: 64px; scroll-margin-top: 80px; }
.frame-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.frame-head .no { color: var(--fox-faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.frame-head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.frame-head p { margin: 0; color: var(--muted-foreground); font-size: 14px; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
.notes div { padding: 16px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
.notes h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.notes h4 svg { width: 14px; height: 14px; color: var(--muted-foreground); }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted-foreground); font-size: 13px; line-height: 1.75; }
.switcher { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-md); font-size: 13px; color: var(--muted-foreground); }
.switcher svg { width: 15px; height: 15px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--muted); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.seg .on { background: var(--background); color: var(--foreground); border-color: var(--border); }
body.single .doc { width: auto; padding: 24px; }
body.single .switcher { display: none; }
.gallery { display: grid; grid-template-columns: repeat(3, 340px); gap: 36px 40px; padding: 28px; border-radius: 16px; background: var(--shell); }
.gallery .cap { margin: 0 0 8px; color: var(--muted-foreground); font-size: 12.5px; }
.gallery .solo { position: relative; height: 705px; display: flex; overflow: hidden; border: 1px solid var(--fox-border); border-radius: 12px; background: var(--fox-canvas); }

/* ---------- Token specimens ---------- */
.spec { display: grid; grid-template-columns: 150px repeat(4, 1fr); align-items: center; row-gap: 14px; column-gap: 16px; font-size: 13px; }
.spec > .h { color: var(--muted-foreground); font-size: 12px; }
.spec > .k { font-weight: 500; }
.spec > .c { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.spec code { color: var(--muted-foreground); font: 11.5px/1.5 var(--mono); }
.spec .surface { padding: 10px 12px; border-radius: 10px; background: var(--fox-canvas); }
.spec-card { width: 180px; height: 48px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--fox-card); }
.spec-card.bad { box-shadow: 0 1px 2px color-mix(in oklch, var(--foreground) 6%, transparent); border-color: color-mix(in oklch, var(--border) 80%, transparent); border-radius: 12px; }
.spec-row { width: 200px; }

/* ---------- Fox window ---------- */
.win { position: relative; width: 1280px; height: 800px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--shell); border: 1px solid var(--border); box-shadow: var(--shadow-lg); color: var(--foreground); font-size: 13px; }
.titlebar { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; }
.tb-left { display: flex; align-items: center; gap: 2px; padding-left: 10px; color: var(--muted-foreground); }
.tb-left img { width: 20px; height: 20px; margin-right: 6px; }
.tb-left span { width: 28px; height: 28px; display: grid; place-items: center; }
.tb-left span.off { opacity: .45; }
.wctl { display: flex; height: 100%; }
.wctl span { width: 46px; display: grid; place-items: center; color: var(--muted-foreground); }
.wctl svg { width: 15px; height: 15px; }
.app { flex: 1; min-height: 0; display: flex; }
.side { width: 236px; flex: none; display: flex; flex-direction: column; padding: 6px 12px 12px 14px; }
.side-top { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; }
.mode { display: inline-flex; padding: 3px; border-radius: 999px; background: color-mix(in oklch, var(--foreground) 5%, transparent); }
.mode span { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: 999px; color: var(--muted-foreground); font-weight: 500; }
.mode span.on { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
.mode svg { width: 15px; height: 15px; }
.sib { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--fox-radius-control); color: var(--muted-foreground); }
.nav div { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 10px; font-size: 14px; }
.nav div small { margin-left: auto; color: var(--fox-faint); font-size: 12px; }
.nav svg { width: 17px; height: 17px; }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 4px; padding: 0 4px 0 8px; color: var(--muted-foreground); font-size: 12.5px; }
.sec svg { width: 15px; height: 15px; }
.convs div { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 10px; color: color-mix(in oklch, var(--foreground) 88%, var(--muted-foreground)); font-size: 13.5px; }
.convs div span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.convs div.on { background: color-mix(in oklch, var(--foreground) 6%, transparent); color: var(--foreground); font-weight: 500; }
.convs .run { width: 12px; height: 12px; color: var(--muted-foreground); }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 2px 0 6px; }
.foot img { width: 28px; height: 28px; border-radius: 50%; }
.foot b { flex: 1; font-weight: 500; font-size: 14px; }

/* One card holds the chat and the panel; a hairline separates them. */
.card { position: relative; flex: 1; min-width: 0; display: flex; margin: 2px 5px 5px 0; border-radius: 12px 12px 8px 12px; background: var(--fox-canvas); box-shadow: var(--shadow-sm); overflow: hidden; }
.chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.split { flex: none; width: 1px; background: var(--fox-border); }
.ctop, .rp-top { flex: none; height: 52px; display: flex; align-items: center; gap: 4px; }
.ctop { padding: 0 12px 0 14px; gap: 6px; }
.ctop strong { font-size: 14px; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--fox-hover); color: var(--fox-muted); font-size: 12px; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.thread { flex: 1; min-height: 0; overflow: hidden; padding: 12px 0 0; }
.col { max-width: 640px; margin: 0 auto; padding: 0 32px; }
.umsg { display: flex; justify-content: flex-end; margin: 8px 0 22px; }
.umsg div { max-width: 82%; padding: 10px 16px; border-radius: 20px; background: var(--foreground); color: var(--background); font-size: 14px; line-height: 1.7; }
.amsg { font-size: 14px; line-height: 1.85; color: color-mix(in oklch, var(--foreground) 92%, var(--muted-foreground)); }
.amsg p { margin: 0 0 10px; }
.proc { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--muted-foreground); font-size: 13px; }
.proc svg { width: 14px; height: 14px; }
/* Same recipe as .fox-artifact-chip in apps/desktop/src/styles/areas/chat.css. */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 6px; border: 1px solid var(--fox-border); border-radius: calc(var(--fox-radius-control) + 4px); background: var(--fox-card); color: var(--fox-text); font-size: 13px; }
.chip .ty, .ftype { flex: none; min-width: 32px; padding: 2px 6px; border: 1px solid var(--fox-border-strong); border-radius: var(--fox-radius-small); color: var(--fox-muted); font-size: 11px; font-weight: 600; line-height: 1.4; text-align: center; letter-spacing: .02em; }
.chip small { color: var(--fox-muted); font-size: 12px; }
.shimmer { display: inline-flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13.5px; }
.shimmer svg { width: 14px; height: 14px; }
.composer { flex: none; margin: 0 auto 16px; width: calc(100% - 64px); max-width: 640px; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px 0 10px; border-radius: 26px; background: var(--background); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--muted-foreground); font-size: 14px; }
.dark .composer { background: color-mix(in oklch, var(--card) 92%, var(--foreground)); }
.composer .plus { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); }
.composer .send { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--foreground); color: var(--background); }
.composer .send.stop svg { width: 12px; height: 12px; fill: currentColor; }
.hello { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 170px; }
.hello img { width: 72px; height: 72px; }
.hello h1 { margin: 0; font-size: 22px; font-weight: 600; }
.hello p { margin: 0; color: var(--muted-foreground); font-size: 13px; }

/* ---------- Shared controls (one recipe for the chat top bar and the panel) ---------- */
.ib { position: relative; width: var(--fox-control-sm); height: var(--fox-control-sm); flex: none; display: grid; place-items: center; border-radius: var(--fox-radius-control); color: var(--fox-muted); transition: background 140ms ease, color 140ms ease; }
.ib svg { width: 16px; height: 16px; }
.ib.sm { width: var(--fox-control-xs); height: var(--fox-control-xs); }
.ib.sm svg { width: 14px; height: 14px; }
.ib.hover, .ib:hover { background: var(--fox-hover); color: var(--fox-text); }
.ib.on { background: var(--fox-accent-soft); color: var(--fox-accent); }
.ib.focus { outline: 2px solid var(--ring); outline-offset: -2px; }
.tb { display: inline-flex; align-items: center; gap: 4px; height: var(--fox-control-xs); padding: 0 8px; border-radius: var(--fox-radius-control); color: var(--fox-muted); font-size: var(--fox-type-meta); white-space: nowrap; }
.tb svg { width: 13px; height: 13px; }
.tb.hover, .tb:hover { background: var(--fox-hover); color: var(--fox-text); }
.tb.danger { color: var(--destructive); }
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--fox-control-sm); padding: 0 10px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-control); background: var(--fox-card); color: var(--fox-text); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn svg { width: 14px; height: 14px; }
.btn .chev { width: 13px; height: 13px; margin-left: 1px; color: var(--fox-muted); }
.btn.on, .btn.hover { background: var(--fox-hover); }
.field { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-control); background: var(--fox-card); color: var(--fox-muted); font-size: 13px; }
.field svg { width: 14px; height: 14px; }
.box { overflow: hidden; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--fox-card); }
.menu { position: absolute; z-index: 5; width: 200px; padding: 4px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--popover); box-shadow: var(--shadow-md); font-size: 13px; }
.menu .lbl { padding: 6px 8px 4px; color: var(--fox-muted); font-size: 12px; }
.menu .it { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--fox-radius-control); }
.menu .it svg { width: 14px; height: 14px; color: var(--fox-muted); }
.menu .it.on { background: var(--fox-hover); }
.menu .sep { height: 1px; margin: 4px 0; background: var(--fox-border); }

/* ---------- Right panel ---------- */
.rp { position: relative; flex: none; width: 340px; min-width: 0; display: flex; flex-direction: column; color: var(--fox-text); font-size: var(--fox-type-ui); }
.rp-top { padding: 0 12px 0 10px; }
.rp-tab { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: var(--fox-control-sm); padding: 0 10px; border-radius: var(--fox-radius-control); color: var(--fox-muted); font-weight: 500; }
.rp-tab svg { width: 15px; height: 15px; }
.rp-tab .lbl { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rp-tab .x { width: 13px; height: 13px; margin: 0 -3px 0 2px; color: var(--fox-faint); }
.rp-tab.on { background: var(--fox-selected); color: var(--fox-text); }
.rp-tab.icon { flex: none; width: var(--fox-control-sm); padding: 0; justify-content: center; }
.rp-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0 16px 16px; }

/* Summary: flat rows, hairlines, no cards. */
.sm-row { display: flex; align-items: center; gap: 4px; width: calc(100% + 16px); height: 44px; margin: 0 -8px; padding: 0 8px; border: 0; border-radius: var(--fox-radius-control); background: none; color: inherit; font: inherit; text-align: left; }
.sm-row.hover { background: var(--fox-hover); }
.sm-row .lbl { font-size: 13.5px; }
.sm-row .chev { width: 14px; height: 14px; color: var(--fox-faint); transition: transform 160ms ease; }
.sm-row.open .chev { transform: rotate(90deg); }
.sm-row .val { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--fox-muted); font-size: var(--fox-type-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sm-row .val.warn { color: var(--warning); }
.sm-row .val.err { color: var(--destructive); }
/* The handle takes no room until the row is hovered or focused, then pushes the value left. */
.sm-row .grip { width: 0; height: 24px; margin-right: -4px; display: grid; place-items: center; overflow: hidden; opacity: 0; border-radius: var(--fox-radius-small); color: var(--fox-muted); cursor: grab; transition: width 140ms ease, opacity 140ms ease, margin 140ms ease; }
.sm-row .grip svg { width: 14px; height: 14px; }
.sm-row.hover .grip, .sm-row:hover .grip { width: 20px; margin: 0 -4px 0 2px; opacity: 1; }
.meter { width: 30px; height: 6px; border-radius: 999px; background: var(--fox-hover); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--fox-muted); }
.sm-group + .sm-group, .sm-group + .slot, .slot + .sm-group { border-top: 1px solid var(--fox-border); }
.sm-list { padding: 0 0 10px; margin-top: -4px; }
.sm-item { display: flex; align-items: center; gap: 9px; height: 32px; margin: 0 -8px; padding: 0 8px; border-radius: var(--fox-radius-control); color: var(--fox-text); }
.sm-item.hover { background: var(--fox-hover); }
.sm-item svg { width: 14px; height: 14px; color: var(--fox-muted); }
.sm-item span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sm-item small { flex: none; color: var(--fox-muted); font-size: var(--fox-type-meta); }
.sm-item.done span { color: var(--fox-muted); }
.sm-item small.warn { color: var(--warning); }
.sm-item small.err { color: var(--destructive); }
.sm-item.path span { color: var(--fox-muted); font: 12px/1 var(--mono); }
.sm-more { display: flex; margin: 2px 0 0; }
.sm-more .tb { margin-left: -8px; }
.sm-empty { margin: 14px 0 0; color: var(--fox-muted); font-size: 12.5px; line-height: 1.7; }
.slot { height: 45px; padding: 4px 0; }
.slot::before { content: ''; display: block; height: 100%; border: 1px dashed var(--fox-border-strong); border-radius: var(--fox-radius-control); background: var(--fox-hover); }
.lifted { position: absolute; left: 10px; right: 10px; z-index: 3; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-control); background: var(--fox-card); box-shadow: var(--shadow-md); transform: rotate(-.6deg); cursor: grabbing; }
.lifted .lbl { font-size: 13.5px; }
.lifted .chev { width: 14px; height: 14px; color: var(--fox-faint); }
.lifted .val { margin-left: auto; color: var(--warning); }
.lifted .grip { width: 20px; display: grid; place-items: center; margin: 0 -4px 0 2px; color: var(--fox-text); }
.lifted .grip svg { width: 14px; height: 14px; }
.reset { margin-top: 8px; }
.reset .tb { margin-left: -8px; }

/* Model row expanded: context occupancy. */
.ctx { padding: 2px 0 12px; }
.ctx-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.ctx-top b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ctx-top span { color: var(--fox-muted); font-size: var(--fox-type-meta); }
.ctx-top small { margin-left: auto; color: var(--fox-muted); font-size: var(--fox-type-meta); font-variant-numeric: tabular-nums; }
.ctx-bar { display: flex; gap: 2px; height: 6px; margin-bottom: 8px; border-radius: 999px; overflow: hidden; background: var(--fox-hover); }
.ctx-bar i { display: block; height: 100%; }
.ctx-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 46px; align-items: center; gap: 9px; height: 28px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ctx-row i { width: 9px; height: 9px; border-radius: 2px; }
.ctx-row i.free { border: 1px solid var(--fox-border-strong); }
.ctx-row b { font-weight: 400; color: var(--fox-text); text-align: right; }
.ctx-row small { color: var(--fox-muted); font-size: 12px; text-align: right; }
.ctx-row.rest { color: var(--fox-muted); }
.ctx-row.rest b { color: var(--fox-muted); }

/* ---------- Other pages: flat groups ---------- */
.grp { padding-bottom: 8px; }
.grp + .grp { border-top: 1px solid var(--fox-border); }
.gh { display: flex; align-items: center; gap: 6px; height: 38px; color: var(--fox-muted); font-size: 12.5px; font-weight: 500; }
.gh small { color: var(--fox-faint); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.gh .acts { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.sub { padding: 4px 0 2px; color: var(--fox-faint); font-size: 11.5px; }
.li { display: flex; align-items: center; gap: 10px; min-height: 40px; margin: 0 -8px; padding: 6px 8px; border-radius: var(--fox-radius-control); }
.li.tall { align-items: flex-start; }
.li.hover { background: var(--fox-hover); }
.li.sel { background: var(--fox-selected); }
.li > svg, .li > .ic { width: 16px; height: 16px; flex: none; color: var(--fox-muted); }
.li.tall > svg { margin-top: 2px; }
.li > img { width: 24px; height: 24px; flex: none; border-radius: 50%; object-fit: cover; background: var(--fox-hover); }
.li .tx { flex: 1; min-width: 0; display: grid; gap: 1px; }
.li .tx b { overflow: hidden; font-size: 13px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
.li .tx b.mono { font: 500 12.5px/1.5 var(--mono); }
.li .tx small { overflow: hidden; color: var(--fox-muted); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.li .tx small.err { color: var(--destructive); }
.li .tx small.warn { color: var(--warning); }
.li .tx p { display: -webkit-box; margin: 2px 0 0; overflow: hidden; color: var(--fox-muted); font-size: 12px; line-height: 1.6; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.st { flex: none; display: inline-flex; align-items: center; gap: 5px; color: var(--fox-muted); font-size: 12px; white-space: nowrap; }
.st svg { width: 13px; height: 13px; }
.st.err { color: var(--destructive); }
.st.warn { color: var(--warning); }
.li .tail { flex: none; display: flex; align-items: center; gap: 2px; margin-right: -4px; }
.top-gap { margin-top: 4px; }
.li.launch { min-height: 48px; }
.li.launch > .tile { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: var(--fox-radius-control); background: var(--fox-hover); color: var(--fox-muted); }
.li.launch > .tile svg { width: 15px; height: 15px; }
.li.launch.hover > .tile { background: var(--fox-card); color: var(--fox-text); }
.li.launch .go { width: 14px; height: 14px; color: var(--fox-faint); opacity: 0; }
.li.launch.hover .go { opacity: 1; }

/* Files */
.tree .tn { display: flex; align-items: center; gap: 6px; height: 30px; margin: 0 -8px; padding: 0 8px 0 calc(8px + var(--d) * 16px); border-radius: var(--fox-radius-control); font-size: 13px; }
.tree .tn .chev, .tree .tn .sp { width: 12px; height: 12px; flex: none; color: var(--fox-faint); }
.tree .tn > svg:not(.chev) { width: 15px; height: 15px; color: var(--fox-muted); }
.tree .tn span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tree .tn small { color: var(--fox-faint); font-size: 12px; }
.tree .tn.sel { background: var(--fox-selected); }

/* File preview */
.fh .fname { flex: 1; min-width: 0; overflow: hidden; font-size: 13.5px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
.fh-icons { flex: none; display: flex; gap: 2px; margin-right: -4px; }
.fh { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; }
.paper { flex: 1; min-height: 0; padding: 22px 22px 0; background: var(--fox-card); font-size: 12px; line-height: 1.75; color: color-mix(in oklch, var(--foreground) 88%, var(--muted-foreground)); }
.paper h3 { margin: 0; font-size: 15px; font-weight: 600; text-align: center; color: var(--fox-text); }
.paper .s { margin: 2px 0 12px; color: var(--fox-muted); font-size: 11px; text-align: center; }
.paper h4 { margin: 12px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--fox-text); }
.paper p { margin: 0 0 6px; }
.paper i { display: block; height: 6px; margin: 7px 0; border-radius: 3px; background: var(--fox-hover); }
.paper table { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 11.5px; }
.paper td { padding: 4px 6px; border: 1px solid var(--fox-border); }
.paper td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* Changes */
.facts { display: grid; grid-template-columns: 52px 1fr; row-gap: 4px; margin: 4px 0 10px; font-size: 12.5px; }
.facts dt { color: var(--fox-muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.out { padding: 10px 12px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--fox-sunk); color: var(--fox-muted); font: 11.5px/1.65 var(--mono); white-space: pre-wrap; }
.out .cmd { color: var(--fox-text); }
.out .e { color: var(--destructive); }
.diff { overflow: hidden; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-card); background: var(--fox-sunk); font: 11.5px/1.75 var(--mono); }
.diff div { display: grid; grid-template-columns: 28px 14px 1fr; padding-right: 8px; }
.diff i { padding-right: 6px; color: var(--fox-faint); font-style: normal; text-align: right; }
.diff u { color: var(--fox-muted); text-decoration: none; }
.diff .hunk { color: var(--fox-muted); background: var(--fox-hover); }
.diff .add { background: color-mix(in oklch, var(--success) 12%, transparent); }
.diff .del { background: color-mix(in oklch, var(--destructive) 10%, transparent); }

/* Activity */
.goal { padding: 2px 0 8px; }
.goal b { display: block; font-size: 13.5px; font-weight: 500; }
.goal small { color: var(--fox-muted); font-size: 12px; }
.bar { height: 4px; margin: 10px 0; border-radius: 999px; background: var(--fox-hover); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--fox-muted); }
.goal .acts { display: flex; gap: 6px; }
.stack { display: flex; flex: none; }
.stack img { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--fox-canvas); object-fit: cover; background: var(--fox-hover); }
.stack img + img { margin-left: -8px; }

/* Browser */
.seg2 { display: flex; gap: 2px; margin-bottom: 10px; }
.seg2 span { display: inline-flex; flex: 1; align-items: center; justify-content: center; gap: 6px; height: var(--fox-control-sm); border-radius: var(--fox-radius-control); color: var(--fox-muted); font-weight: 500; }
.seg2 span svg { width: 14px; height: 14px; }
.seg2 span small { color: var(--fox-faint); font-size: 12px; font-weight: 400; }
.seg2 .on { background: var(--fox-selected); color: var(--fox-text); }
.addr { display: flex; align-items: center; gap: 2px; height: 32px; margin-bottom: 10px; padding: 0 2px; border: 1px solid var(--fox-border); border-radius: var(--fox-radius-control); background: var(--fox-card); }
.addr .url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; color: var(--fox-muted); font-size: 12.5px; white-space: nowrap; }
.addr .url svg { width: 12px; height: 12px; }
.site { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.site-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: oklch(0.45 0.13 25); color: white; font-size: 12px; font-weight: 600; }
.site-bar b { width: 16px; height: 16px; border-radius: 50%; background: oklch(0.85 0.12 85); }
.site-nav { display: flex; gap: 14px; padding: 7px 12px; border-bottom: 1px solid #e5e5e5; background: #fafafa; color: #555; font-size: 11px; }
.site-body { flex: 1; padding: 12px; background: white; color: #333; font-size: 11.5px; line-height: 1.7; }
.site-body h6 { margin: 0 0 4px; font-size: 13px; line-height: 1.5; color: #111; }
.site-body small { color: #888; font-size: 10.5px; }
.site-body p { margin: 8px 0; }
.site-body i { display: block; height: 6px; margin: 7px 0; border-radius: 3px; background: #eee; }
.res { margin: 0 0 6px 26px; padding: 8px 10px; border-left: 2px solid var(--fox-border); color: var(--fox-muted); font-size: 12px; line-height: 1.6; }
.res b { display: block; color: var(--fox-text); font-size: 12px; font-weight: 500; }

/* Agent chat */
.back { display: flex; align-items: center; gap: 8px; padding: 0 0 10px; }
.back img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.back .tx { flex: 1; min-width: 0; display: grid; }
.back .tx b { font-size: 13.5px; font-weight: 500; }
.back .tx small { color: var(--fox-muted); font-size: 12px; }
.msg { font-size: 13px; line-height: 1.75; }
.msg p { margin: 0 0 4px; }
.msg small { color: var(--fox-muted); font-size: 12px; }
.msg ul { margin: 2px 0 0; padding-left: 18px; }
.livel { display: flex; align-items: center; gap: 6px; padding-top: 8px; color: var(--fox-muted); font-size: 12px; }
.livel svg { width: 13px; height: 13px; }
</style>

<body>
<div class="switcher" id="switcher"></div>
<div class="doc" id="doc"></div>
<script>
const ASSET = '../../../apps/desktop/public'
const I = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${window.FOX_ICONS[name] || ''}</svg>`
const AV = (file) => `${ASSET}/avatars/experts/${file}.png`
const theme = () => document.documentElement.dataset.colorTheme

function sidebar(active) {
  const convs = [['整理 2026 项目申报材料', 'run'], ['周报：设备运维进展'], ['码头调度算法对比'], ['用户访谈纪要']]
  return `<aside class="side">
    <div class="side-top"><div class="mode"><span class="on">${I('sparkles')}助手</span><span>${I('book-copy')}</span></div><div class="grow"></div><span class="sib">${I('search')}</span><span class="sib">${I('bell')}</span></div>
    <div class="nav"><div>${I('message-circle-plus')}新建对话<small>Ctrl+N</small></div><div>${I('users')}专家</div><div>${I('blocks')}插件</div></div>
    <div class="sec"><span>对话</span><span style="display:flex;gap:10px">${I('plus')}${I('ellipsis')}</span></div>
    <div class="convs">${convs.map(([t, r]) => `<div class="${t === active ? 'on' : ''}"><span>${t}</span>${r ? I('loader-circle', 'run spin') : ''}</div>`).join('')}</div>
    <div class="foot"><img src="${ASSET}/avatars/defaults/fox_big_smile.png" alt=""><b>Hury</b><span class="sib">${I('sun')}</span><span class="sib">${I('settings')}</span></div>
  </aside>`
}
const scopeAttrs = (dark) => dark ? `scope dark" data-color-theme="${theme()}` : 'scope'
const win = (inner, { dark = false, active = '整理 2026 项目申报材料' } = {}) => `<div class="win ${scopeAttrs(dark)}">
  <header class="titlebar">
    <div class="tb-left"><img src="${ASSET}/avatars/fox-assistant.png" alt=""><span>${I('menu')}</span><span>${I('panel-left')}</span><span>${I('arrow-left')}</span><span class="off">${I('arrow-right')}</span></div>
    <div class="wctl"><span>${I('minus')}</span><span>${I('square')}</span><span>${I('x')}</span></div>
  </header>
  <div class="app">${sidebar(active)}<div class="card">${inner}</div></div>
</div>`

/* ---------- Chat ---------- */
const chatTop = (title, running, panelOpen) => `<header class="ctop">
  <span class="ib">${I('folder-open')}</span><strong>${title}</strong><span class="ib">${I('ellipsis')}</span><div class="grow"></div>
  ${running ? '<span class="badge"><i></i>运行中</span>' : ''}
  ${panelOpen ? '' : `<span class="ib">${I('panel-right')}</span>`}
</header>`
const chip = (type, name, size) => `<span class="chip"><span class="ty">${type}</span>${name}<small>${size}</small></span>`
const chatRunning = (panelOpen = true) => `<main class="chat">
  ${chatTop('整理 2026 项目申报材料', true, panelOpen)}
  <div class="thread"><div class="col">
    <div class="umsg"><div>帮我把「申报材料」知识库里的资料整理成一份申报书初稿，预算部分按附件里的明细表核对一遍。</div></div>
    <div class="amsg">
      <div class="proc">${I('chevron-right')}已处理 2 分 14 秒</div>
      <p>我先读了申报指南和你去年的申报书，确定了章节结构；预算部分会以《项目预算明细表》为准，和正文里出现的金额逐项核对。</p>
      <div class="chips">${chip('DOCX', '2026 项目申报书（初稿）.docx', '46KB')}${chip('HTML', '项目介绍.html', '13KB')}</div>
      <p>初稿已经写好前四章。现在让「资料核对助手」核对 12 份附件里的金额，核对完我会把差异列给你。</p>
      <div class="shimmer">${I('loader-circle', 'spin')}正在核对附件金额…</div>
    </div>
  </div></div>
  <div class="composer"><span class="plus">${I('plus')}</span><span class="grow">继续补充要求…</span><span class="send stop">${I('square')}</span></div>
</main>`
const chatEmpty = () => `<main class="chat">
  ${chatTop('新对话', false, true)}
  <div class="thread"><div class="hello"><img src="${ASSET}/avatars/fox-assistant.png" alt=""><h1>今天想做点什么？</h1><p>描述你的任务，Fox 会一步步完成并把结果放在右边</p></div></div>
  <div class="composer"><span class="plus">${I('plus')}</span><span class="grow">给 Fox 发消息…</span><span class="send">${I('arrow-up')}</span></div>
</main>`

/* ---------- Panel shell ---------- */
const PAGES = {
  summary: ['layout-dashboard', '摘要'], files: ['folders', '文件'], knowledge: ['book-open', '资料库'], changes: ['file-pen', '更改'],
  activity: ['activity', '运行详情'], browser: ['globe-2', '网页与网络'], agents: ['bot', '协作助手'],
}
const FILE_TAB = ['file-text', '2026 项目申报书（初稿）.docx']
const tabbar = (tabs, active, hover) => `<div class="rp-top">${tabs.map((t) => {
  const [icon, label] = typeof t === 'string' ? PAGES[t] : t
  const key = typeof t === 'string' ? t : label
  if (key !== active) return `<span class="rp-tab icon" title="${label}">${I(icon)}</span>`
  return `<span class="rp-tab on">${I(icon)}<span class="lbl">${label}</span>${key === 'summary' ? '' : I('x', 'x')}</span>`
}).join('')}<div class="grow"></div>
  <span class="ib ${hover === 'plus' ? 'hover' : ''}">${I('plus')}</span><span class="ib">${I('maximize-2')}</span><span class="ib on">${I('panel-right')}</span></div>`
const rp = ({ tabs = ['summary'], active = 'summary', body, hover = '', overlay = '' }) =>
  `<aside class="rp">${tabbar(tabs, active, hover)}<div class="rp-body">${body}</div>${overlay}</aside>`
const withPanel = (panel, chat = chatRunning()) => chat + '<div class="split"></div>' + panel

/* ---------- Summary ---------- */
const row = (label, value, { open = false, expandable = true, tone = '', hover = false, meter = null } = {}) =>
  `<button class="sm-row ${open ? 'open' : ''} ${hover ? 'hover' : ''}">
    <span class="lbl">${label}</span>${expandable ? I('chevron-right', 'chev') : ''}
    <span class="val ${tone}">${value}${meter !== null ? `<span class="meter"><i style="width:${meter}%"></i></span>` : ''}</span>
    <span class="grip" title="拖动调整顺序">${I('grip-vertical')}</span>
  </button>`
const item = (icon, text, status = '', { cls = '', tone = '', iconCls = '' } = {}) =>
  `<div class="sm-item ${cls}">${I(icon, iconCls)}<span>${text}</span>${status ? `<small class="${tone}">${status}</small>` : ''}</div>`
const group = (head, items = '') => `<section class="sm-group">${head}${items ? `<div class="sm-list">${items}</div>` : ''}</section>`
const more = (text) => `<div class="sm-more"><span class="tb">${text}${I('chevron-right')}</span></div>`

const TASKS = [['读取申报指南和去年的申报书', 'done'], ['确定申报书章节结构', 'done'], ['写申报书前四章', 'done'], ['核对 12 份附件里的金额', 'run'], ['整理差异清单', 'todo']]
const taskItems = (hoverIndex = -1) => TASKS.map(([t, s], i) =>
  item(s === 'done' ? 'check' : s === 'run' ? 'loader-circle' : 'circle-dashed', t, s === 'run' ? '进行中' : '', { cls: `${s === 'done' ? 'done' : ''} ${i === hoverIndex ? 'hover' : ''}`, iconCls: s === 'run' ? 'spin' : '' })).join('')

const CTX = [['history', '历史消息', '82.1k', 41.1], ['tools', '工具定义', '10.9k', 5.5], ['system', '系统提示', '6.7k', 3.4], ['reserve', '输出预留', '8.0k', 4.0], ['margin', '安全余量', '7.6k', 3.8]]
const contextBlock = () => `<div class="ctx">
  <div class="ctx-top"><b>58%</b><span>上下文已用</span><small>115.3k / 200k</small></div>
  <div class="ctx-bar">${CTX.map(([k, , , p]) => `<i style="width:${p}%;background:var(--ctx-${k})"></i>`).join('')}</div>
  ${CTX.map(([k, l, t, p]) => `<div class="ctx-row"><i style="background:var(--ctx-${k})"></i><span>${l}</span><b>${t}</b><small>${p.toFixed(1)}%</small></div>`).join('')}
  <div class="ctx-row rest"><i class="free"></i><span>剩余可用</span><b>84.7k</b><small>42.4%</small></div>

</div>`

const SUMMARY = {
  project: () => group(row('项目', '申报材料')),
  model: (open) => group(row('模型', 'DeepSeek-V3.2', { open }), open ? contextBlock() : ''),
  tasks: (open, hoverIndex) => group(row('任务计划', '3 / 5', { open, meter: 60 }), open ? taskItems(hoverIndex) : ''),
  files: (hover) => group(row('生成文件', '2 个', { hover })),
  procs: () => group(row('后台程序', '1 个运行中')),
  agents: () => group(row('协作助手', '1 个需要你批准', { tone: 'warn' })),
  sources: () => group(row('资料来源', '4 条')),
}
const summaryRunning = (hover) => [SUMMARY.project(), SUMMARY.model(false), SUMMARY.tasks(true, hover ? 3 : -1), SUMMARY.files(hover), SUMMARY.procs(), SUMMARY.agents(), SUMMARY.sources()].join('')
const summaryModel = () => [SUMMARY.project(), SUMMARY.model(true), SUMMARY.tasks(false), SUMMARY.files(false), SUMMARY.procs(), SUMMARY.agents(), SUMMARY.sources()].join('')
/* 协作助手 is dragged from 6th place to 3rd; the list already shows where it will land. */
const summaryDrag = () => [SUMMARY.project(), SUMMARY.model(false), '<div class="slot"></div>', SUMMARY.tasks(false), SUMMARY.files(false), SUMMARY.procs(), SUMMARY.sources()].join('')
  + `<div class="lifted" style="top:80px"><span class="lbl">协作助手</span>${I('chevron-right', 'chev')}<span class="val">1 个需要你批准</span><span class="grip">${I('grip-vertical')}</span></div>`
  + `<div class="reset"><span class="tb">${I('rotate-ccw')}恢复默认顺序</span></div>`
const summaryExpanded = () => [
  group(row('项目', '申报材料', { open: true }), item('folder-open', 'D:\\工作\\2026 申报\\申报材料', '', { cls: 'path' }) + item('external-link', '打开项目文件夹')),
  group(row('模型', 'DeepSeek-V3.2')),
  group(row('任务计划', '5 / 5', { meter: 100 })),
  group(row('生成文件', '2 个', { open: true }), item('file-text', '2026 项目申报书（初稿）.docx', '新建') + item('file-code', '项目介绍.html', '新建')),
  group(row('协作助手', '2 个', { open: true }), item('bot', '资料核对助手', '已完成') + item('bot', '格式检查助手', '失败', { tone: 'err' })),
  group(row('资料来源', '6 条', { open: true }), item('book-open', '申报材料（知识库）', '已绑定') + item('file-text', '2026 年度申报指南.pdf') + item('file-spreadsheet', '项目预算明细表.xlsx') + more('查看全部 6 条')),
].join('')
const summaryEmpty = () => [group(row('项目', '未选择', { expandable: false })), group(row('模型', 'DeepSeek-V3.2'))].join('')
  + `<p class="sm-empty">开始对话后，任务计划、生成文件和协作助手会显示在这里。</p>`

/* ---------- Switcher ---------- */
const params = new URLSearchParams(location.search)
const THEMES = [['graphite', '石墨'], ['paper', '暖纸'], ['mist', '雾蓝']]
function setTheme(t, mode) {
  const root = document.documentElement
  if (t) { root.dataset.colorTheme = t; localStorage.setItem('fox-mock-theme', t) }
  if (mode) { root.classList.toggle('dark', mode === 'dark'); localStorage.setItem('fox-mock-mode', mode) }
  render()
}
function renderSwitcher() {
  const mode = document.documentElement.classList.contains('dark') ? 'dark' : 'light'
  document.getElementById('switcher').innerHTML = `${I('palette')}
    <div class="seg">${THEMES.map(([k, l]) => `<button class="${theme() === k ? 'on' : ''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="seg"><button class="${mode === 'light' ? 'on' : ''}" onclick="setTheme(null,'light')">${I('sun')}浅色</button><button class="${mode === 'dark' ? 'on' : ''}" onclick="setTheme(null,'dark')">${I('moon')}深色</button></div>`
}
function render() {
  renderSwitcher()
  const only = params.get('frame')
  const doc = document.getElementById('doc')
  if (only === 'tokens') { document.body.classList.add('single'); doc.innerHTML = specimens(); return }
  if (only) { document.body.classList.add('single'); doc.innerHTML = screens.find((s) => s.id === only).render(); return }
  const scroll = window.scrollY
  doc.innerHTML = `
  <header class="doc-hero"><h1>右侧栏 · 合并版</h1><p>右侧栏并进对话卡片的右边，中间用一条浅灰细线分开。所有页面都是平铺的行：组和组之间一条细线，没有卡片和阴影；只有输入框、网页和文件预览、命令输出这类「内容框」带 1px 边框。按钮、悬停、选中、圆角和对话顶栏共用一套 token。颜色直接引用 <code>apps/desktop/src/styles/themes.css</code>，右上角可以切换主题和深浅色。</p></header>
  ${specimens()}
  <nav class="toc">${screens.map((s, i) => `<a href="#${s.id}">${String(i + 1).padStart(2, '0')} ${s.title}</a>`).join('')}</nav>
  ${screens.map((s, i) => `<section class="frame" id="${s.id}">
    <div class="frame-head"><span class="no">${String(i + 1).padStart(2, '0')}</span><h2>${s.title}</h2><p>${s.desc}</p></div>
    ${s.render()}
    ${s.notes ? `<div class="notes">
      <div><h4>${I('check')}突出</h4><ul>${s.notes.focus.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <div><h4>${I('ellipsis')}收进展开 / 悬停</h4><ul>${s.notes.tucked.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <div><h4>${I('x')}去掉</h4><ul>${s.notes.removed.map((x) => `<li>${x}</li>`).join('')}</ul></div>
    </div>` : ''}
  </section>`).join('')}`
  window.scrollTo(0, scroll)
}
render()
</script>
