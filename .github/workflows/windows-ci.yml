name: Windows CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      # Narrow manual re-check. Off (and absent on push / pull_request) means the
      # full workflow, unchanged. On: only the filtered Rust Host suite and the
      # Agent Runtime standalone build + packaged Kernel worker test run; desktop
      # bun, agent backend (ACP), Zvec / ONNX smoke, Kernel core cargo tests, the
      # protocol check, the full Agent Runtime suite and the Host performance
      # baseline are skipped.
      # acp (targeted only): also run the Agent backend (ACP) jobs (Windows and
      # Linux).
      targeted:
        description: Targeted run (filtered Rust Host + Runtime package only)
        type: boolean
        default: false
      rust_test_filter:
        description: Targeted only. Space-separated libtest name filters (substring, any match); empty = whole Host suite
        type: string
        default: 'runtime_host::delivery window_resize'
      acp:
        description: Targeted only. Also run the Agent backend (ACP) jobs, Windows and Linux (fox-agent-backend --features acp)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Desktop + profile build. Self-contained so a long Agent Runtime or Rust run
  # can never push this job past its (much smaller) time budget.
  desktop-build:
    name: Desktop build + profile isolation
    if: ${{ !inputs.targeted }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ZVEC_AUTO_BUILD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the desktop suite is validated against this runner version.
          bun-version: 1.3.14

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # A frozen install must not rewrite dependency declarations. If it does,
      # the lockfile and package.json files have drifted apart.
      - name: Verify install left dependency files untouched
        shell: pwsh
        run: |
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json apps/desktop/package.json
          if ($LASTEXITCODE -ne 0) { Write-Error 'pnpm install --frozen-lockfile rewrote the lockfile or dependency declarations'; exit 1 }

      # Two React copies reach the bundle as two runtimes; the root-level
      # border-beam declaration used to pull a second react-dom peer in.
      - name: Verify a single React copy
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'node_modules\.pnpm') -Directory |
            Where-Object { $_.Name -match '^(react|react-dom)@' } |
            ForEach-Object { ($_.Name -split '_')[0] } |
            Sort-Object -Unique
          if ($pkgs.Count -gt 2) { Write-Error "Multiple React copies found: $($pkgs -join ', ')"; exit 1 }
          "React copies: $($pkgs -join ', ')"

      - name: Verify contract fixtures
        run: pnpm contract-fixtures:verify

      - name: Test contract fixture validator
        run: pnpm contract-fixtures:test

      # Output is also kept in .test-target so the summary step below can list
      # failures without the log download (GitHub bash shell runs with pipefail).
      - name: Test desktop
        shell: bash
        run: |
          mkdir -p .test-target
          bun test ./apps/desktop/tests --isolate --path-ignore-patterns "**/a0-performance.test.tsx" 2>&1 | tee .test-target/desktop-bun.log

      # Diagnostics only: lists failing tests in the job summary and as
      # annotations. It never changes the job result.
      - name: Summarize desktop test failures
        if: ${{ always() }}
        continue-on-error: true
        run: python .github/scripts/ci_failure_summary.py bun "desktop-build (bun)" ".test-target/desktop-bun.log"

      # The steps below run even when an earlier test step failed (a failed step
      # still fails the job), so one red suite does not hide typecheck, build or
      # profile-isolation results. They are skipped only when the run is
      # cancelled or dependencies never installed.
      - name: Test desktop performance baseline in isolation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test ./apps/desktop/tests/a0-performance.test.tsx --max-concurrency=1

      - name: Build desktop and run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # Profile build must compile with react-dom/profiling and pass the
      # profile isolation check (telemetry, harness, real-app controller, foxPerf
      # entry and profiling renderer all present). Browser perf smoke stays a
      # manual/periodic task (see apps/desktop/scripts/prof-smoke.mjs).
      - name: Build profile variant and verify isolation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir apps/desktop build:profile

  # Agent Runtime runs in its own job: the node --test suite is long (~40min on
  # a shared runner). Splitting it out prevents the other checks from being
  # cancelled when the single serial job hits the workflow timeout.
  agent-runtime:
    name: Agent Runtime tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # build:sidecar compiles the standalone Runtime with `bun build --compile`.
      - name: Configure Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Agent Runtime
        if: ${{ !inputs.targeted }}
        shell: bash
        run: |
          mkdir -p .test-target
          pnpm runtime:test 2>&1 | tee .test-target/agent-runtime-test.log

      # Diagnostics only; never changes the job result.
      - name: Summarize Agent Runtime test failures
        if: ${{ always() }}
        continue-on-error: true
        run: python .github/scripts/ci_failure_summary.py tap "agent-runtime" ".test-target/agent-runtime-test.log"

      - name: Build standalone Runtime
        run: pnpm runtime:build

  # Rust Host tests in their own job with an explicit compile-friendly budget.
  rust-host:
    name: Rust Host tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ZVEC_AUTO_BUILD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Test Kernel core and shared protocol
        if: ${{ !inputs.targeted }}
        run: cargo test -p fox-agent-kernel -p fox-engine-protocol

      - name: Check generated protocol and JavaScript contract
        if: ${{ !inputs.targeted }}
        shell: pwsh
        run: |
          pnpm protocol:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm protocol:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Rust Host tests still run when the generated-protocol check fails (the
      # job stays failed), so a stale schema does not hide Host test results.
      - name: Test Rust Host without optional Zvec
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        env:
          RUST_TEST_FILTER: ${{ inputs.targeted && inputs.rust_test_filter || '' }}
        run: |
          $filters = @("$env:RUST_TEST_FILTER" -split '\s+' | Where-Object { $_ })
          if ($filters.Count -gt 0) { Write-Host "Targeted Rust Host filters: $($filters -join ', ')" }
          ./scripts/test-desktop-rust.ps1 -Mode Suite -TestFilter $filters -TimeoutSeconds 1800

      - name: Test Rust Host performance baseline in isolation
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !inputs.targeted }}
        shell: pwsh
        run: ./scripts/test-desktop-rust.ps1 -Mode Performance -TimeoutSeconds 300

      # Diagnostics only: the Host failure names otherwise sit in the log
      # artifact, which needs a login. Never changes the job result.
      - name: Summarize Rust Host test failures
        if: ${{ always() }}
        continue-on-error: true
        run: python .github/scripts/ci_failure_summary.py cargo "rust-host" ".test-target/rust-host-runs/*/test.stdout.log"

      - name: Upload Rust Host test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-host-test-logs
          path: .test-target/rust-host-runs/**
          if-no-files-found: ignore

  # External agent backends (ACP): fox-agent-backend with the acp feature.
  # Real-backend tests stay gated off (FOX_TEST_REAL_ACP unset). Runs on full
  # runs, and on targeted runs when the acp input is set.
  agent-backend:
    name: Agent backend (ACP) tests
    if: ${{ !inputs.targeted || inputs.acp }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: agent-backend-acp

      - name: Test fox-agent-backend (acp)
        run: cargo test -p fox-agent-backend --features acp --no-fail-fast

  # Plan B3: the external-backend layer builds and tests on Linux on its own
  # (no desktop crate, no Windows-only code outside cfg(windows)).
  agent-backend-linux:
    name: Agent backend (ACP) tests (Linux)
    if: ${{ !inputs.targeted || inputs.acp }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: agent-backend-acp-linux

      - name: Test fox-agent-backend (acp)
        run: cargo test -p fox-agent-backend --features acp --no-fail-fast

  vector-runtime-smoke:
    name: Zvec offline smoke
    if: ${{ !inputs.targeted }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ZVEC_AUTO_BUILD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned Zvec native resource
        uses: actions/cache@v4
        with:
          path: .test-target/zvec
          key: zvec-prebuilt-0.6.0-x86_64-pc-windows-msvc-c823448a39a0f69aacdfe1fe06aaccb0e26eb9e0a4eea65fbd96edf749093152

      - name: Prepare pinned Zvec native resource
        shell: pwsh
        run: ./scripts/prepare-zvec-resource.ps1 -Destination .test-target/zvec/0.6.0

      - name: Run real Zvec offline smoke
        shell: pwsh
        run: ./scripts/zvec-offline-smoke.ps1

  onnx-runtime-smoke:
    name: ONNX Runtime offline smoke
    if: ${{ !inputs.targeted }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned ONNX model package
        uses: actions/cache@v4
        with:
          path: .test-target/onnx-models
          key: onnx-multilingual-e5-small-761b726dd34fb83930e26aab4e9ac3899aa1fa78-model-4d24e2bc01a447951524466ef533e52944bf48509e6552810bcee1a2711cb02c-tokenizer-0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39

      - name: Prepare pinned ONNX test model
        shell: pwsh
        run: ./scripts/prepare-onnx-model.ps1 -Destination .test-target/onnx-models/multilingual-e5-small-761b726dd34fb83930e26aab4e9ac3899aa1fa78

      - name: Run real ONNX Runtime offline smoke
        shell: pwsh
        run: ./scripts/onnx-offline-smoke.ps1
