name: Windows CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Desktop + profile build. Self-contained so a long Agent Runtime or Rust run
  # can never push this job past its (much smaller) time budget.
  desktop-build:
    name: Desktop build + profile isolation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ZVEC_AUTO_BUILD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contract fixtures
        run: pnpm contract-fixtures:verify

      - name: Test contract fixture validator
        run: pnpm contract-fixtures:test

      - name: Test desktop
        run: bun test ./apps/desktop/tests --path-ignore-patterns "**/a0-performance.test.tsx"

      - name: Test desktop performance baseline in isolation
        run: bun test ./apps/desktop/tests/a0-performance.test.tsx --max-concurrency=1

      - name: Build desktop and run typecheck
        run: pnpm build

      # Profile build must compile with react-dom/profiling and pass the
      # profile isolation check (telemetry, harness, real-app controller, foxPerf
      # entry and profiling renderer all present). Browser perf smoke stays a
      # manual/periodic task (see apps/desktop/scripts/prof-smoke.mjs).
      - name: Build profile variant and verify isolation
        run: pnpm --dir apps/desktop build:profile

  # Agent Runtime runs in its own job: the node --test suite is long (~40min on
  # a shared runner). Splitting it out prevents the other checks from being
  # cancelled when the single serial job hits the workflow timeout.
  agent-runtime:
    name: Agent Runtime tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Agent Runtime
        run: pnpm runtime:test

      - name: Build standalone Runtime
        run: pnpm runtime:build

      - name: Test packaged Kernel worker
        shell: pwsh
        run: |
          $env:FOX_KERNEL_WORKER_BINARY = Join-Path $env:GITHUB_WORKSPACE 'services\agent-runtime\dist\fox-agent-runtime-x86_64-pc-windows-msvc.exe'
          node --test services/agent-runtime/test/pi-kernel-worker.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Rust Host tests in their own job with an explicit compile-friendly budget.
  rust-host:
    name: Rust Host tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ZVEC_AUTO_BUILD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Kernel core and shared protocol
        run: cargo test -p fox-agent-kernel -p fox-engine-protocol

      - name: Check generated protocol and JavaScript contract
        shell: pwsh
        run: |
          pnpm protocol:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm protocol:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Rust Host without optional Zvec
        shell: pwsh
        run: ./scripts/test-desktop-rust.ps1 -Mode Suite -TimeoutSeconds 1800

      - name: Test Rust Host performance baseline in isolation
        shell: pwsh
        run: ./scripts/test-desktop-rust.ps1 -Mode Performance -TimeoutSeconds 300

      - name: Upload Rust Host test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-host-test-logs
          path: .test-target/rust-host-runs/**
          if-no-files-found: ignore

  vector-runtime-smoke:
    name: Zvec offline smoke (resource-gated)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ZVEC_AUTO_BUILD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect packaged Zvec resources
        id: resources
        shell: pwsh
        run: |
          $resourceDir = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\resources\vector'
          $dllPath = Join-Path $resourceDir 'zvec_c_api.dll'
          $importLibraryPath = Join-Path $resourceDir 'zvec_c_api.lib'
          if (-not (Test-Path -LiteralPath $dllPath -PathType Leaf)) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Zvec offline smoke 未启用：仓库没有官方 zvec_c_api.dll。默认构建保持无原生资源通过，未伪造 Smoke 成功。'
            exit 0
          }
          if (-not (Test-Path -LiteralPath $importLibraryPath -PathType Leaf)) {
            throw '发现 zvec_c_api.dll，但缺少同目录的 zvec_c_api.lib；Windows/MSVC Smoke 明确失败。'
          }
          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "resource_dir=$resourceDir" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '检测到官方 Zvec Windows x64/MSVC 资源，将执行真实离线 Smoke。'

      - name: Run real Zvec offline smoke
        if: steps.resources.outputs.enabled == 'true'
        shell: pwsh
        env:
          ZVEC_LIB_DIR: ${{ steps.resources.outputs.resource_dir }}
        run: ./scripts/zvec-offline-smoke.ps1

  onnx-runtime-smoke:
    name: ONNX Runtime offline smoke (resource-gated)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Detect complete ONNX package
        id: resources
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\resources\models'
          $packages = @()
          if (Test-Path -LiteralPath $modelRoot -PathType Container) {
            $packages = @(Get-ChildItem -LiteralPath $modelRoot -Directory | Where-Object {
              (Test-Path -LiteralPath (Join-Path $_.FullName 'manifest.json') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'model.onnx') -PathType Leaf)
            })
          }
          if ($packages.Count -eq 0) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'ONNX Runtime offline gate 未通过：仓库没有完整的 manifest.json + model.onnx + onnxruntime.dll 资源；未伪造 Smoke 成功。'
            exit 0
          }
          if ($packages.Count -ne 1) {
            throw 'ONNX offline smoke requires exactly one complete package in CI; set an explicit package selection before adding more models.'
          }
          $packageDir = $packages[0].FullName
          $runtimePath = Join-Path $packageDir 'onnxruntime.dll'
          if (-not (Test-Path -LiteralPath $runtimePath -PathType Leaf)) {
            throw "ONNX package is incomplete: missing $runtimePath"
          }
          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_dir=$packageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "检测到完整 ONNX package，将执行真实离线 Smoke：$packageDir"

      - name: Run real ONNX Runtime offline smoke
        if: steps.resources.outputs.enabled == 'true'
        shell: pwsh
        env:
          FOX_ONNX_MODEL_DIR: ${{ steps.resources.outputs.package_dir }}
        run: ./scripts/onnx-offline-smoke.ps1
