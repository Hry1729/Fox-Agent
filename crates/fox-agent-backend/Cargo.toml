[package]
name = "fox-agent-backend"
version = "0.1.0"
edition = "2021"
publish = false
description = "Public AgentBackend port for Fox (four-agent plan v0.3.1, section 5-6): session binding, capability declaration, reverse requests, cancel/outcome-unknown settlement, terminal arbitration, config precedence, legacy mapping, and the ACP client used by the pi / Codex / DeepSeek backends."

[features]
default = []
# The ACP client (agent-client-protocol, stable v1) and process launch.
acp = ["dep:agent-client-protocol", "dep:tokio", "dep:tokio-util", "dep:futures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = { version = "=3.4.0", optional = true }
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"

# Windows only: ownership / WRITE_DAC preflight and the exposure audit for the
# srt sandbox (src/winacl.rs), and the Job Object that contains the backend
# process tree (src/acp.rs). Already in the workspace lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
