[package]
name = "fox-agent-backend"
version = "0.1.0"
edition = "2021"
publish = false
description = "Public AgentBackend port for Fox (four-agent plan v0.3.1, section 5-6): session binding, capability declaration, reverse requests, cancel/outcome-unknown settlement, terminal arbitration, config precedence, legacy mapping, and the ACP client used by the pi / Codex / DeepSeek backends."

[features]
default = []
# The ACP client (agent-client-protocol, stable v1) and process launch.
acp = ["dep:agent-client-protocol", "dep:tokio", "dep:tokio-util", "dep:futures"]
# Opt-in: runs tests/host_routing_sqlite.rs (the agent_backend migration SQL and
# immutability trigger against a real, bundled SQLite). Off by default so the
# ordinary test run does not need a C compiler; never enabled by the desktop.
sqlite-tests = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"
sha2 = "0.10.9"
toml = "=0.8.2"
agent-client-protocol = { version = "=3.4.0", optional = true }
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures = { version = "0.3", optional = true }
# Only with feature `sqlite-tests`. Same version/feature as the desktop crate,
# already in the workspace lock.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Unix: process-group signals and the stop confirmation (src/proctree.rs).
# Already in the workspace lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

# Windows only: the Job Object that contains the backend process tree
# (src/acp.rs), the current user's SID (src/external_home.rs), random bytes
# (src/launch.rs) and the preview port owner lookup (src/preview.rs).
# Already in the workspace lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
# Windows: canonical paths without the `\\?\` prefix (src/sandbox.rs
# path normalization). Already in the workspace lock.
dunce = "1"

